/* Coach is er weer uit: Robin gebruikte het niet. Het blok staat nog wel in dit
   bestand, maar is nergens meer aangesloten — net als Maatje. Wil je het terug,
   dan zet je hier "coach" in plaats van "tips" en de routes in render() terug. */
const TABS=[["train","Train"],["log","Logboek"],["prog","Voortgang"],["tips","Tips"],["meer","Meer"]];
let page="train", pageArg=null;
function go(p,arg){ page=p; pageArg=arg||null; const v=$("#view"); if(v) v.scrollTop=0; render(); }

/* Een scherm dat je vanuit een tab opent houdt die tab aan, anders lijkt het
   alsof je nergens meer bent. */
const TAB_VAN={sessie:"log", oefening:"prog", jaar:"prog", evaluatie:"prog", mijlpalen:"prog"};
function renderTabs(){
  const actief=TAB_VAN[page]||page;
  $("#tabs").innerHTML=TABS.map(([k,l])=>
    `<button class="tab ${actief===k?"on":""}" type="button" onclick="go('${k}')" aria-label="${l}">
       <svg viewBox="0 0 24 24">${ICONS[k]}</svg><span>${l}</span></button>`).join("");
}

/* ---------- 8b. Een set opzij vegen -------------------------------------
   Eén luisteraar op het hele scherm in plaats van één per rij: de rijen worden
   bij elke render opnieuw getekend, en dan zouden losse luisteraars telkens
   opnieuw gezet moeten worden.

   Het gebaar neemt het pas over als je duidelijk horizontaal beweegt. Anders
   zou je bij elke scrollbeweging of bij het aantikken van een invoerveld per
   ongeluk een set kwijtraken.

   Twee soorten rijen doen mee. `.setrow[data-ex]` zijn de sets van de workout
   die nu loopt (niet die in je logboek). `.li[data-oef]` zijn de oefeningen in
   je bibliotheek onder Meer. Die laatste is een knop, dus na een veeg moeten
   we de klik tegenhouden — anders opent het bewerkscherm alsnog.           */
(function(){
  const DREMPEL=96;                      // zoveel pixels moet je halen
  let rij=null, soort="", x0=0, y0=0, dx=0, horizontaal=false, beslist=false;
  let blokTot=0;                         // klikken negeren tot dit moment

  const schoon=()=>{
    if(rij){ rij.style.transform=""; rij.style.opacity=""; rij.classList.remove("vegen","weg"); }
    rij=null; soort=""; dx=0; horizontaal=false; beslist=false;
  };

  // Een veeg over een knop eindigt in een klik. Die slikken we op, in de
  // capture-fase, zodat hij de onclick van de rij niet meer bereikt. Alleen
  // klikken óp zo'n rij: eerst blokkeerde dit álles, en dan was de knop
  // "Ongedaan maken" in de toast zeshonderd milliseconden dood — precies in
  // het moment waarop je hem nodig hebt.
  document.addEventListener("click",ev=>{
    if(Date.now()>=blokTot) return;
    const t=ev.target;
    if(!t || !t.closest || !t.closest(".li[data-oef],.setrow[data-ex]")) return;
    ev.stopPropagation(); ev.preventDefault();
  },true);

  document.addEventListener("touchstart",ev=>{
    schoon();
    if(!DB.d) return;
    if(ev.touches.length!==1) return;
    const t=ev.target; if(!t || !t.closest) return;
    let r=null;
    if(DB.d.active && page==="train") r=t.closest(".setrow[data-ex]");
    if(!r) r=t.closest(".li[data-oef]");
    if(!r) return;
    rij=r; soort = r.dataset.oef ? "oef" : "set";
    x0=ev.touches[0].clientX; y0=ev.touches[0].clientY;
    rij.classList.remove("terug");
  },{passive:true});

  document.addEventListener("touchmove",ev=>{
    if(!rij) return;
    dx=ev.touches[0].clientX-x0;
    const dy=ev.touches[0].clientY-y0;
    if(!beslist){
      if(Math.abs(dx)<14 && Math.abs(dy)<14) return;      // nog te weinig beweging
      beslist=true;
      horizontaal = Math.abs(dx) > Math.abs(dy)*1.6;
      if(!horizontaal){ rij=null; return; }               // je scrolt: laat los
      blokTot=Date.now()+600;                             // de klik erna niet doorlaten
      rij.classList.add("vegen");
      if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
    if(!horizontaal) return;
    ev.preventDefault();                                   // pagina niet mee laten schuiven
    rij.style.transform=`translateX(${dx}px)`;
    const ver=Math.abs(dx)>=DREMPEL;
    rij.classList.toggle("weg",ver);
    rij.style.opacity = ver ? "0.75" : String(1-Math.abs(dx)/(DREMPEL*4));
  },{passive:false});

  document.addEventListener("touchend",()=>{
    if(!rij || !horizontaal) return schoon();
    const r=rij, ver=Math.abs(dx)>=DREMPEL, wat=soort;
    const i=+r.dataset.ex, j=+r.dataset.set, oefId=r.dataset.oef;
    if(ver){
      blokTot=Date.now()+600;
      r.style.transition="transform .15s ease-in,opacity .15s ease-in";
      r.style.transform=`translateX(${dx>0?"110%":"-110%"})`;
      r.style.opacity="0";
      rij=null;
      setTimeout(()=>{
        if(wat==="oef"){
          Meer.oefWeghalen(oefId);
          // De rij zit in een eigen .list-doosje; dat moet mee weg, anders
          // blijft er een leeg randje staan.
          const box=r.parentElement;
          if(box && box.classList.contains("list") && box.children.length===1){
            // Was dit de laatste oefening onder een spiergroepkopje, dan moet
            // dat kopje ook weg — anders blijft "Kuiten" boven niets staan.
            const kop=box.previousElementSibling, na=box.nextElementSibling;
            box.remove();
            if(kop && kop.classList.contains("sec-label") &&
               (!na || na.classList.contains("sec-label"))) kop.remove();
          } else r.remove();
        } else Train.weghalen(i,j);
      },140);
      schoon();
    } else {
      r.classList.add("terug"); r.classList.remove("weg");
      r.style.transform=""; r.style.opacity="";
      setTimeout(()=>r.classList.remove("terug","vegen"),200);
      rij=null; dx=0; horizontaal=false; beslist=false;
    }
  },{passive:true});

  document.addEventListener("touchcancel",schoon,{passive:true});
})();

/* ---------- 9. Hoofdrender --------------------------------------------- */
function render(){
  renderTabs();
  window._charts=[];
  const V=$("#view");
  if(page==="train")      Train.render(V);
  else if(page==="log")   Log.render(V);
  else if(page==="prog")  Prog.render(V);
  else if(page==="tips")  Tips.render(V);
  else if(page==="meer")  Meer.render(V);
  else if(page==="sessie")Log.detail(V,pageArg);
  else if(page==="oefening")Prog.detail(V,pageArg);
  else if(page==="jaar")  Prog.jaar(V);
  else if(page==="evaluatie")Prog.evaluatie(V);
  else if(page==="mijlpalen")Prog.mijlpalenScherm(V);
  // Kan de app niets bewaren? Dan hoort dat op élk scherm te staan, niet alleen op het eerste.
  if(!storageOK){
    const w=document.createElement("div");
    w.className="warnbox";
    w.innerHTML=`Deze browser laat opslaan niet toe — alles wat je logt is weg zodra je de pagina sluit.
      <button class="btn sm wide" style="margin-top:9px;background:var(--bad);color:#fff" type="button" onclick="Meer.exportSheet()">Exporteer nu je data</button>`;
    V.insertBefore(w,V.firstChild);
  }
  redrawCharts();
}
function head(title,sub,action){
  $("#pgTitle").textContent=title;
  $("#pgSub").innerHTML=sub||"";
  $("#pgAction").innerHTML=action||"";
}

/* ============================================================================
   INSPANNING — hoe zwaar was deze training vergeleken met je andere?

   Je Apple Watch kan niet rechtstreeks met een webpagina praten (Apple laat
   geen enkele website bij HealthKit), dus hartslag en calorieën komen er via
   de Opdrachten-app of met de hand in. Alles hieronder werkt ook zonder die
   cijfers — dan wordt er alleen op volume, sets en duur vergeleken.
   ============================================================================ */
const Inspanning={
  /* De ruwe maten van één training */
  maten(s){
    const st=sessionStats(s);
    return {vol:st.vol, sets:st.sets, dur:st.dur||0,
            hr:(s.hr&&s.hr.gem)||0, hrMax:(s.hr&&s.hr.max)||0,
            kcal:s.kcal||0, effort:s.effort||0};
  },

  /* Vergelijk met de acht trainingen dáárvóór. Acht is genoeg om een
     gemiddelde op te bouwen en kort genoeg om je huidige vorm te vangen. */
  vergelijk(s){
    // Alleen met dezelfde soort workout: een bodycircuit hoort naast andere
    // bodycircuits, niet naast een uur in de gym.
    const soort=soortVan(s);
    const eerder=DB.d.sessions
      .filter(x=>x.date<s.date && soortVan(x)===soort)
      .sort((a,b)=>a.date<b.date?1:-1).slice(0,8);
    if(eerder.length<3) return null;
    const nu=this.maten(s);
    const gem={};
    for(const k of ["vol","sets","dur","hr","effort"]){
      const w=eerder.map(x=>this.maten(x)[k]).filter(v=>v>0);
      gem[k]= w.length ? w.reduce((a,b)=>a+b,0)/w.length : 0;
    }
    const delen=[];
    const voeg=(k,label)=>{ if(nu[k]>0&&gem[k]>0) delen.push({k,label,ratio:nu[k]/gem[k]}); };
    voeg("vol","volume"); voeg("sets","sets"); voeg("dur","duur");
    voeg("hr","hartslag"); voeg("effort","Strava");
    if(!delen.length) return null;
    const index=Math.round(delen.reduce((a,d)=>a+d.ratio,0)/delen.length*100);
    return {index, delen, nu, gem, basis:eerder.length, soort, woord:SOORTWOORD[soort]};
  },

  /* Per training: hoeveel persoonlijke records vielen erin? Eén doorloop op
     datum, waarbij we per oefening alle eerdere sets meeslepen — dezelfde
     test als `recordsUit`, maar dan in één keer over je hele logboek. */
  prPerSessie(){
    const eerder={}, maxSets={}, uit={};
    const opDatum=DB.d.sessions.slice().sort((a,b)=>a.date<b.date?-1:1);
    for(const s of opDatum){
      let n=0;
      for(const e of s.entries){
        const w=e.sets.filter(x=>isWork(x) && !x.sec);
        if(!w.length) continue;
        if(!eerder[e.exId]){ eerder[e.exId]=[]; maxSets[e.exId]=0; }
        n+=recordsUit(w, eerder[e.exId], maxSets[e.exId]).length;
        eerder[e.exId].push(...w);
        if(w.length>maxSets[e.exId]) maxSets[e.exId]=w.length;
      }
      uit[s.id]=n;
    }
    return uit;
  },

  /* Levert harder werken bij jou ook echt meer op? */
  loontHet(){
    const prs=this.prPerSessie();
    const metPR=[], zonderPR=[];
    for(const s of DB.d.sessions){
      const v=this.vergelijk(s); if(!v) continue;
      (prs[s.id]>0?metPR:zonderPR).push(v.index);
    }
    if(metPR.length<4||zonderPR.length<4) return null;
    const gem=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length);
    return {metPR:gem(metPR), zonderPR:gem(zonderPR), aantalPR:metPR.length, aantal:metPR.length+zonderPR.length};
  },

  /* Tekstlabel bij een index */
  label(i){
    if(i>=118) return {k:"bad",  t:"veel zwaarder"};
    if(i>=106) return {k:"warn", t:"zwaarder"};
    if(i<=82)  return {k:"acc",  t:"veel lichter"};
    if(i<=94)  return {k:"acc",  t:"lichter"};
    return {k:"good", t:"zoals gewoonlijk"};
  },

  /* Leest wat de Opdrachten-app op je klembord zet. Bewust soepel:
     het geeft niet in welke volgorde of met welke woorden het er staat.  */
  lees(txt){
    const t=String(txt).replace(",",".");
    const pak=re=>{ const m=t.match(re); return m?Math.round(parseFloat(m[1])):null; };
    return {
      gem : pak(/(?:gem(?:iddeld)?e?|avg|average)[^0-9]{0,12}(\d{2,3})/i),
      max : pak(/max(?:imaal|imum)?[^0-9]{0,12}(\d{2,3})/i),
      kcal: pak(/(\d{2,4})\s*(?:kcal|cal)/i) ?? pak(/(?:calorie|energie)[^0-9]{0,12}(\d{2,4})/i),
      min : pak(/(\d{1,3})\s*min/i) ?? pak(/duur[^0-9]{0,12}(\d{1,3})/i)
    };
  },

  /* Kaart met de vergelijking, voor het detailscherm van een training */
  kaart(s){
    const v=this.vergelijk(s);
    if(!v) return `<div class="card card-pad"><p class="mut">Nog te weinig ${SOORTWOORD[soortVan(s)]}
      om mee te vergelijken — vanaf drie stuks zet ik ze hier naast elkaar.</p></div>`;
    const l=this.label(v.index);
    const pct=v.index-100;
    return `
      <div class="card">
        <div class="card-head"><div class="card-title">Inspanning</div>
          <span class="chip ${l.k}">${l.t}</span></div>
        <div style="padding:13px 14px 4px">
          <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">
            Deze workout was <b class="num" style="color:var(--ink)">${pct>0?"+":""}${pct}%</b>
            ten opzichte van je vorige ${v.basis} ${v.woord}.</p>
        </div>
        <div style="padding:8px 14px 14px;display:flex;flex-direction:column;gap:8px">
          ${v.delen.map(d=>{
            const p=Math.round((d.ratio-1)*100);
            const breedte=clamp(50+p*1.2,3,100);
            return `<div style="display:flex;align-items:center;gap:10px">
              <span style="width:70px;flex:none;font-size:12.5px;color:var(--ink-2)">${d.label}</span>
              <div style="flex:1;height:9px;background:var(--surface-3);border-radius:99px;position:relative">
                <i style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-strong)"></i>
                <i style="display:block;height:100%;width:${breedte}%;border-radius:99px;
                   background:${p>0?"var(--warn)":"var(--accent)"}"></i></div>
              <span class="num" style="width:44px;text-align:right;font-size:12px;color:var(--ink-3)">${p>0?"+":""}${p}%</span>
            </div>`;
          }).join("")}
        </div>
      </div>`;
  }
};

/* ============================================================================
   ADVIES — wat zou je vandaag moeten trainen?

   Werkt met een streefaantal werksets per week per spiergroep. Die getallen
   komen uit gangbare krachttrainingsrichtlijnen (grofweg 10–20 sets per week
   voor een grote spiergroep). Een groep die achterloopt én lang niet aan de
   beurt is geweest, scoort hoog. Een groep die je net hebt getraind valt af,
   want spieren groeien tijdens het herstel en niet tijdens de sessie.
   ============================================================================ */
const STREEF={Borst:12,Rug:14,Schouders:10,Biceps:8,Triceps:8,
              Quadriceps:12,Hamstrings:8,Bilspieren:6,Kuiten:6,Core:6};
/* Welke groepen horen bij elkaar op één dag */
const DAGSOORT=[
  {naam:"Duwdag",  kort:"borst, schouders en triceps", groepen:["Borst","Schouders","Triceps"]},
  {naam:"Trekdag", kort:"rug en biceps",               groepen:["Rug","Biceps"]},
  {naam:"Benendag",kort:"benen en bilspieren",         groepen:["Quadriceps","Hamstrings","Bilspieren","Kuiten"]},
];

const Advies={
  /* Per spiergroep: sets deze week, gemiddeld per week over 4 weken, dagen geleden */
  meting(){
    const uit={};
    for(const g in STREEF) uit[g]={groep:g,week:0,vier:0,dagen:999,laatst:null};
    for(const s of DB.d.sessions){
      const d=daysAgo(s.date);
      if(d<0||d>28) continue;
      for(const e of s.entries){
        const ex=exById(e.exId); if(!ex) continue;
        const n=e.sets.filter(isWork).length; if(!n) continue;
        for(const g of exGroepen(ex)){
          const u=uit[g]; if(!u) continue;
          if(d<7) u.week+=n;
          u.vier+=n;
          if(d<u.dagen){ u.dagen=d; u.laatst=s.date; }
        }
      }
    }
    for(const g in uit){
      const u=uit[g];
      u.streef=STREEF[g];
      u.perWeek=Math.round(u.vier/4*10)/10;
      u.tekort=Math.round(Math.max(0,u.streef-u.perWeek)*10)/10;
      // Net getraind = eerst herstellen. Verder weegt het tekort het zwaarst,
      // dan hoe lang je wacht, en licht mee hoe groot de spiergroep is —
      // anders duwt een kuitspier die je nooit doet je quads van de lijst.
      u.score = (u.dagen<2 ? -100 : 0) + u.tekort*3
              + Math.min(u.dagen,21)*0.5 + u.streef*0.15;
    }
    return uit;
  },

  keuze:0,

  /* ---- Voorstellen wegdrukken -------------------------------------------
     Zit er een oefening bij die je toch niet doet, dan tik je hem weg en komt
     er een andere voor terug. Dat geldt voor vandaag; morgen begint de lijst
     weer schoon. Wil je een oefening nóóit meer zien, zet hem dan op "Niet
     voorstellen" bij Meer → Oefeningen.                                     */
  weggedrukt(){
    const s=S();
    if(!s.adviesWeg || s.adviesWeg.datum!==today()) s.adviesWeg={datum:today(),ids:[]};
    return s.adviesWeg.ids;
  },
  /* Oefeningen die jíj vandaag in het voorstel wilt, hoe de app er ook over
     denkt. Nodig omdat geen enkele regel kan raden wat je van plan bent: een
     oefening die je nog nooit deed staat nergens in de ranglijst, en Robins
     face pulls staan in zijn bibliotheek onder Schouders/duwen en vallen dus
     buiten elke trekdag. Net als wegdrukken geldt dit alleen voor vandaag. */
  erbijgezet(){
    const s=S();
    if(!s.adviesBij || s.adviesBij.datum!==today()) s.adviesBij={datum:today(),ids:[]};
    return s.adviesBij.ids;
  },
  erbij(){
    ExPicker.open(exId=>{
      const b=this.erbijgezet();
      if(b.indexOf(exId)<0) b.push(exId);
      // stond hij weggedrukt, dan wint je keuze van zojuist
      const w=this.weggedrukt(); const i=w.indexOf(exId);
      if(i>=0) w.splice(i,1);
      DB.save(); render();
      toast(exName(exId)+" staat erbij");
    });
  },
  wegdrukken(exId){
    const naam=exName(exId);
    // Zelf toegevoegd? Dan haalt de ✕ hem gewoon weer weg in plaats van hem
    // op de lijst "niet voorstellen vandaag" te zetten.
    const b=this.erbijgezet(); const bi=b.indexOf(exId);
    if(bi>=0){ b.splice(bi,1); DB.save(); render(); return toast(naam+" eruit"); }
    const w=this.weggedrukt();
    if(w.indexOf(exId)<0) w.push(exId);
    DB.save();
    const nieuw=this.voorstel();
    const komt=nieuw ? nieuw.oefeningen.map(o=>o.naam).filter(n=>n!==naam) : [];
    render();
    toast(komt.length ? naam+" eruit — kijk of het nieuwe voorstel je bevalt"
                      : naam+" eruit — veel keus is er niet meer");
  },
  terugzetten(){ S().adviesWeg={datum:today(),ids:[]}; DB.save(); render(); toast("Alles staat er weer bij"); },

  /* Alle bruikbare dagsoorten, de urgentste voorop. Zo kun je zelf kiezen in
     plaats van dat de app één ding voorschrijft. */
  alle(){
    const m=this.meting();
    const uit=[];
    for(const d of DAGSOORT){
      // Groepen van deze dagsoort die niet net getraind zijn, op urgentie
      const kern=d.groepen.filter(g=>m[g] && m[g].dagen>=2)
                          .sort((a,b)=>m[b].score-m[a].score).slice(0,3);
      if(!kern.length) continue;
      // Core mag erbij, maar mag nooit een hoofdgroep verdringen
      const extra = (m.Core && m.Core.tekort>2 && m.Core.dagen>=3 && !kern.includes("Core"))
                    ? ["Core"] : [];
      const groepen=[...kern,...extra];
      const oefeningen=this.kiesOefeningen(groepen);
      if(oefeningen.length<2) continue;
      const score=kern.reduce((a,g)=>a+m[g].score,0)/kern.length;
      uit.push({dag:d, groepen, oefeningen, score, meting:m});
    }
    return uit.sort((a,b)=>b.score-a.score);
  },
  index(opties){ return Math.min(this.keuze,opties.length-1); },
  voorstel(){
    const a=this.opties();
    return a.length ? a[this.index(a)] : null;
  },
  kies(i){ this.keuze=i; render(); },

  /* Per groep oefeningen kiezen: het liefst uit zijn eigen geschiedenis, en
     dan die hij het langst niet heeft gedaan. Heeft hij voor een groep nog
     niets staan — zoals bilspieren en kuiten — dan pakken we een standaard-
     oefening uit de bibliotheek, want anders blijft die groep leeg.        */
  /* `vaak` draait de rangschikking om. Normaal wint de oefening die je het
     langst liet liggen — goed om je lichaam in balans te houden. Maar op een
     dag die een doel dient, wil je juist de oefeningen die je echt draait:
     anders stelt de trekdag kettlebell swings voor terwijl de opdracht over
     zware rijen en face pulls gaat. */
  kiesOefeningen(groepen,vaak,verdeling){
    const uit=[];
    // de urgentste groep krijgt er twee, de rest één, tot je op ~5 oefeningen zit
    const aantal=verdeling ? verdeling.slice() : groepen.map((_,i)=>i===0?2:1);
    if(!verdeling)
      for(let i=1; aantal.reduce((a,b)=>a+b,0)<4 && i<groepen.length*3; i++)
        aantal[i%groepen.length]=Math.min(3,aantal[i%groepen.length]+1);

    // Eén oefening kan bij meerdere groepen horen. We houden bij wat we al
    // voorgesteld hebben, anders staat bankdrukken er twee keer in op een duwdag.
    const gekozen=new Set();
    const weg=this.weggedrukt();

    groepen.forEach((g,gi)=>{
      const perGroep=aantal[gi];
      const bruikbaar=f=>DB.d.exercises.filter(e=>
        f(e) && !e.arch && !e.nietVoorstellen && e.type!=="cardio"
        && !gekozen.has(e.id) && weg.indexOf(e.id)<0);
      // Eerst oefeningen waarvoor dit de hóófdgroep is; pas als die op zijn,
      // ook oefeningen die deze groep er als tweede bij pakken.
      let pool=bruikbaar(e=>exGroepen(e)[0]===g);
      if(pool.length<perGroep) pool=pool.concat(bruikbaar(e=>exGroepen(e)[0]!==g && heeftGroep(e,g)));

      const metHistorie=pool
        .map(e=>{
          const h=historyFor(e.id); if(!h.length) return null;
          const l=h[h.length-1], b=bestOf(l.sets);
          return {id:e.id,naam:e.name,sessies:h.length,dagen:daysAgo(l.date),w:b.w,r:b.r};
        }).filter(Boolean);

      // "Doe ik dit eigenlijk wel?" Eén keer een glute bridge gedaan is geen
      // gewoonte. We kijken eerst naar oefeningen die je minstens drie keer
      // deed, dan twee, en pas als er niets overblijft naar de rest.
      let lijst=metHistorie.filter(k=>k.sessies>=3);
      if(!lijst.length) lijst=metHistorie.filter(k=>k.sessies>=2);
      if(!lijst.length) lijst=metHistorie;
      // Binnen wat je écht doet telt vooral hoe lang je het niet gedaan hebt.
      // De dagen kappen we op 60, anders wint iets van een half jaar geleden
      // altijd van een oefening die gewoon in je programma zit.
      const gewicht=k=> vaak ? k.sessies*3+Math.min(k.dagen,21)*0.3
                             : Math.min(k.dagen,60)+Math.min(k.sessies,12)*3;
      lijst.sort((a,b)=>gewicht(b)-gewicht(a));

      if(!lijst.length){
        // Voor deze groep staat nog niets in je logboek — bilspieren, kuiten.
        // Dan stellen we één standaardoefening voor, anders blijft die groep
        // eeuwig leeg. Heb je dat voorstel net weggedrukt, dan houden we op
        // met aandringen: hieronder komt er iets voor terug dat je wél doet.
        const alWeg=DB.d.exercises.some(e=>heeftGroep(e,g) && weg.indexOf(e.id)>=0);
        const e=alWeg?null:pool[0];
        if(e) lijst=[{id:e.id,naam:e.name,sessies:0,dagen:999,w:null,r:null}];
      }
      for(const k of lijst.slice(0,perGroep)){ gekozen.add(k.id); uit.push({...k,groep:g}); }
    });

    // Gaatje gevallen doordat je iets hebt weggedrukt? Aanvullen met oefeningen
    // die je echt doet, uit de groepen van vandaag, die je het langst liet liggen.
    const doel=aantal.reduce((a,b)=>a+b,0);
    if(uit.length<doel){
      const gewicht=k=> vaak ? k.sessies*3+Math.min(k.dagen,21)*0.3
                             : Math.min(k.dagen,60)+Math.min(k.sessies,12)*3;
      const rest=DB.d.exercises
        .filter(e=>!e.arch && !e.nietVoorstellen && e.type!=="cardio"
                && !gekozen.has(e.id) && weg.indexOf(e.id)<0
                && exGroepen(e).some(g=>groepen.indexOf(g)>=0))
        .map(e=>{
          const h=historyFor(e.id); if(h.length<2) return null;
          const l=h[h.length-1], b=bestOf(l.sets);
          return {id:e.id,naam:e.name,sessies:h.length,dagen:daysAgo(l.date),
                  w:b.w,r:b.r,groep:exGroepen(e)[0]};
        }).filter(Boolean)
        .sort((a,b)=>gewicht(b)-gewicht(a));
      for(const k of rest.slice(0,doel-uit.length)){ gekozen.add(k.id); uit.push(k); }
    }
    return uit;
  },

  /* ---- Het plan rond je focusoefening -------------------------------------
     Hiervóór keek dit scherm alleen naar spiergroepen met een achterstand.
     Dat is prima om je lichaam in balans te houden, maar het weet niets van
     een doel. Wie zijn bankdruk omhoog wil hebben, heeft een week met vaste
     taken nodig: zwaar, volume, en genoeg trekwerk om vanaf te kunnen drukken.

     De ladder hieronder beantwoordt één vraag — voor welke sessie is het
     vandaag tijd? — en de eerste regel die past, wint. De rest blijft als
     alternatief staan, want dit is een voorstel en geen voorschrift.

     Volgorde: herstel gaat voor alles, dan een rustweek, dan een maxdag, dan
     de ondergrens van twee bankdagen per week, dan het grootste gat in je
     verhouding duwen/trekken, en pas daarna de gewone afwisseling.          */
  bankplan(){
    const f=focusOefening(); if(!f) return null;
    const h=historyFor(f.id); if(h.length<6) return null;

    const laatst=h[h.length-1];
    const dagen=daysAgo(laatst.date);
    const laatste7=h.filter(d=>daysAgo(d.date)<7).length;
    const sessieVan=id=>DB.d.sessions.find(s=>s.id===id);
    const vorigeTaak=taakVan(sessieVan(laatst.sessionId),f.id);

    // duwen tegen trekken over twee weken: de bovenrug is het platform waar je
    // vanaf drukt, en bij Robin is dat al maanden het grootste gat
    let duw=0, trek=0, trekDagen=999;
    for(const s of DB.d.sessions){
      const d=daysAgo(s.date); if(d<0||d>=14) continue;
      for(const e of s.entries){
        const ex=exById(e.exId); if(!ex||ex.type==="cardio") continue;
        const n=e.sets.filter(x=>isWork(x)&&!x.sec).length; if(!n) continue;
        const g=exGroepen(ex);
        if(g.some(x=>x==="Borst"||x==="Schouders"||x==="Triceps")) duw+=n;
        if(g.some(x=>x==="Rug"||x==="Biceps")){ trek+=n; if(d<trekDagen) trekDagen=d; }
      }
    }
    const trekPct = duw ? Math.round(trek/duw*100) : 100;

    // Zware sets per week, om te zien of je al te lang achter elkaar hoog zit.
    // "Zwaar" is hier: minstens 85% van je zwaarste werkset, in zes of minder
    // herhalingen. Een rustweek is een week met minder dan de helft daarvan.
    const zw=zwaarsteOoit(f.id);
    const drempel=zw ? zw.w*0.85 : 0;
    const perWeek=[0,0,0,0,0,0,0,0];
    for(const d of h){
      const wk=Math.floor(daysAgo(d.date)/7); if(wk<0||wk>7) continue;
      for(const s of d.sets) if(!s.sec && s.w>=drempel && s.r<=6) perWeek[wk]++;
    }
    const gem=perWeek.reduce((a,b)=>a+b,0)/8;
    const lichteWeek=perWeek.slice(0,6).some(v=>v<gem*0.5);
    const rustweekNodig = gem>=3 && !lichteWeek;

    const mx=maxMoment(f.id);
    const naam=f.ex.name;
    const doel=doelVan(f.ex);
    const volKg=volumeGewicht(f.id);
    const vsZwaar=voorstelVoor(f.id,null,"zwaar");    // tegen je vorige zware dag
    const vsVolume=voorstelVoor(f.id,null,"volume");  // tegen je vorige volumedag

    /* Elke regel levert een optie op. `focus` betekent: zet de focusoefening
       bovenaan de oefeningenlijst. `prio` bepaalt de volgorde.              */
    const O=[];
    const push=(o)=>O.push(o);

    if(rustweekNodig) push({soort:"rust", prio:1, naam:"Rustige week",
      groepen:["Borst","Triceps","Rug"], verdeling:[1,1,1], focus:true,
      waarom:`Je draait al zes weken ${Math.round(gem)} zware sets per week zonder een lichte week ertussen. Dat is het patroon dat bij jou twee keer op een blessure uitliep.`,
      opdracht:`Zelfde oefeningen, een derde minder sets. ${esc(naam)} op ongeveer ${nf(Math.round((werkGewicht(f.id)||0)*0.85/2.5)*2.5)} kg, en stop elke set met twee of drie in de tank.`});

    if(mx && dagen>=3 && !rustweekNodig) push({soort:"max", prio:2, naam:"Maxdag",
      groepen:["Borst","Triceps","Schouders"], verdeling:[2,1,1], focus:true,
      waarom:mx.tekst,
      opdracht:`Warm rustig op, werk in stappen omhoog en ga voor één zware poging. Daarna stoppen — een max meet je kracht, hij bouwt hem niet.`});

    const zwaarDag={soort:"zwaar", naam:"Zware dag",
      groepen:["Borst","Triceps","Schouders"], verdeling:[2,1,1], focus:true,
      waarom:`Dit is de sessie waar je maximum van omhoog gaat: weinig herhalingen, veel gewicht. Je laatste ${esc(naam.toLowerCase())} was ${dagen===1?"gisteren":dagen+" dagen geleden"}.`,
      opdracht: vsZwaar ? `${doel.sets} sets van ${doel.min}–${doel.max} op ${nf(vsZwaar.kg)} kg. ${vsZwaar.reden}`
                        : `${doel.sets} sets van ${doel.min}–${doel.max} herhalingen.`};
    const volumeDag={soort:"volume", naam:"Volumedag",
      groepen:["Borst","Triceps","Schouders"], verdeling:[2,1,1], focus:true,
      waarom:`Zware sets maken je sterker, maar het weefsel dat die kracht moet dragen bouw je met herhalingen. Jij draait ${esc(naam.toLowerCase())} vrijwel altijd zwaar — dit is het stuk dat ontbreekt.`,
      opdracht: vsVolume ? `${Math.max(3,doel.sets)} sets van 6–8 op ${nf(vsVolume.kg)} kg. ${vsVolume.reden}`
              : volKg    ? `3 tot 4 sets van 6–8 op ongeveer ${nf(volKg)} kg. Dat is bewust lichter: het doel is nette herhalingen, niet afzien.`
                         : `3 tot 4 sets van 6–8 herhalingen, ongeveer een achtste lichter dan je zware dag.`};
    const trekDag={soort:"trek", naam:"Trekdag", groepen:["Rug","Biceps"], verdeling:[3,1], focus:false,
      waarom: duw ? `Je rug kreeg de laatste twee weken ${trek} sets tegen ${duw} voor je duwwerk — ${trekPct}%. De bovenrug is het platform waar je vanaf drukt: hoe steviger je schouderbladen vastliggen, hoe korter de baan van de stang.`
                  : `Je hebt de laatste twee weken geen trekwerk gelogd. De bovenrug is het platform waar je vanaf drukt.`,
      // Bewust geen oefeningen bij naam: face pulls staan bij hem onder
      // Schouders en vallen dus buiten een trekdag. Liever zeggen wát je moet
      // doen dan een oefening beloven die niet in de lijst staat.
      opdracht:`3 tot 4 sets van 6–8 op je zware rijen, en daarnaast iets lichters van 15–20 voor je achterste schouderkop. Die twee samen houden je schouderbladen op hun plek als de stang zwaar wordt.`};
    const benenDag={soort:"benen", naam:"Benendag",
      groepen:["Quadriceps","Hamstrings","Bilspieren","Kuiten"], focus:false,
      waarom:`Je bankdrukdagen en je trekwerk zijn deze week gedekt. Benen kosten je nu niets van je bankdruk en houden de rest in balans.`,
      opdracht:``};

    // Herstel gaat voor: gisteren gebankt is vandaag geen bankdag.
    const magBanken = dagen>=2 && !rustweekNodig;
    // Ondergrens: twee bankdagen in de laatste zeven dagen. Zit je daaronder
    // en ben je uitgerust, dan gaat de bankdag voor het trekwerk.
    const onderGrens = laatste7<2;
    // Bovengrens: bij drie bankdagen in een week is het genoeg geweest.
    const vol = laatste7>=3;
    const trekAchter = trekPct<60 && trekDagen>=2;

    const bank = vorigeTaak==="zwaar" ? volumeDag : zwaarDag;

    if(magBanken && onderGrens)           push({...bank, prio:3});
    if(trekAchter)                        push({...trekDag, prio:4});
    if(magBanken && !onderGrens && !vol)  push({...bank, prio:5});
    if(!trekAchter)                       push({...trekDag, prio:6});
    push({...benenDag, prio:7});
    if(magBanken && vol)                  push({...bank, prio:8});

    // oefeningen erbij, en opties zonder bruikbare oefeningen vallen af
    const uit=[];
    const gezien=new Set();
    const m=this.meting();          // één keer: dit loopt over je hele logboek
    for(const o of O.sort((a,b)=>a.prio-b.prio)){
      if(gezien.has(o.soort)) continue;
      gezien.add(o.soort);
      // Op een dag die je doel dient: de oefeningen die je écht draait, en het
      // zwaartepunt op de groep waar het om gaat. Zonder die verdeling kwamen
      // er op de trekdag twee bicepsoefeningen in te staan en verdwenen de
      // face pulls uit beeld — precies waar zijn gat zit.
      let oef=this.kiesOefeningen(o.groepen, o.soort!=="benen", o.verdeling)
                  .filter(x=>x.id!==f.id);
      if(o.focus && this.weggedrukt().indexOf(f.id)<0){
        const b=bestOf(laatst.sets);
        oef.unshift({id:f.id, naam, sessies:h.length, dagen,
                     w:b.w, r:b.r, groep:exGroepen(f.ex)[0]});
      }
      oef=oef.slice(0,5);
      if(oef.length<2) continue;
      uit.push({...o, oefeningen:oef, dag:{naam:o.naam}, focus:f, meting:m});
    }
    return uit.length ? uit : null;
  },

  /* Alle opties voor vandaag: het bankdrukplan als er een focusoefening is,
     anders het oude voorstel op spiergroepen. */
  opties(){
    const plan=this.bankplan();
    const lijst = plan || this.alle().map(v=>({soort:"groep", naam:v.dag.naam, waarom:"", opdracht:"",
      groepen:v.groepen, oefeningen:v.oefeningen, dag:v.dag, meting:v.meting}));
    // Wat je er zelf bij zette staat vooraan, bij elke optie: je hebt het
    // vandaag gekozen, niet voor één bepaalde dagsoort.
    const bij=this.erbijgezet();
    if(!bij.length) return lijst;
    return lijst.map(o=>{
      const eigen=bij.map(id=>this.oefInfo(id)).filter(Boolean);
      const rest=o.oefeningen.filter(x=>bij.indexOf(x.id)<0);
      // Hoe meer je zelf kiest, hoe minder de app erbij verzint — maar er
      // blijft altijd ruimte voor één voorstel, en de lijst wordt nooit
      // langer dan zeven.
      const ruimte=Math.max(5,Math.min(7,eigen.length+1));
      return {...o, oefeningen:[...eigen,...rest].slice(0,ruimte)};
    });
  },
  /* De gegevens die een regel in het voorstel nodig heeft. Ook voor een
     oefening die je nog nooit deed — dan staat er "nieuw" in plaats van een
     gewicht. */
  oefInfo(exId){
    const ex=exById(exId); if(!ex) return null;
    const h=historyFor(exId);
    const l=h.length?h[h.length-1]:null;
    const b=l?bestOf(l.sets):{w:null,r:null};
    return {id:exId, naam:ex.name, sessies:h.length,
            dagen:l?daysAgo(l.date):999, w:b.w, r:b.r, groep:exGroepen(ex)[0]};
  },

  /* Je doel in beeld, maar alleen met een getal dat je écht getild hebt: je
     zwaarste set ooit tegen het doel dat je zelf invulde bij de oefening.
     Geen geschat 1RM — dat is een formule, geen prestatie, en hij wil het niet
     zien. Staat er geen doel, dan staat er ook geen balk.                   */
  doelBalk(f){
    const d=(f.ex&&f.ex.doel)||{};
    if(!(d.max1rm>0)) return "";
    const zw=zwaarsteOoit(f.id); if(!zw) return "";
    const pct=clamp(zw.w/d.max1rm*100,0,100);
    const rest=Math.round((d.max1rm-zw.w)*10)/10;
    return `<div style="padding:12px 14px 0">
      <div style="display:flex;align-items:baseline;gap:7px;margin-bottom:6px">
        <b class="num" style="font-size:15px">${nf(zw.w)}</b>
        <span style="font-size:12.5px;color:var(--ink-3)">van ${nf(d.max1rm)} kg ${esc(f.ex.name.toLowerCase())}</span>
        <span style="flex:1"></span>
        <span class="num" style="font-size:12.5px;color:var(--accent);font-weight:650">${rest>0?"nog "+nf(rest)+" kg":"gehaald"}</span>
      </div>
      <div style="height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden">
        <i style="display:block;height:100%;width:${pct}%;background:var(--accent);border-radius:99px"></i></div>
    </div>`;
  },

  /* De kaart op het startscherm */
  kaart(){
    const opties=this.opties();
    // Zoveel weggedrukt dat er geen voorstel meer overblijft? Dat is geen
    // rustdag — zeg dan gewoon dat de lijst op is.
    if(!opties.length && this.weggedrukt().length) return `
      <div class="card">
        <div class="card-head"><div class="card-title">Voorstel voor vandaag</div></div>
        <div style="padding:13px 14px 15px"><p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">
          Je hebt zoveel weggedrukt dat er niets meer over is om voor te stellen.</p>
          <button class="btn wide" type="button" style="margin-top:11px"
            onclick="Advies.terugzetten()">Voorstellen terugzetten</button></div>
      </div>`;
    // Alles net gehad? Dan is niet trainen het juiste advies.
    if(!opties.length) return `
      <div class="card">
        <div class="card-head"><div class="card-title">Voorstel voor vandaag</div>
          <span class="chip good">Rustdag</span></div>
        <div style="padding:13px 14px 15px"><p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">
          Je hebt elke spiergroep net gehad. Spieren groeien tijdens het herstel, niet tijdens
          de set — een dag rust levert je nu meer op dan een training erbij.</p></div>
      </div>`;
    const i=this.index(opties);
    const v=opties[i];
    const m=v.meting;
    // Zonder focusoefening valt hij terug op het oude verhaal: welke
    // spiergroepen achterlopen. Mét focus staat de reden al klaar.
    const reden = v.waarom || v.groepen.map(g=>{
      const u=m[g];
      if(u.dagen>=999) return `<b>${g}</b> heb je in geen vier weken getraind`;
      if(u.tekort>=u.streef*0.5) return `<b>${g}</b> kreeg ${u.perWeek} sets per week, je streeft naar ${u.streef}`;
      return `<b>${g}</b> is ${u.dagen} dagen geleden geweest`;
    }).slice(0,2).join(" en ")+".";
    return `
      <div class="card">
        <div class="card-head"><div class="card-title">Voorstel voor vandaag</div>
          <span class="chip acc">${esc(v.naam||v.dag.naam)}</span></div>
        ${v.focus?this.doelBalk(v.focus):""}
        ${opties.length>1?`<div style="padding:12px 14px 0">
          <div class="seg">${opties.map((o,k)=>
            `<button type="button" class="${k===i?"on":""}" onclick="Advies.kies(${k})">${esc(o.naam||o.dag.naam)}</button>`).join("")}</div>
        </div>`:""}
        <div style="padding:13px 14px 4px">
          <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">${reden}</p>
          ${v.opdracht?`<p style="font-size:14.5px;line-height:1.55;color:var(--ink);
            margin-top:9px;padding:10px 12px;background:var(--accent-soft);border-radius:10px">
            ${v.opdracht}</p>`:""}
        </div>
        <div style="padding:6px 14px 12px;display:flex;flex-direction:column;gap:7px">
          ${v.oefeningen.map(o=>{
            // Nieuw of lang niet gedaan? Dan een knopje met uitleg erbij.
            const onbekend = !o.sessies || o.dagen>90;
            return `<div style="display:flex;align-items:center;gap:8px">
              <span style="flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.naam)}</span>
              ${onbekend?`<button type="button" onclick="toonUitleg('${esc(o.naam).replace(/'/g,"\\'")}')"
                 style="width:26px;height:26px;flex:none;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px"
                 aria-label="Uitleg">?</button>`:`<span class="chip">${esc(o.groep)}</span>`}
              <span class="num" style="font-size:12.5px;color:var(--ink-3);white-space:nowrap">${o.w?setTekst(o.w,o.r):(o.sessies?"eigen gewicht":"nieuw")}</span>
              <button type="button" onclick="Advies.wegdrukken('${o.id}')"
                style="width:26px;height:26px;flex:none;border-radius:99px;background:var(--surface-3);color:var(--ink-3);font-size:13px;font-weight:700"
                aria-label="Andere oefening dan ${esc(o.naam)}">✕</button>
            </div>`;
          }).join("")}
        </div>
        <div style="padding:0 14px 10px">
          <button type="button" onclick="Advies.erbij()"
            style="font-size:13px;color:var(--accent);font-weight:650">+ Oefening erbij</button>
          ${this.weggedrukt().length?`<button type="button" onclick="Advies.terugzetten()"
            style="font-size:12.5px;color:var(--ink-3);font-weight:650;margin-left:14px">
            ${this.weggedrukt().length} weggedrukt — terugzetten</button>`:""}
        </div>
        <div style="padding:0 14px 13px"><button class="btn primary wide" type="button"
          onclick="Advies.start()">Start deze workout</button></div>
      </div>`;
  },

  start(){
    const v=this.voorstel(); if(!v) return;
    // De taak gaat mee op de sessie, zodat de volgende keer bekend is of dit
    // een zware of een volumedag was. Zonder dat moet de app het raden uit je
    // herhalingen, en dan komt er altijd "zwaar" uit.
    DB.d.active={id:uid(),date:today(),start:Date.now(),end:null,
      name:v.naam||v.dag.naam, taak:v.soort||null, routineId:null,notes:"",
      entries:v.oefeningen.map(o=>({exId:o.id,note:"",rest:null,
        sets:Array.from({length:3},()=>({w:o.w||null,r:o.r||null,rpe:null,t:"work",done:false}))}))};
    DB.save(); render();
  },

  /* Balansoverzicht: sets deze week tegenover het streefgetal */
  balans(){
    const m=this.meting();
    const rijen=Object.keys(STREEF).map(g=>m[g]).sort((a,b)=>b.tekort-a.tekort);
    return `
      <div class="card">
        <div class="card-head"><div class="card-title">Balans deze week</div>
          <span class="chip">werksets</span></div>
        <div style="padding:12px 14px;display:flex;flex-direction:column;gap:9px">
          ${rijen.map(u=>{
            const pct=clamp(u.week/u.streef*100,0,100);
            const kleur = u.week>=u.streef ? "var(--good)" : (u.week>=u.streef*0.5 ? "var(--accent)" : "var(--bad)");
            return `<div style="display:flex;align-items:center;gap:10px">
              <span style="width:88px;flex:none;font-size:12.5px;color:var(--ink-2)">${u.groep}</span>
              <div style="flex:1;height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden">
                <i style="display:block;height:100%;width:${pct}%;background:${kleur};border-radius:99px"></i></div>
              <span class="num" style="width:46px;text-align:right;font-size:12px;color:var(--ink-3)">${u.week}/${u.streef}</span>
            </div>`;
          }).join("")}
        </div>
        <div style="padding:0 14px 13px"><p class="mut" style="font-size:12.5px">
          Streefgetallen zijn gangbare richtlijnen voor spiergroei, geen wet. Rood betekent
          dat je deze week onder de helft zit.</p></div>
      </div>`;
  }
};

/* ============================================================================
   TRAIN
   ============================================================================ */
const Train={
  render(V){
    const a=DB.d.active;
    if(a) return this.active(V,a);
    head("Klaar om te trainen?", DB.d.sessions.length?`${DB.d.sessions.length} trainingen gelogd`:"Nog geen trainingen");
    const laatste=allSessions()[0];
    let h="";
    // Twee soorten workouts: met gewichten in de gym, of met je eigen lichaam
    h+=`<div class="seg">
      <button type="button" class="${this.soort==="gym"?"on":""}" onclick="Train.kiesSoort('gym')">Gymworkout</button>
      <button type="button" class="${this.soort==="body"?"on":""}" onclick="Train.kiesSoort('body')">Bodyworkout</button>
    </div>`;

    if(this.soort==="body"){
      const laatsteBody=allSessions().find(s=>s.soort==="body");
      h+=`<button class="btn primary lg wide" type="button" onclick="Train.start(null,'body')">Bodyworkout starten</button>
        <div class="card"><div class="card-head"><div class="card-title">Hoe het werkt</div></div>
          <div style="padding:13px 14px 15px"><p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">
            Stel een rijtje oefeningen samen en doe die in rondes. De stopwatch loopt vanzelf mee.
            Wil je op tijd werken — bijvoorbeeld 40 seconden aan, 20 seconden rust — zet dan de
            intervaltimer aan; die piept bij elke wissel en telt je rondes af.</p></div></div>`;
      if(laatsteBody) h+=`<button class="btn ghost wide" type="button" onclick="Train.repeat('${laatsteBody.id}')">Vorige bodyworkout herhalen</button>`;
      h+=this.bodyOverzicht();
      V.innerHTML=h;
      return;
    }

    h+=Advies.kaart();
    h+=`<button class="btn primary lg wide" type="button" onclick="Train.start(null)">Lege workout starten</button>`;
    if(DB.d.sessions.length>=4) h+=Advies.balans();
    if(DB.d.routines.length){
      h+=`<div class="sec-label">Schema's</div><div class="list">`+
        DB.d.routines.map(r=>`<button class="li" type="button" onclick="Train.start('${r.id}')">
          <div class="li-main"><b>${esc(r.name)}</b><span>${r.items.length} oefeningen${r.last?" · laatst "+relDate(r.last):""}</span></div>
          <div class="chev"></div></button>`).join("")+`</div>`;
    } else {
      h+=`<button class="btn ghost wide" type="button" onclick="Meer.routineNew()">Schema aanmaken</button>`;
    }
    if(laatste){
      const st=sessionStats(laatste);
      h+=`<div class="sec-label">Vorige training</div>
      <div class="card">
        <div class="card-head"><div class="card-title">${esc(laatste.name||"Training")}</div><span class="chip">${relDate(laatste.date)}</span></div>
        <div class="tiles" style="border:0;border-radius:0">
          <div class="tile"><div class="k">Volume</div><div class="v">${kf(st.vol)}</div><div class="u">kg</div></div>
          <div class="tile"><div class="k">Sets</div><div class="v">${st.sets}</div><div class="u">werksets</div></div>
          <div class="tile"><div class="k">Duur</div><div class="v">${st.dur?hhmm(st.dur):"–"}</div><div class="u">&nbsp;</div></div>
        </div>
        <div style="padding:11px 14px">
          ${laatste.entries.map(e=>{
            const ws=e.sets.filter(isWork);
            return `<div style="display:flex;gap:8px;font-size:13.5px;padding:3px 0"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(exName(e.exId))}</span><span class="num" style="color:var(--ink-3);white-space:nowrap">${ws.length} sets${ws.length?" · "+nf(Math.max(...ws.map(s=>s.w||0)))+" kg":""}</span></div>`;
          }).join("")}
        </div>
        <div style="padding:0 14px 13px"><button class="btn sm wide" type="button" onclick="Train.repeat('${laatste.id}')">Deze training herhalen</button></div>
      </div>`;
    }
    V.innerHTML=h;
  },

  soort:"gym",
  kiesSoort(s){ this.soort=s; render(); },

  /* Al je bodyworkouts bij elkaar. In het logboek staan ze tussen de
     gymworkouts, en dat is daar ook de bedoeling — maar als je in de
     bodysectie zit wil je alleen deze zien, met rondes en tijd in plaats
     van kilo's. */
  bodyOverzicht(){
    const ss=allSessions().filter(s=>soortVan(s)==="body");
    if(!ss.length) return `
      <div class="card"><div class="empty"><div class="big">Nog geen bodyworkouts</div>
        <p>Zodra je er een afrondt, staan ze hier bij elkaar — met je rondes en je tijd.</p></div></div>`;

    // cijfers over de hele reeks
    const duren=ss.map(s=>sessionStats(s).dur).filter(Boolean);
    const gemDuur=duren.length?Math.round(duren.reduce((a,b)=>a+b,0)/duren.length):0;
    const rondes=ss.map(s=>sessionStats(s).sets);
    const gemRondes=Math.round(rondes.reduce((a,b)=>a+b,0)/ss.length);
    const dezeMaand=ss.filter(s=>s.date.slice(0,7)===today().slice(0,7)).length;

    // welke oefeningen komen het vaakst voorbij
    const tel={};
    for(const s of ss) for(const e of s.entries) tel[e.exId]=(tel[e.exId]||0)+1;
    const top=Object.entries(tel).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>exName(x[0]));

    // per maand groeperen, net als in het logboek
    const maanden=new Map();
    for(const s of ss){
      const k=s.date.slice(0,7);
      if(!maanden.has(k)) maanden.set(k,[]);
      maanden.get(k).push(s);
    }

    return `
      <div class="sec-label">Je bodyworkouts</div>
      <div class="card">
        <div class="card-head"><div class="card-title">In het kort</div>
          <span class="chip acc">${ss.length}</span></div>
        <div class="tiles" style="border:0;border-radius:0">
          <div class="tile"><div class="k">Deze maand</div><div class="v">${dezeMaand}</div><div class="u">workouts</div></div>
          <div class="tile"><div class="k">Gemiddeld</div><div class="v">${gemRondes}</div><div class="u">rondes</div></div>
          <div class="tile"><div class="k">Gemiddeld</div><div class="v">${gemDuur?hhmm(gemDuur):"–"}</div><div class="u">per keer</div></div>
        </div>
        ${top.length?`<div style="padding:11px 14px 13px">
          <p class="mut" style="font-size:12.5px">Meest gedaan: ${top.map(esc).join(", ")}.</p></div>`:""}
      </div>
      ${[...maanden].map(([k,list])=>{
        const [y,m]=k.split("-");
        return `<div class="sec-label">${MNDL[+m-1]} ${y} · ${list.length} ${list.length===1?"workout":"workouts"}</div>
        <div class="list">`+list.map(s=>{
          const st=sessionStats(s);
          const oefeningen=s.entries.map(e=>exName(e.exId)).join(", ");
          return `<button class="li" type="button" onclick="go('sessie','${s.id}')">
            <div class="li-main"><b>${esc(Log.groepNaam(s))}</b>
              <span>${dShort(s.date)} · ${st.sets} ${st.sets===1?"ronde":"rondes"}${st.dur?" · "+hhmm(st.dur):""}</span>
              <span class="prev-hint">${esc(oefeningen)}</span>
            </div>
            <div class="chev"></div></button>`;
        }).join("")+`</div>`;
      }).join("")}`;
  },

  start(routineId,soort){
    unlockAudio();
    const r=routineId?DB.d.routines.find(x=>x.id===routineId):null;
    DB.d.active={
      id:uid(),date:today(),start:Date.now(),end:null,
      soort:soort||"gym", rondes:soort==="body"?S().interval.rondes:null,
      // Bij een bodyworkout staat de klok stil tot je hem zelf start: je wilt
      // eerst je oefeningen invoeren zonder dat de tijd loopt.
      pauzeTotaal:0, pauzeVanaf:(soort==="body"?Date.now():null),
      name:r?r.name:"Training",routineId:routineId||null,notes:"",
      entries:(r?r.items:[]).map(it=>({exId:it.exId,note:"",rest:it.rest||null,
        sets:Array.from({length:it.sets||3},()=>({w:null,r:null,rpe:null,t:"work",done:false}))}))
    };
    DB.save(); render();
  },
  repeat(sessId){
    const s=DB.d.sessions.find(x=>x.id===sessId); if(!s) return;
    // Een bodyworkout herhaal je als bodyworkout: hetzelfde rijtje oefeningen
    // met hun doel, nul rondes afgevinkt en de klok stil tot je hem start.
    const body=soortVan(s)==="body";
    DB.d.active={id:uid(),date:today(),start:Date.now(),end:null,name:s.name||"Training",
      soort:body?"body":"gym", rondes:body?(s.rondes||null):null,
      pauzeTotaal:0, pauzeVanaf:(body?Date.now():null),
      routineId:s.routineId||null,notes:"",
      entries:s.entries.map(e=>{
        if(body){
          const eerste=e.sets[0]||{};
          return {exId:e.exId,note:"",sets:[],
                  doel:{type:eerste.sec?"sec":"reps", waarde:eerste.r||12, kg:eerste.w||0}};
        }
        return {exId:e.exId,note:"",rest:e.rest||null,
                sets:e.sets.filter(x=>x.t!=="warmup").map(x=>({w:x.w,r:x.r,rpe:null,t:"work",done:false}))};
      })};
    DB.save(); render();
  },

  /* ---- Bodyworkout: rondes, stopwatch en intervaltimer ------------------ */
  bodyScherm(V,a){
    const c=S().interval;
    const gedaan=a.entries.map(e=>e.sets.filter(s=>s.done).length);
    const ronde=a.entries.length ? Math.min(...gedaan)+1 : 1;
    head(esc(a.name==="Training"?"Bodyworkout":a.name),
      `Ronde ${Math.min(ronde,a.rondes||ronde)} van ${a.rondes||"?"}`,
      `<button class="btn sm primary" type="button" onclick="Train.finish()">Klaar</button>`);

    V.innerHTML=`
      <div class="klokkaart">
        <div class="klokrij">
          <div class="tijd num" id="klok">${mmss(Klok.verstreken())}</div>
          ${(()=>{ const v=Klok.verstreken(), l=Klok.loopt();
            const label = l ? "Pauze" : (v===0 ? "Start" : "Verder");
            return `<button class="btn sm ${(!l&&v===0)?"primary":"ghost"}" type="button"
                      onclick="Klok.pauze()">${label}</button>`; })()}
          <button class="btn sm ${Interval.aan?"danger":""}" type="button"
            onclick="${Interval.aan?"Interval.stop()":"Train.intervalScherm()"}">${Interval.aan?"Stop":"Interval"}</button>
        </div>
        ${Interval.aan?`
          <div class="intervalbalk ${Interval.fase}" id="intBal">
            <div class="t num" id="intT">0:00</div>
            <div class="l" id="intL">Werken</div>
            <div style="font-size:12.5px;font-weight:700" id="intR">Ronde ${Interval.ronde} van ${c.rondes}</div>
          </div>`:""}
      </div>

      ${a.entries.length?`<div class="list">${a.entries.map((e,i)=>{
        const n=e.sets.filter(s=>s.done).length;
        const doel=e.doel||{type:"reps",waarde:12};
        const klaar=a.rondes && n>=a.rondes;
        return `<div class="bodyrij">
          <div class="naam"><b>${esc(exName(e.exId))}</b>
            <button type="button" onclick="Train.bodyDoel(${i})"
              style="font-size:12.5px;color:var(--ink-3);margin-top:2px">
              ${doel.waarde} ${doel.type==="sec"?"sec":"reps"}${doel.kg?" · "+nf(doel.kg)+" kg":""} · wijzig</button>
            <div class="stippen" style="margin-top:6px">${
              Array.from({length:a.rondes||n||1},(_,k)=>`<i class="${k<n?"vol":""}"></i>`).join("")}</div>
          </div>
          <button class="rondeknop ${klaar?"klaar":""}" type="button" onclick="Train.ronde(${i})"
            aria-label="Ronde afvinken">${klaar?"✓":"+"}</button>
        </div>`;
      }).join("")}</div>`
      :`<div class="card"><div class="empty"><div class="big">Nog geen oefeningen</div>
        <p>Zet je rijtje samen — kettlebell swings, push-ups, plank — en tik na elke ronde op de plusknop.</p></div></div>`}

      <button class="btn wide" type="button" onclick="Train.pickExercise()">+ Oefening toevoegen</button>
      <div class="row">
        <button class="btn ghost wide" type="button" onclick="Train.bodyRondes()">Rondes: ${a.rondes||"?"}</button>
        <button class="btn ghost wide" type="button" onclick="Train.notes()">Notitie</button>
      </div>
      <button class="btn ghost wide" type="button" onclick="Train.cancel()">Workout annuleren</button>`;

    Klok.aan();
    if(Interval.aan) Interval.tik();
  },

  /* Eén ronde afvinken bij een oefening */
  ronde(i){
    unlockAudio();
    const a=DB.d.active, e=a.entries[i];
    const doel=e.doel||{type:"reps",waarde:12};
    // Staat er een gewicht bij (kettlebell, vest, dumbbell), dan gaat dat mee
    // in de set. Zonder gewicht blijft het gewoon je eigen lichaamsgewicht.
    e.sets.push({w:doel.kg||0,r:doel.waarde,bw:!doel.kg,rpe:null,t:"work",done:true,
                 sec:doel.type==="sec"});
    DB.save(); render(); piep(1,true);
  },
  bodyDoel(i){
    const e=DB.d.active.entries[i];
    const d=e.doel||{type:"reps",waarde:12};
    Sheet.open(exName(e.exId),`
      <div class="field"><label>Wat houd je bij?</label>
        <div class="seg">
          <button type="button" class="${d.type==="reps"?"on":""}" onclick="Train.doelType(${i},'reps')">Herhalingen</button>
          <button type="button" class="${d.type==="sec"?"on":""}" onclick="Train.doelType(${i},'sec')">Seconden</button>
        </div></div>
      <div class="row">
        <div class="field" style="flex:1"><label>${d.type==="sec"?"Seconden":"Herhalingen"} per ronde</label>
          <input class="ctrl num" id="dW" inputmode="numeric" value="${d.waarde}"></div>
        <div class="field" style="flex:1"><label>Gewicht (kg)</label>
          <input class="ctrl num" id="dKg" inputmode="decimal" placeholder="geen" value="${d.kg||""}"></div>
      </div>
      <p class="mut">Laat het gewicht leeg als je alleen je eigen lichaamsgewicht gebruikt.
        Vul je wel kilo's in — een kettlebell, een gewichtsvest — dan komen die bij elke ronde
        in je logboek te staan.</p>
      <button class="btn primary wide" type="button" onclick="Train.doelSave(${i})">Opslaan</button>
      <button class="btn danger wide" type="button" onclick="Train.delEx(${i})">Oefening verwijderen</button>`);
  },
  /* Wat je al ingetypt hebt, uit de velden vissen — anders ben je het kwijt
     zodra je van herhalingen naar seconden wisselt. */
  doelUitVelden(d){
    const w=$("#dW"), k=$("#dKg");
    return {
      waarde: w ? (parseInt(w.value,10)||d.waarde) : d.waarde,
      kg: k ? (parseFloat(String(k.value).replace(",","."))||0) : (d.kg||0)
    };
  },
  doelType(i,t){
    const e=DB.d.active.entries[i];
    const d=e.doel||{type:"reps",waarde:12};
    const v=this.doelUitVelden(d);
    e.doel={type:t, waarde:v.waarde||(t==="sec"?40:12), kg:v.kg};
    DB.save(); Sheet.close(); this.bodyDoel(i);
  },
  doelSave(i){
    const e=DB.d.active.entries[i];
    const d=e.doel||{type:"reps",waarde:12};
    const v=this.doelUitVelden(d);
    e.doel={type:d.type||"reps", waarde:v.waarde||12, kg:v.kg};
    DB.save(); Sheet.close(); render();
  },
  bodyRondes(){
    Sheet.open("Aantal rondes",`
      <div class="field"><label>Hoeveel rondes wil je doen?</label>
        <input class="ctrl num" id="rN" inputmode="numeric" value="${DB.d.active.rondes||5}"></div>
      <button class="btn primary wide" type="button" onclick="Train.rondesSave()">Opslaan</button>`);
  },
  rondesSave(){
    DB.d.active.rondes=clamp(parseInt($("#rN").value,10)||5,1,30);
    DB.save(); Sheet.close(); render();
  },
  intervalScherm(){
    const c=S().interval;
    Sheet.open("Intervaltimer",`
      <p class="mut" style="font-size:14.5px;color:var(--ink-2)">De timer telt af, piept bij elke
        wissel en houdt je rondes bij. De stopwatch loopt gewoon door.</p>
      <div class="row">
        <div class="field" style="flex:1"><label>Werk (sec)</label>
          <input class="ctrl num" id="iW" inputmode="numeric" value="${c.werk}"></div>
        <div class="field" style="flex:1"><label>Rust (sec)</label>
          <input class="ctrl num" id="iR" inputmode="numeric" value="${c.rust}"></div>
        <div class="field" style="flex:1"><label>Rondes</label>
          <input class="ctrl num" id="iN" inputmode="numeric" value="${c.rondes}"></div>
      </div>
      <button class="btn primary lg wide" type="button" onclick="Train.intervalStart()">Starten</button>`);
  },
  intervalStart(){
    const c=S().interval;
    c.werk  =clamp(parseInt($("#iW").value,10)||40,5,600);
    c.rust  =clamp(parseInt($("#iR").value,10)||0,0,600);
    c.rondes=clamp(parseInt($("#iN").value,10)||5,1,30);
    if(DB.d.active) DB.d.active.rondes=c.rondes;
    DB.save(); Sheet.close(); Interval.start();
  },

  active(V,a){
    if(a.soort==="body") return this.bodyScherm(V,a);
    Klok.uit();
    const st=sessionStats(a);
    const min=Math.round((Date.now()-a.start)/60000);
    head(esc(a.name), `<span class="num">${min} min</span> · ${st.sets} sets · <span class="num">${kf(st.vol)}</span> kg`,
      `<button class="btn sm primary" type="button" onclick="Train.finish()">Klaar</button>`);
    let h="";
    if(!a.entries.length){
      h+=`<div class="card"><div class="empty"><div class="big">Nog geen oefeningen</div><p>Voeg je eerste oefening toe en begin met loggen.</p></div></div>`;
    }
    h+=a.entries.map((e,i)=>this.exCard(e,i,a)).join("");
    h+=`<button class="btn wide" type="button" onclick="Train.pickExercise()">+ Oefening toevoegen</button>
        <div class="row"><button class="btn ghost wide" type="button" onclick="Train.notes()">Notitie</button>
        <button class="btn ghost wide" type="button" onclick="Train.cancel()">Workout annuleren</button></div>`;
    V.innerHTML=h;
    clearInterval(this._iv);
    this._iv=setInterval(()=>{ if(DB.d.active&&page==="train"){
      const m=Math.round((Date.now()-DB.d.active.start)/60000);
      const s=sessionStats(DB.d.active);
      $("#pgSub").innerHTML=`<span class="num">${m} min</span> · ${s.sets} sets · <span class="num">${kf(s.vol)}</span> kg`;
    }},20000);
  },

  exCard(e,i,a){
    const ex=exById(e.exId)||{name:"?",type:"wr",groep:"?"};
    const hist=historyFor(e.exId,a.id);
    const vorige=hist[hist.length-1];
    const pr=prFor(e.exId,a.id);
    const cardio=ex.type==="cardio", tijd=ex.type==="time", bw=ex.type==="bw";
    // Robin noteert eerst de herhalingen, dan het gewicht: 5 x 80 kg
    const kolA = cardio?"Min":(tijd?"Sec":"Reps");
    const kolB = cardio?"Km":(bw?"Extra":"Kg");
    const kolC = cardio?"Kcal":"";
    return `<div class="ex">
      <div class="ex-head">
        <div class="ex-name"><b>${esc(ex.name)}</b>
          <div class="ex-meta"><span class="chip">${esc(exGroepen(ex).join(" · ")||"?")}</span>
          <span class="prev-hint">${esc(vorigeTekst(vorige))}</span>
          ${(()=>{ const r=recordTekst(e.exId,a.id); return r?`<span class="prev-hint">· ${esc(r)}</span>`:""; })()}
          ${(()=>{
            // Het voorstel hoort naast wat je vorige keer deed, niet alleen op
            // de balk erboven: die verdwijnt zodra je je eerste set afvinkt, en
            // dan sta je bij set drie alsnog te rekenen.
            const v=voorstelVoor(e.exId,a.id,laadTaak(a));
            return v?`<span class="prev-hint" style="color:var(--accent);font-weight:650">· doe ${nf(v.kg)} kg</span>`:"";
          })()}</div>
        </div>
        <button class="ex-more" type="button" onclick="Train.exMenu(${i})" aria-label="Opties">⋯</button>
      </div>
      ${this.voorstelBalk(e,i,a)}
      <div class="setgrid head${cardio?" cardio":""}"><span>Set</span><span>${kolA}</span><span>${kolB}</span>${cardio?`<span>${kolC}</span>`:""}<span></span></div>
      ${e.sets.map((s,j)=>this.setRow(s,j,i,e,vorige,cardio)).join("")}
      ${i===0?`<div class="veeghint">Veeg een set opzij om hem te verwijderen.</div>`:""}
      <div class="ex-foot">
        <button class="btn sm wide" type="button" onclick="Train.addSet(${i})">+ Set</button>
        <button class="btn sm ghost" type="button" onclick="Train.addSet(${i},'warmup')">+ Opwarm</button>
      </div>
    </div>`;
  },
  setRow(s,j,i,e,vorige,cardio){
    const vs = vorige && vorige.sets[j];
    const nr = e.sets.slice(0,j+1).filter(x=>x.t!=="warmup").length;
    const label = s.t==="warmup"?"W":(s.t==="drop"?"D":(s.t==="fail"?"F":nr));
    return `<div class="setgrid setrow ${cardio?"cardio ":""}${s.done?"done":""}" data-ex="${i}" data-set="${j}">
      <button class="setno ${s.t==="warmup"?"warmup":s.t==="drop"?"drop":s.t==="fail"?"fail":""}" type="button" onclick="Train.setMenu(${i},${j})">${label}</button>
      ${cardio
        ? `<input class="inp num" inputmode="decimal" value="${s.w??""}" placeholder="${vs?nf(vs.w||0):"–"}" onchange="Train.setVal(${i},${j},'w',this.value)" aria-label="Minuten">
           <input class="inp num" inputmode="numeric" value="${s.r??""}" placeholder="${vs?(vs.r||0):"–"}" onchange="Train.setVal(${i},${j},'r',this.value)" aria-label="Kilometers">`
        : `<input class="inp num" inputmode="numeric" value="${s.r??""}" placeholder="${vs?(vs.r||0):"–"}" onchange="Train.setVal(${i},${j},'r',this.value)" aria-label="Herhalingen">
           <div class="wcel">
             <input class="inp num" inputmode="decimal" value="${s.w??""}"
                    placeholder="${s.bw?"extra":(vs?(vs.bw?"BW":nf(vs.w||0)):"–")}"
                    onchange="Train.setVal(${i},${j},'w',this.value)" aria-label="Gewicht">
             <button class="bwknop ${s.bw?"on":""}" type="button" onclick="Train.togBw(${i},${j})"
                     title="Eigen lichaamsgewicht">BW</button>
           </div>`}
      ${cardio?`<input class="inp num" inputmode="numeric" value="${s.kcal??""}" placeholder="–" onchange="Train.setVal(${i},${j},'kcal',this.value)" aria-label="Calorieën">`:""}
      <button class="tick ${s.done?"on":""}" type="button" onclick="Train.toggle(${i},${j})" aria-label="Set afvinken">
        <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
    </div>${this.rirRij(s,i,j)}`;
  },

  /* Het gewichtsvoorstel boven de sets. Bewust alleen tekst: hij vult zijn
     sets zelf in, dat houdt hem scherp. Tik je op de balk, dan zie je waarom
     dit voorstel er staat en kun je je doel aanpassen. Ben je al begonnen met
     afvinken, dan verdwijnt hij — dan weet je het al. */
  voorstelBalk(e,i,a){
    if(e.sets.some(s=>s.done)) return "";
    const v=voorstelVoor(e.exId,a.id,laadTaak(a));
    const mx=maxMoment(e.exId,a.id);
    if(!v && !mx) return "";
    const d=v?v.doel:null;
    return `${v?`<button class="voorstel ${v.soort}" type="button" onclick="Train.voorstelUitleg(${i})">
        <span class="kop">${v.soort==="omhoog"?"↑":"→"} ${nf(v.kg)} kg</span>
        <span class="sub">${d.sets}× ${d.min}–${d.max} · waarom?</span></button>`:""}
      ${mx?`<button class="voorstel maxtijd" type="button" onclick="Train.maxUitleg(${i})">
        <span class="kop">Tijd om te maxen?</span>
        <span class="sub">${mx.weken} weken geleden · waarom?</span></button>`:""}`;
  },
  voorstelUitleg(i){
    const e=DB.d.active.entries[i];
    const v=voorstelVoor(e.exId,DB.d.active.id,laadTaak(DB.d.active));
    if(!v) return;
    const d=v.doel;
    Sheet.open(exName(e.exId),`
      <div class="notebox" style="font-size:14.5px;line-height:1.6">${esc(v.reden)}</div>
      <p class="mut">Een voorstel, geen opdracht. Voel je je goed, ga zwaarder; voelt het niet,
        blijf staan. De app vult niets voor je in.</p>
      <div class="sec-label">Je doel voor deze oefening</div>
      <div class="row">
        <div class="field" style="flex:1"><label>Sets</label>
          <input class="ctrl num" id="dSets" inputmode="numeric" value="${d.sets}"></div>
        <div class="field" style="flex:1"><label>Van</label>
          <input class="ctrl num" id="dMin" inputmode="numeric" value="${d.min}"></div>
        <div class="field" style="flex:1"><label>Tot</label>
          <input class="ctrl num" id="dMax" inputmode="numeric" value="${d.max}"></div>
        <div class="field" style="flex:1"><label>Stap (kg)</label>
          <input class="ctrl num" id="dStap" inputmode="decimal" value="${nf(v.stap)}"></div>
      </div>
      <p class="mut">${d.afgeleid?"Deze waarden heb ik afgeleid uit wat je met deze oefening meestal doet. Pas ze gerust aan.":"Zelf ingesteld."}
        De stap is de kleinste sprong die bij dit apparaat haalbaar is.</p>
      <button class="btn primary wide" type="button" onclick="Train.doelOpslaan('${e.exId}')">Doel opslaan</button>`);
  },
  maxUitleg(i){
    const e=DB.d.active.entries[i];
    const mx=maxMoment(e.exId,DB.d.active.id);
    if(!mx) return;
    Sheet.open(exName(e.exId),`
      <div class="notebox" style="font-size:14.5px;line-height:1.6">${esc(mx.tekst)}</div>
      <div class="sec-label">Hoe je het aanpakt</div>
      <p class="mut" style="font-size:14.5px;line-height:1.6;color:var(--ink-2)">
        Bouw rustig op met enkele herhalingen: ${nf(Math.round(mx.best*0.5))} · ${nf(Math.round(mx.best*0.7))} ·
        ${nf(Math.round(mx.best*0.85))} · ${nf(Math.round(mx.best*0.93))} kg, met genoeg rust ertussen.
        Daarna één poging op ${nf(Math.round(mx.best*1.02))} kg of iets meer.
        Lukt die soepel, dan mag er nog één bij — maar hooguit twee pogingen.</p>
      <p class="mut">Doe dit niet vaker dan eens in de acht tot twaalf weken, en zorg dat er iemand
        bij staat of dat je beugels goed staan. Een gemiste poging kost je meer dan het getal je oplevert.</p>`);
  },
  doelOpslaan(exId){
    const ex=exById(exId); if(!ex) return;
    const g=(id,t)=>{ const el=$(id); if(!el) return t;
      const v=parseFloat(String(el.value).replace(",",".")); return isNaN(v)?t:v; };
    const oud=doelVan(ex);
    const min=clamp(Math.round(g("#dMin",oud.min)),1,50);
    ex.doel={
      sets: clamp(Math.round(g("#dSets",oud.sets)),1,10),
      min,
      max: clamp(Math.round(g("#dMax",oud.max)),min,60),
      stap: clamp(g("#dStap",oud.stap),0.5,25)
    };
    DB.save(); Sheet.close(); render(); toast("Doel opgeslagen");
  },

  /* ---- RIR: hoeveel zat er nog in? --------------------------------------
     Verschijnt onder de set die je zojuist hebt afgevinkt, en verdwijnt zodra
     je kiest of de volgende set afvinkt. Overslaan mag: de set telt gewoon
     mee, het voorstel wordt er alleen minder scherp van. */
  _rirVoor:null,
  rirRij(s,i,j){
    const actief=this._rirVoor && this._rirVoor.i===i && this._rirVoor.j===j;
    if(!s.done || s.sec || s.t==="warmup") return "";
    if(!actief){
      return (s.rir===null||s.rir===undefined) ? ""
        : `<button class="rirklaar" type="button" onclick="Train.rirOpnieuw(${i},${j})">
             ${s.rir===0?"ging er helemaal doorheen":`${s.rir} nog in de tank`}</button>`;
    }
    return `<div class="rirrij">
      <span>Laatste set — nog in de tank?</span>
      ${[0,1,2,3,4].map(n=>`<button type="button" class="${s.rir===n?"on":""}"
          onclick="Train.zetRir(${i},${j},${n})">${n===4?"4+":n}</button>`).join("")}
      <button type="button" class="over" onclick="Train.zetRir(${i},${j},null)">sla over</button>
    </div>`;
  },
  zetRir(i,j,n){
    const s=DB.d.active.entries[i].sets[j];
    s.rir = (n===null || s.rir===n) ? null : n;
    this._rirVoor=null;
    DB.save(); render();
  },
  rirOpnieuw(i,j){ this._rirVoor={i,j}; render(); },
  zetRirUitMenu(i,j,n){
    DB.d.active.entries[i].sets[j].rir=n;
    DB.save(); Sheet.close(); render();
  },

  /* Eigen lichaamsgewicht aan of uit voor deze set */
  togBw(i,j){
    const s=DB.d.active.entries[i].sets[j];
    s.bw=!s.bw;
    if(!s.bw && s.w===0) s.w=null;
    DB.save(); render();
  },
  setVal(i,j,k,v){
    const s=DB.d.active.entries[i].sets[j];
    v=String(v).replace(",",".").trim();
    s[k]= v===""?null:((k==="r"||k==="kcal")?parseInt(v,10)||null:parseFloat(v)||null);
    DB.save();
  },
  toggle(i,j){
    const a=DB.d.active, e=a.entries[i], s=e.sets[j];
    if(!s.done){
      // leeg? neem waardes van de vorige set of van de vorige training over
      if(s.w==null&&s.r==null){
        const prev=e.sets[j-1];
        if(prev&&(prev.w!=null||prev.r!=null||prev.bw)){ s.w=prev.w; s.r=prev.r; s.bw=!!prev.bw; }
        else { const h=historyFor(e.exId,a.id).slice(-1)[0];
               if(h&&h.sets[j]){ s.w=h.sets[j].w; s.r=h.sets[j].r; s.bw=!!h.sets[j].bw; } }
      }
      s.done=true; s.ts=Date.now();
      // Vraag pas hoeveel er nog in zat als de oefening klaar is: één keer per
      // oefening in plaats van na elke set. Je weet het aan het eind nog prima,
      // en vier keer achter elkaar iets aantikken tussen zware sets door is
      // precies het soort onderbreking dat je niet wilt.
      // Nooit bij een opwarmset — daar heeft "nog in de tank" geen betekenis.
      const klaar = e.sets.every(x=>x.done || x.t==="warmup");
      this._rirVoor = (s.r && !s.sec && s.t!=="warmup" && klaar) ? {i,j} : null;
      const p=this.checkPR(e.exId,s,a.id);
      render();
      if(p) toast(p);
    } else { s.done=false; s.rir=null; this._rirVoor=null; render(); }
    DB.save();
  },
  checkPR(exId,s,sessId){
    // Alleen deze ene set: het set-record gaat over de hele training, en die
    // is op dit moment nog niet klaar.
    if(s.t==="warmup"||s.sec||!s.r) return null;
    const r=recordsVoor(exId,[s],sessId).filter(x=>x.soort!=="sets");
    return r.length ? "Record! "+r[0].tekst : null;
  },
  addSet(i,type){
    const e=DB.d.active.entries[i];
    const last=e.sets.filter(s=>s.t!=="warmup").slice(-1)[0];
    const nieuw={w:type==="warmup"?null:(last?last.w:null),r:type==="warmup"?null:(last?last.r:null),
                 bw:last?!!last.bw:false, rpe:null,t:type||"work",done:false};
    if(type==="warmup"){
      // Opwarmsets horen vóór je werksets: invoegen achter de opwarmsets die er al staan
      let k=0; while(k<e.sets.length && e.sets[k].t==="warmup") k++;
      e.sets.splice(k,0,nieuw);
    } else e.sets.push(nieuw);
    DB.save(); render();
  },
  setMenu(i,j){
    const s=DB.d.active.entries[i].sets[j];
    const opt=[["work","Werkset"],["warmup","Opwarmset"],["drop","Dropset"],["fail","Tot falen"]];
    Sheet.open("Set aanpassen",`
      <div class="seg">${opt.map(([k,l])=>`<button type="button" class="${s.t===k?"on":""}" onclick="Train.setType(${i},${j},'${k}')">${l}</button>`).join("")}</div>
      ${s.done&&s.t!=="warmup"&&!s.sec?`
      <div class="field"><label>Nog in de tank bij deze set</label>
        <div class="seg">
          ${[0,1,2,3,4].map(n=>`<button type="button" class="${s.rir===n?"on":""}"
             onclick="Train.zetRirUitMenu(${i},${j},${n})">${n===4?"4+":n}</button>`).join("")}
          <button type="button" class="${(s.rir===null||s.rir===undefined)?"on":""}"
             onclick="Train.zetRirUitMenu(${i},${j},null)">–</button>
        </div></div>`:""}
      <button class="btn danger wide" type="button" onclick="Train.delSet(${i},${j})">Set verwijderen</button>`);
  },
  setType(i,j,t){ DB.d.active.entries[i].sets[j].t=t; DB.save(); Sheet.close(); render(); },
  delSet(i,j){ Sheet.close(); this.weghalen(i,j); },

  /* Eén set weghalen, met de mogelijkheid het meteen terug te zetten. Zowel de
     knop in het setmenu als het vegen komt hier uit. */
  weghalen(i,j){
    const e=DB.d.active&&DB.d.active.entries[i]; if(!e) return;
    const set=e.sets[j]; if(!set) return;
    e.sets.splice(j,1);
    DB.save(); render();
    const terug=()=>{
      const e2=DB.d.active&&DB.d.active.entries[i];
      if(!e2) return toast("Die workout is al afgerond");
      e2.sets.splice(Math.min(j,e2.sets.length),0,set);
      DB.save(); render(); toast("Teruggezet");
    };
    toastActie("Set verwijderd","Ongedaan maken",terug);
  },

  exMenu(i){
    const e=DB.d.active.entries[i];
    Sheet.open(exName(e.exId),`
      <div class="field"><label>Notitie bij deze oefening</label>
        <input class="ctrl" id="exNote" value="${esc(e.note||"")}" placeholder="bijv. stoel op 4, langzaam zakken"></div>
      <button class="btn primary wide" type="button" onclick="Train.exSave(${i})">Opslaan</button>
      <div class="hr"></div>
      <button class="btn primary wide" type="button" onclick="Train.bovenaan(${i})">Deze nu doen</button>
      <button class="btn wide" type="button" onclick="toonUitleg('${esc(exName(e.exId)).replace(/'/g,"\\'")}')">Hoe doe ik dit?</button>
      <div class="row">
        <button class="btn ghost wide" type="button" onclick="Train.move(${i},-1)">↑ Omhoog</button>
        <button class="btn ghost wide" type="button" onclick="Train.move(${i},1)">↓ Omlaag</button>
      </div>
      <button class="btn wide" type="button" onclick="Sheet.close();go('oefening','${e.exId}')">Voortgang bekijken</button>
      <button class="btn danger wide" type="button" onclick="Train.delEx(${i})">Oefening verwijderen</button>`);
  },
  exSave(i){
    const e=DB.d.active.entries[i];
    e.note=$("#exNote").value.trim();
    DB.save(); Sheet.close(); render();
  },
  move(i,d){
    const a=DB.d.active.entries, j=i+d; if(j<0||j>=a.length) return;
    [a[i],a[j]]=[a[j],a[i]]; DB.save(); Sheet.close(); render();
  },
  /* Van volgorde afwijken zonder tien keer op "omhoog" te tikken */
  bovenaan(i){
    const a=DB.d.active.entries;
    a.unshift(a.splice(i,1)[0]);
    DB.save(); Sheet.close(); render();
  },
  delEx(i){ DB.d.active.entries.splice(i,1); DB.save(); Sheet.close(); render(); },

  pickExercise(){
    ExPicker.open(id=>{
      const a=DB.d.active;
      if(a.soort==="body"){
        const ex=exById(id);
        a.entries.push({exId:id,note:"",rest:null,sets:[],
          doel:{type:(ex&&ex.type==="time")?"sec":"reps", waarde:(ex&&ex.type==="time")?40:12}});
      } else {
        a.entries.push({exId:id,note:"",rest:null,
          sets:Array.from({length:3},()=>({w:null,r:null,rpe:null,t:"work",done:false}))});
      }
      DB.save(); Sheet.close(); render();
    });
  },
  notes(){
    Sheet.open("Notitie bij training",`
      <textarea class="ctrl" id="sNote" placeholder="Hoe voelde het? Slaap, energie, blessures…">${esc(DB.d.active.notes||"")}</textarea>
      <button class="btn primary wide" type="button" onclick="DB.d.active.notes=$('#sNote').value;DB.save();Sheet.close();toast('Notitie opgeslagen')">Opslaan</button>`);
  },
  async cancel(){
    if(await ask("Workout annuleren?","Alles wat je in deze workout hebt gelogd gaat weg.","Bevestigen",true)){
      DB.d.active=null; DB.save(); Klok.uit(); Interval.stop(); render();
    }
  },
  /* Een geschreven terugblik op de workout. Cijfers in tegels lees je niet,
     een paar zinnen wel — en records horen benoemd te worden. */
  samenvatting(a){
    const st=sessionStats(a);
    const min=Math.round((Date.now()-a.start)/60000);
    const zinnen=[];

    // 1. wat heb je gedaan
    const groepen=Log.spiergroepen(a);
    const wat = groepen.length ? groepen.slice(0,3).join(", ").replace(/,([^,]*)$/," en$1") : "cardio";
    const body=soortVan(a)==="body";
    const eenheid = body ? (st.sets===1?"ronde":"rondes") : (st.sets===1?"werkset":"werksets");
    zinnen.push(`Je trainde <b>${esc(wat)}</b> in ${min} minuten: ${st.sets} ${eenheid} over ${st.oef} ${st.oef===1?"oefening":"oefeningen"}.`);

    // 2. je zwaarste set van vandaag
    const top=Log.hoofdoefening(a);
    if(top && top.w) zinnen.push(`Je zwaarste set was <b>${setTekst(top.w,top.r,true)}</b> bij ${esc(top.naam)}.`);

    // 3. records
    const prs=[];
    for(const e of a.entries){
      for(const r of recordsVoor(e.exId,e.sets,a.id))
        prs.push(`<b>${esc(exName(e.exId))}</b> — ${r.tekst}`);
    }
    if(prs.length){
      zinnen.push((prs.length===1?"Eén record":`${prs.length} records`)+": "+prs.join(", en ")+".");
    } else {
      zinnen.push("Geen records vandaag — die vallen ook niet elke keer, en dat hoeft niet.");
    }

    // 4. hoe zwaar vergeleken met je gewone workouts
    const v=Inspanning.vergelijk(a);
    if(v){
      const p=v.index-100;
      if(p>=8)      zinnen.push(`Deze workout was <b>${p}% zwaarder</b> dan je vorige ${v.basis} ${v.woord}. Houd je herstel in de gaten.`);
      else if(p<=-8)zinnen.push(`Deze workout was <b>${Math.abs(p)}% lichter</b> dan je vorige ${v.basis} ${v.woord} — prima als het een rustige dag mocht zijn.`);
      else          zinnen.push(`Qua zwaarte zat je op je gewone niveau.`);
    }

    // 5. heb je een groep aangeraakt die lang stil lag?
    const ingehaald=[];
    for(const g of groepen){
      let dagen=999;
      for(const s of DB.d.sessions){
        if(s.id===a.id) continue;
        const d=daysAgo(s.date); if(d<0) continue;
        for(const e of s.entries){
          const ex=exById(e.exId);
          if(ex&&heeftGroep(ex,g)&&e.sets.filter(isWork).length&&d<dagen) dagen=d;
        }
      }
      if(dagen>=14) ingehaald.push({g,dagen});
    }
    if(ingehaald.length){
      const t=ingehaald.map(x=>`<b>${esc(x.g)}</b>${x.dagen>900?"":` (${x.dagen} dagen geleden)`}`).join(" en ");
      zinnen.push(`Mooi: je pakte ${t} weer op, na een lange stilte.`);
    }
    return zinnen;
  },

  finish(){
    const a=DB.d.active, st=sessionStats(a);
    if(!st.sets){
      ask("Niets gelogd","Er zijn geen afgevinkte sets. Wil je de training weggooien?","Weggooien",true)
        .then(v=>{ if(v){ DB.d.active=null; DB.save(); render(); } });
      return;
    }
    const prs=[];
    for(const e of a.entries) prs.push(...recordsVoor(e.exId,e.sets,a.id));
