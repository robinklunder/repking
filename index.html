    Sheet.open("Importeren",`
      <p class="mut" style="font-size:14.5px;color:var(--ink-2)">Plak je logboek hieronder — recht uit Notities, uit Excel of als CSV. Ik lees het uit en laat je precies zien wat ik ervan begrijp voordat er iets wordt opgeslagen.</p>
      <div class="notebox" style="font-family:var(--mono);font-size:12px;line-height:1.6">16 augustus:<br>Bench press:<br>2 x 25 20 kilo<br>1 x 8 60 kilo<br>1 x 100 kilo<br>3 x 3 80 kilo</div>
      <div class="field"><label>Jouw log</label>
        <textarea class="ctrl" id="impTxt" style="min-height:170px" placeholder="Plak hier…"></textarea></div>
      <div class="field"><label>Datum voor regels zonder datum erboven</label>
        <input class="ctrl" id="impDate" type="date" value="${today()}"></div>
      <div class="switch"><div class="sw-main"><b>Lichte sets als opwarmset markeren</b>
        <span>Alles onder 55% van je zwaarste gewicht bij die oefening. Zo vervuilen je opwarmsets je records en volume niet.</span></div>
        <button class="toggle on" type="button" id="impWarm" onclick="this.classList.toggle('on')"><i></i></button></div>
      <button class="btn primary wide" type="button" onclick="Imp.preview()">Lees uit</button>
      <div id="impOut"></div>`);
  }
};

/* ---------- Import-lezer ------------------------------------------------ */
const Imp={
  parsed:null,
  preview(){
    const txt=$("#impTxt").value;
    if(!txt.trim()) return toast("Plak eerst je log");
    const basis=$("#impDate")?$("#impDate").value||today():today();
    const warm =$("#impWarm")?$("#impWarm").classList.contains("on"):true;
    const r = this.looksCSV(txt) ? this.parseCSV(txt) : this.parseText(txt,basis);
    if(warm) this.markWarmups(r);
    this.parsed=r;
    let sets=0, warmups=0;
    r.sessions.forEach(s=>s.entries.forEach(e=>e.sets.forEach(x=>{ sets++; if(x.t==="warmup") warmups++; })));
    $("#impOut").innerHTML= r.sessions.length ? `
      <div class="hr"></div>
      <div class="tiles">
        <div class="tile"><div class="k">Trainingen</div><div class="v">${r.sessions.length}</div><div class="u">gevonden</div></div>
        <div class="tile"><div class="k">Sets</div><div class="v">${sets}</div><div class="u">${warmups?warmups+" opwarm":"totaal"}</div></div>
        <div class="tile"><div class="k">Nieuw</div><div class="v">${r.nieuweOef.length}</div><div class="u">oefeningen</div></div>
      </div>
      ${r.geenDatum?`<div class="notebox">${r.geenDatum} regel(s) stonden vóór de eerste datum. Die zet ik op ${dShort(basis)} — pas de datum hierboven aan als dat niet klopt.</div>`:""}
      ${r.over.length?`<div class="warnbox">${r.over.length} regel(s) begreep ik niet en sla ik over:<br><span style="font-weight:400;font-family:var(--mono);font-size:12px">${esc(r.over.slice(0,6).join(" · "))}${r.over.length>6?" …":""}</span></div>`:""}
      <div class="sec-label">Controleer voordat je opslaat</div>
      <div class="card"><div class="scrollx"><table class="tbl">
        <thead><tr><th>Datum</th><th>Oefening</th><th style="text-align:right">Sets (reps × gewicht)</th></tr></thead>
        <tbody>${r.sessions.slice(0,20).map(s=>s.entries.map((e,i)=>
          `<tr><td>${i?"":dShort(s.date)}</td><td>${esc(e.naam)}${e.note?`<br><span style="font-size:11px;color:var(--ink-3)">${esc(e.note)}</span>`:""}</td>
           <td class="n">${e.sets.map(x=>`<span style="${x.t==="warmup"?"color:var(--ink-3)":""}">${x.r}×${x.w?nf(x.w):"eigen"}</span>`).join("  ")}</td></tr>`).join("")).join("")}</tbody>
      </table></div></div>
      ${warmups?`<p class="mut">Grijze sets zijn als opwarmset gemarkeerd; die tellen niet mee in je records en volume.</p>`:""}
      ${r.sessions.length>20?`<p class="mut">…en nog ${r.sessions.length-20} trainingen.</p>`:""}
      <button class="btn primary lg wide" type="button" onclick="Imp.commit()">Toevoegen aan mijn logboek</button>
      <p class="mut">Bestaande trainingen blijven staan; deze komen erbij.</p>`
      : `<div class="hr"></div><div class="warnbox">Ik kon er geen sets uit halen. Zet de oefeningnaam op een eigen regel met een dubbele punt, en daaronder je sets — bijvoorbeeld <b>Bench press:</b> met daaronder <b>3 x 8 60 kilo</b>.</div>`;
  },

  /* Lichte sets binnen dezelfde oefening als opwarmset markeren */
  markWarmups(r){
    for(const s of r.sessions) for(const e of s.entries){
      const top=Math.max(...e.sets.map(x=>x.w||0));
      if(top<=0) continue;
      e.sets.forEach(x=>{ if((x.w||0)>0 && x.w<top*0.55) x.t="warmup"; });
    }
  },

  looksCSV(t){
    const l=t.trim().split(/\r?\n/).slice(0,3);
    if(l.length<2) return false;
    const c=l.map(x=>(x.match(/[;,\t]/g)||[]).length);
    return c[0]>=2 && c.every(x=>x>=2) && /datum|date|oefening|exercise|weight|gewicht|reps/i.test(l[0]);
  },
  parseCSV(txt){
    const lines=txt.trim().split(/\r?\n/);
    const delim = (lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length
                ? ((lines[0].match(/;/g)||[]).length>=(lines[0].match(/\t/g)||[]).length?";":"\t")
                : ((lines[0].match(/,/g)||[]).length>=(lines[0].match(/\t/g)||[]).length?",":"\t");
    const split=l=>{ const out=[];let cur="",q=false;
      for(let i=0;i<l.length;i++){ const c=l[i];
        if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
        else if(c===delim&&!q){ out.push(cur); cur=""; } else cur+=c; }
      out.push(cur); return out.map(s=>s.trim()); };
    const head=split(lines[0]).map(h=>h.toLowerCase());
    const col=(...names)=>head.findIndex(h=>names.some(n=>h.includes(n)));
    const cD=col("datum","date"), cE=col("oefening","exercise","name"),
          cW=col("gewicht","weight","kg"), cR=col("herhaling","reps","rep"),
          cRP=col("rpe"), cS=col("training","workout","sessie");
    if(cD<0||cE<0) return {sessions:[],nieuweOef:[],over:["Kolommen 'datum' en 'oefening' niet gevonden"]};
    const byDate=new Map(); const over=[];
    for(let i=1;i<lines.length;i++){
      if(!lines[i].trim()) continue;
      const c=split(lines[i]);
      const d=this.normDate(c[cD]); if(!d){ over.push(lines[i].slice(0,26)); continue; }
      const naam=c[cE]; if(!naam) continue;
      const w=this.num(c[cW]), r=parseInt(c[cR],10)||null;
      if(!r&&!w) continue;
      if(!byDate.has(d)) byDate.set(d,{date:d,name:(cS>=0?c[cS]:"")||"Geïmporteerd",entries:[]});
      const S2=byDate.get(d);
      let e=S2.entries.find(x=>x.naam.toLowerCase()===naam.toLowerCase());
      if(!e){ e={naam,sets:[]}; S2.entries.push(e); }
      e.sets.push({w:w||0,r:r||1,rpe:cRP>=0?this.num(c[cRP]):null});
    }
    return this.finish([...byDate.values()],over);
  },

  /* Vrije tekst. Twee vormen tegelijk aan:
     - oefeningnaam op een eigen regel ("Bench press:"), sets op de regels eronder
     - naam en sets op dezelfde regel ("Lateral raises 2 x 20 5 kilo")        */
  parseText(txt,basisDatum){
    const lines=txt.split(/\r?\n/);
    const sessions=[]; const over=[];
    let cur=null, huidigeOef=null, geenDatum=0, datumGezien=false;
    // Let op: hier NIET huidigeOef wissen. zetIn() roept dit ook aan als er nog geen
    // datum langskwam, en dan zou de lopende oefeningnaam verdwijnen.
    const nieuweSessie=d=>{ cur={date:d,name:"Geïmporteerd",entries:[]}; sessions.push(cur); };
    const zetIn=(naam,sets,note)=>{
      if(!cur){ nieuweSessie(basisDatum||today()); }
      let e=cur.entries.find(x=>x.naam.toLowerCase()===naam.toLowerCase());
      if(!e){ e={naam,sets:[],note:""}; cur.entries.push(e); }
      if(note && !e.note.includes(note)) e.note=e.note?e.note+", "+note:note;
      e.sets.push(...sets);
      return e;
    };
    for(const raw of lines){
      const line=this.schoon(raw);
      if(!line) continue;
      // datumregel?
      const d=this.normDate(line);
      if(d && this.isMostlyDate(line)){ nieuweSessie(d); huidigeOef=null; datumGezien=true; continue; }
      const p=this.parseEntry(line);
      if(!p){ over.push(line.slice(0,30)); continue; }
      if(p.type==="skip") continue;
      if(p.type==="name"){ huidigeOef=p.naam; continue; }
      // sets
      const naam = p.naam || huidigeOef;
      if(!naam){ over.push(line.slice(0,30)); continue; }
      if(p.naam) huidigeOef=p.naam;
      if(!datumGezien) geenDatum+=p.sets.length;
      zetIn(naam,p.sets,p.note);
    }
    const r=this.finish(sessions.filter(s=>s.entries.length),over);
    r.geenDatum=geenDatum;
    return r;
  },

  /* Emoji, dubbele spaties en rare aanhalingstekens weg */
  schoon(l){
    return String(l)
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}]/gu,"")
      .replace(/[\u2018\u2019]/g,"'")
      .replace(/\s+/g," ").trim();
  },

  /* Eén regel lezen. Geeft {type:"name"|"sets"|"skip"} terug. */
  parseEntry(line){
    let l=line.replace(/^[-•*·]\s+/,"").trim();
    if(!l) return null;
    // kopjes die geen oefening zijn
    if(/^(warming?[\s-]?up|warm[\s-]?up|cool(ing)?[\s-]?down|cooldown|opwarmen|afkoelen|training|workout)\s*:?\s*$/i.test(l)) return {type:"skip"};

    // notities tussen haakjes eruit halen en bewaren
    let note="";
    l=l.replace(/\(([^)]*)\)/g,(m,g)=>{ note=note?note+", "+g.trim():g.trim(); return " "; }).replace(/\s+/g," ").trim();
    if(!l) return null;

    // geen cijfers -> het is een oefeningnaam
    if(!/\d/.test(l)){
      const naam=l.replace(/[:\-–—]\s*$/,"").trim();
      return naam.length>=2 ? {type:"name",naam} : null;
    }

    // naam afsplitsen: alles vóór de dubbele punt, anders alles vóór het eerste cijfer
    let naam=null, rest=l;
    const dp=l.indexOf(":");
    if(dp>0 && /\d/.test(l.slice(dp))){ naam=l.slice(0,dp).trim(); rest=l.slice(dp+1).trim(); }
    else {
      const fi=l.search(/\d/);
      if(fi>0){ naam=l.slice(0,fi).replace(/[:\-–—]\s*$/,"").trim(); rest=l.slice(fi).trim(); }
    }
    if(naam!==null && naam.length<2) naam=null;
    if(!rest) return naam?{type:"name",naam}:null;

    const KG=/(?:kilo(?:gram)?s?|kgs?)\b/i;
    let m;

    // "10 min crosstrainer" -> cardio
    if(naam===null && (m=rest.match(/^(\d{1,3})\s*(?:min(?:uten|utes|\.)?|m)\b\s*(.*)$/i))){
      const rest2=m[2].replace(/\b(warm[\s-]?up|cool[\s-]?down|warming[\s-]?up)\b/ig,"").trim();
      if(rest2.length>=3) return {type:"sets",naam:rest2,note:note||"cardio",
        sets:[{w:0,r:+m[1],rpe:null,t:"work"}]};
    }
    // "20 push ups" -> aantal + naam
    if(naam===null && (m=rest.match(/^(\d{1,3})\s+([a-zA-Z][a-zA-Z\s'\-]{2,30})$/))){
      return {type:"sets",naam:m[2].trim(),note,sets:[{w:0,r:+m[1],rpe:null,t:"work"}]};
    }

    const heeftKG=KG.test(rest);
    const sets=[];
    const push=(n,r,w,rpe)=>{ n=clamp(Math.round(n),1,30);
      for(let i=0;i<n;i++) sets.push({w:w||0,r:Math.round(r)||1,rpe:rpe||null,t:"work"}); };

    if(heeftKG){
      // "3 x 8 60 kilo" -> 3 sets van 8 op 60.
      // Tussen reps en gewicht moet \u00E9cht een spatie (of @) staan, anders knipt
      // de regex "1 x 80 kilo" op in 8 en 0.
      if((m=rest.match(new RegExp("^(\\d{1,2})\\s*[x\u00D7*]\\s*(\\d{1,3})(?:\\s*@\\s*|\\s+op\\s+|\\s+)(\\d{1,4}(?:[.,]\\d+)?)\\s*"+KG.source,"i")))){
        push(+m[1],+m[2],this.num(m[3])); return this.klaar(naam,sets,note,rest,m[0]);
      }
      // "1 x 100 kilo" / "10 x 60 kilo" -> één set van N herhalingen
      if((m=rest.match(new RegExp("^(\\d{1,3})\\s*[x\u00D7*]\\s*(\\d{1,4}(?:[.,]\\d+)?)\\s*"+KG.source,"i")))){
        push(1,+m[1],this.num(m[2])); return this.klaar(naam,sets,note,rest,m[0]);
      }
      // "100 kilo x 5 x 3"
      if((m=rest.match(new RegExp("^(\\d{1,4}(?:[.,]\\d+)?)\\s*"+KG.source+"\\s*[x\u00D7*]\\s*(\\d{1,3})\\s*[x\u00D7*]\\s*(\\d{1,2})","i")))){
        push(+m[3],+m[2],this.num(m[1])); return this.klaar(naam,sets,note,rest,m[0]);
      }
      // "105kg 5,5,4" -> gewicht, dan een rij herhalingen
      if((m=rest.match(new RegExp("^(\\d{1,4}(?:[.,]\\d+)?)\\s*"+KG.source+"\\s*:?\\s*((?:\\d{1,3}\\s*[,/]\\s*)+\\d{1,3})\\s*$","i")))){
        const w=this.num(m[1]);
        m[2].split(/[,\/]/).forEach(r=>{ const rr=parseInt(r,10); if(rr) sets.push({w,r:rr,rpe:null,t:"work"}); });
        return this.klaar(naam,sets,note,rest,m[0]);
      }
      // "105kg 3x8"
      if((m=rest.match(new RegExp("^(\\d{1,4}(?:[.,]\\d+)?)\\s*"+KG.source+"\\s*(\\d{1,2})\\s*[x\u00D7*]\\s*(\\d{1,3})","i")))){
        push(+m[2],+m[3],this.num(m[1])); return this.klaar(naam,sets,note,rest,m[0]);
      }
      // "100 kilo" in z'n eentje -> één herhaling
      if((m=rest.match(new RegExp("^(\\d{1,4}(?:[.,]\\d+)?)\\s*"+KG.source+"\\s*$","i")))){
        push(1,1,this.num(m[1])); return this.klaar(naam,sets,note,rest,m[0]);
      }
    }

    // "100 kg x 5 x 3" of "3 x 5 x 100" zonder eenheid
    if((m=rest.match(/^(\d{1,4}(?:[.,]\d+)?)\s*[x×*]\s*(\d{1,3})\s*[x×*]\s*(\d{1,3}(?:[.,]\d+)?)\s*$/i))){
      const A=this.num(m[1]), B=+m[2], C=this.num(m[3]);
      if(A<=8 || C>=20) push(A,B,C); else push(C,B,A);
      return this.klaar(naam,sets,note,rest,m[0]);
    }

    // algemeen: alle "gewicht × reps"-paren op één regel, eventueel met @RPE
    const re=/(\d{1,4}(?:[.,]\d+)?)\s*(?:kg)?\s*[x×*]\s*(\d{1,3})(?:\s*(?:@|rpe)\s*(\d{1,2}(?:[.,]\d)?))?/gi;
    let g,found=0;
    while((g=re.exec(rest))!==null){
      found++;
      const a=this.num(g[1]), b=parseInt(g[2],10), rpe=g[3]?this.num(g[3]):null;
      if(a<=8 && a<b && !/kg/i.test(g[0])) push(a,b,0,rpe);      // "3x12" = 3 sets van 12
      else sets.push({w:a,r:b,rpe,t:"work"});
    }
    if(found) return this.klaar(naam,sets,note,rest,"");

    // alleen herhalingen: "10 9 8"
    if(/^[\s\d,\/]+$/.test(rest)){
      rest.split(/[\s,\/]+/).forEach(r=>{ const rr=parseInt(r,10); if(rr&&rr<=200) sets.push({w:0,r:rr,rpe:null,t:"work"}); });
      if(sets.length) return this.klaar(naam,sets,note,rest,"");
    }
    return null;
  },

  /* Restje tekst achter de sets bewaren als notitie ("2 sec. pause reps") */
  klaar(naam,sets,note,rest,gebruikt){
    if(!sets.length) return null;
    if(gebruikt){
      const staart=rest.slice(gebruikt.length).replace(/[^a-zA-Z\s'.\-]/g," ").replace(/\s+/g," ").trim();
      if(staart.length>=4 && staart.length<=60 && !/^(kilo|kg|reps?)$/i.test(staart))
        note=note?note+", "+staart:staart;
    }
    return {type:"sets",naam,note,sets};
  },

  isMostlyDate(l){
    if(/[x×*]\s*\d/i.test(l)) return false;
    if(/(?:kilo|kg)\b/i.test(l)) return false;
    return /^\s*(?:\d{1,4}[-\/.]\d{1,2}[-\/.]\d{2,4}|\d{1,2}\s*[a-z]{3,10}\.?\s*\d{0,4}\s*:?\s*$|(?:ma|di|wo|do|vr|za|zo)[a-z]*\s+\d{1,2})/i.test(l);
  },
  normDate(s){
    s=String(s||"").trim();
    let m=s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
    m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
    if(m){ let y=m[3]; if(y.length===2) y="20"+y;
      return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`; }
    m=s.match(/(\d{1,2})\s*([a-z]{3,10})\.?\s*(\d{4})?/i);
    if(m){
      const mi=MNDL.findIndex(x=>x.startsWith(m[2].toLowerCase().slice(0,3)));
      if(mi>=0){
        const dag=String(m[1]).padStart(2,"0"), mnd=String(mi+1).padStart(2,"0");
        if(m[3]) return `${m[3]}-${mnd}-${dag}`;
        // geen jaartal erbij: dit jaar, tenzij dat in de toekomst ligt
        const nu=new Date().getFullYear();
        const kand=`${nu}-${mnd}-${dag}`;
        return kand>today() ? `${nu-1}-${mnd}-${dag}` : kand;
      }
    }
    return null;
  },
  num(v){ if(v==null) return null; const n=parseFloat(String(v).replace(",",".").replace(/[^0-9.\-]/g,"")); return isNaN(n)?null:n; },

  /* ---- Strava ---------------------------------------------------------
     Uit "Exporteer je gegevens" komt een activities.csv met per activiteit
     onder meer duur, calorieën, hartslag en Strava's eigen Relatieve
     inspanning. Die koppelen we op datum aan de trainingen die er al staan. */
  csvRegel(l,delim){
    const out=[]; let cur="", q=false;
    for(let i=0;i<l.length;i++){
      const c=l[i];
      if(c==='"'){ if(q&&l[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
      else if(c===delim&&!q){ out.push(cur); cur=""; }
      else cur+=c;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  },

  stravaDatum(s){
    s=String(s||"").trim().replace(/^"|"$/g,"");
    if(!s) return null;
    const d=new Date(s);
    if(!isNaN(d) && d.getFullYear()>2000) return d.toISOString().slice(0,10);
    return this.normDate(s);
  },

  /* "1:23:45" of "3600" of "62" -> seconden */
  stravaDuur(v){
    const s=String(v||"").trim();
    if(!s) return null;
    if(s.includes(":")){
      const d=s.split(":").map(Number);
      if(d.some(isNaN)) return null;
      return d.length===3 ? d[0]*3600+d[1]*60+d[2] : d[0]*60+d[1];
    }
    const n=parseFloat(s.replace(",","."));
    if(isNaN(n)) return null;
    return n>1000 ? Math.round(n) : Math.round(n*60);   // grote getallen zijn al seconden
  },

  strava(txt){
    const lines=txt.trim().split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2) return {rijen:[],over:["Te weinig regels"]};
    const kop=lines[0];
    const delim=[",",";","\t"].sort((a,b)=>
      (kop.split(b).length)-(kop.split(a).length))[0];
    const H=this.csvRegel(kop,delim).map(h=>h.toLowerCase());
    const kol=(...namen)=>H.findIndex(h=>namen.some(n=>h.includes(n)));
    const cD  = kol("activity date","datum","date");
    const cT  = kol("activity type","activiteitstype","type");
    const cN  = kol("activity name","activiteitsnaam","naam");
    const cDu = kol("moving time","bewegingstijd");
    const cDu2= kol("elapsed time","verstreken tijd");
    const cK  = kol("calories","calorie");
    const cHa = kol("average heart rate","gemiddelde hartslag","gem. hartslag");
    const cHm = kol("max heart rate","maximale hartslag","max. hartslag");
    const cE  = kol("relative effort","relatieve inspanning","suffer");
    if(cD<0) return {rijen:[],over:["Geen datumkolom gevonden — is dit het bestand activities.csv?"]};

    const rijen=[], over=[];
    for(let i=1;i<lines.length;i++){
      const c=this.csvRegel(lines[i],delim);
      const datum=this.stravaDatum(c[cD]);
      if(!datum){ over.push(lines[i].slice(0,40)); continue; }
      const getal=j=>{ if(j<0) return null; const n=parseFloat(String(c[j]||"").replace(",",".")); return isNaN(n)?null:Math.round(n); };
      rijen.push({
        datum, type:(cT>=0?c[cT]:"")||"", naam:(cN>=0?c[cN]:"")||"",
        dur:this.stravaDuur(c[cDu]) || this.stravaDuur(c[cDu2]),
        kcal:getal(cK), hrGem:getal(cHa), hrMax:getal(cHm), effort:getal(cE)
      });
    }
    return {rijen,over};
  },

  /* Welke activiteiten passen bij welke gelogde training? */
  stravaKoppel(rijen){
    const perDatum={};
    for(const r of rijen){
      if(!r.hrGem && !r.kcal && !r.dur) continue;
      // per dag de activiteit met de meeste informatie
      const b=perDatum[r.datum];
      const score=x=>(x.hrGem?2:0)+(x.kcal?1:0)+(x.dur?1:0);
      if(!b || score(r)>score(b)) perDatum[r.datum]=r;
    }
    const raak=[], mis=[];
    for(const s of DB.d.sessions){
      const r=perDatum[s.date];
      if(r) raak.push({sess:s,act:r});
    }
    for(const d in perDatum) if(!DB.d.sessions.some(s=>s.date===d)) mis.push(perDatum[d]);
    return {raak,mis};
  },

  finish(sessions,over){
    const nieuweOef=[];
    const namen=new Map(DB.d.exercises.map(e=>[e.name.toLowerCase(),e.id]));
    for(const s of sessions) for(const e of s.entries){
      const k=e.naam.toLowerCase();
      if(!namen.has(k) && !nieuweOef.some(n=>n.toLowerCase()===k)) nieuweOef.push(e.naam);
    }
    sessions.sort((a,b)=>a.date<b.date?-1:1);
    return {sessions,nieuweOef,over};
  },

  commit(){
    const r=this.parsed; if(!r) return;
    const namen=new Map(DB.d.exercises.map(e=>[e.name.toLowerCase(),e.id]));
    for(const naam of r.nieuweOef){
      const g=this.raad(naam);
      const e={id:uid(),name:naam,groep:g.groep,cat:g.cat,
               type:g.cat==="cardio"?"cardio":"wr",fav:false,arch:false};
      DB.d.exercises.push(e); namen.set(naam.toLowerCase(),e.id);
    }
    let n=0;
    for(const s of r.sessions){
      const sess={id:uid(),date:s.date,start:null,end:null,name:s.name||"Geïmporteerd",
        routineId:null,notes:"",entries:s.entries.map(e=>({
          exId:namen.get(e.naam.toLowerCase()),note:e.note||"",rest:null,
          sets:e.sets.map(x=>({w:x.w||null,r:x.r,rpe:x.rpe||null,t:x.t||"work",done:true}))
        }))};
      DB.d.sessions.push(sess); n++;
    }
    DB.save(); Sheet.close(); go("log");
    toast(`${n} trainingen toegevoegd`);
  },
  /* Raad spiergroep uit de naam */
  raad(naam){
    const n=naam.toLowerCase();
    /* Volgorde is belangrijk: het eerste patroon dat past wint.
       Specifiek gaat daarom vóór algemeen — "tricep pulldown" mag niet bij Rug belanden. */
    const tref=[
      [/cardio|crosstrainer|loopband|treadmill|hometrainer|\bbike\b|fiets|roeien|row(ing)? erg|stairmaster|\brun\b|hardlopen/,"Cardio","cardio"],
      [/leg curls?|hamstring|romanian|\brdl\b|good morning|nordic/,"Hamstrings","legs"],
      [/tricep|push ?down|skull|kickback|overhead extension/,"Triceps","push"],
      [/wrist|farmer|onderarm/,"Onderarmen","pull"],
      [/bicep|curls?\b|preacher/,"Biceps","pull"],
      [/squat|leg press|hack|leg extension|lunge|quad|split squat/,"Quadriceps","legs"],
      [/hip thrust|glute|bilspier|abduction|kickback.*cable/,"Bilspieren","legs"],
      [/calf|calve|kuit/,"Kuiten","legs"],
      [/plank|crunch|\babs?\b|core|sit ?ups?|leg raises?|russian twist|ab wheel|hanging/,"Core","core"],
      [/shoulder|overhead press|\bohp\b|lateral raise|front raise|\braises?\b|delt|face pull|arnold|upright row|schouder/,"Schouders","push"],
      [/deadlift|\brows?\b|pull ?downs?|pull ?ups?|chin ?ups?|\blats?\b|shrug|back extension|\brug\b/,"Rug","pull"],
      [/bench|chest|borst|\bfly|flies|pec|\bdips?\b|push ?ups?|press/,"Borst","push"],
    ];
    for(const [re,groep,cat] of tref) if(re.test(n)) return {groep,cat};
    return {groep:"Borst",cat:"push"};
  }
};

/* ============================================================================
   STARTDATA — Robins logboek van 15 sep 2025 t/m 16 aug 2026, omgezet uit
   zijn Word-document. Wordt alleen ingeladen als de app nog helemaal leeg is,
   dus wat je zelf logt kan hier nooit door overschreven worden.
   Compact opgeslagen: n = oefeningnamen, s = [datum, naam, [[naamnr, notitie,
   [[kg, herhalingen, opwarmset, aantal keer]]]]], g = lichaamsgewicht.
   ============================================================================ */
const SEED = null;   // bewust leeg: de publieke versie bevat geen trainingsdata

function laadStartdata(){
  if(!SEED || !SEED.s || !SEED.s.length) return 0;
  const namen=new Map(DB.d.exercises.map(e=>[e.name.toLowerCase(),e.id]));
  const zoekOf = naam => {
    const k=naam.toLowerCase();
    if(namen.has(k)) return namen.get(k);
    const g=Imp.raad(naam);
    const e={id:uid(),name:naam,groep:g.groep,cat:g.cat,
             type:g.cat==="cardio"?"cardio":"wr",fav:false,arch:false};
    DB.d.exercises.push(e); namen.set(k,e.id); return e.id;
  };
  for(const [datum,naam,entries] of SEED.s){
    const sess={id:uid(),date:datum,start:null,end:null,name:naam||"Training",
                routineId:null,notes:"",entries:[]};
    for(const [nr,note,sets] of entries){
      const uit=[];
      for(const s of sets){
        const keer=s[3]||1;
        for(let i=0;i<keer;i++)
          uit.push({w:s[0]||null,r:s[1],rpe:null,t:s[2]?"warmup":"work",done:true});
      }
      sess.entries.push({exId:zoekOf(SEED.n[nr]),note:note||"",rest:null,sets:uit});
    }
    DB.d.sessions.push(sess);
  }
  for(const [d,kg] of (SEED.g||[])) DB.d.weights.push({date:d,kg});
  DB.save();
  return SEED.s.length;
}

/* ---------- 10. Opstarten ----------------------------------------------- */
/* Geen themakeuze meer: REP KING FORGED heeft één palet. De oude sleutel
   ijzerlog.theme blijft in de opslag staan en doet niets — opruimen zou
   betekenen dat we aan opslag komen, en daar blijven we vanaf. */
$("#view").addEventListener("scroll",()=>{
  $("#topbar").classList.toggle("stuck",$("#view").scrollTop>4);
},{passive:true});
window.addEventListener("beforeunload",()=>{ if(DB.d) DB.save(); });

/* Offline werken. Alleen van toepassing op de zelfgehoste versie; staat het
   bestand ergens anders, dan mislukt dit stilletjes en werkt de app gewoon. */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ---------- Verversen ---------------------------------------------------
   Een app op het beginscherm heeft geen verversknop en iOS laadt hem vaak
   uit eigen opslag. Daarom kijken we bij het openen zelf even of er online
   een nieuwere versie staat, en bieden die dan aan.                       */
async function zoekUpdate(){
  if(location.protocol!=="https:") return;
  try{
    const r=await fetch("index.html?v="+Date.now(),{cache:"no-store"});
    const t=await r.text();
    const m=t.match(new RegExp('const VERSIE="([^"]+)"'));
    if(m && m[1]!==VERSIE) $("#updateBar").classList.add("on");
  }catch(e){}
}
async function pasUpdateToe(){
  try{
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));
    for(const n of await caches.keys()) await caches.delete(n);
  }catch(e){}
  location.replace(location.pathname+"?v="+Date.now());
}

DB.boot();

/* Het openingsscherm weghalen. Moet ná DB.boot(), want pas dan weten we of er
   nog een workout loopt — en in dat geval slaan we hem helemaal over. Dat is
   precies het moment waarop je geen logo wilt zien maar je sets. */
(function(){
  const sp=$("#splash"); if(!sp) return;
  const weg=()=>{ sp.classList.add("weg"); setTimeout(()=>sp.remove(),500); };
  if(DB.d && DB.d.active){ sp.remove(); return; }
  sp.addEventListener("click",weg,{once:true});
  setTimeout(weg,1500);
})();
if(!DB.d.sessions.length && !DB.d.weights.length) laadStartdata();
render();
if(DB.d.active) toast("Je training liep nog — ga verder waar je gebleven was");
zoekUpdate();
