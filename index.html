    <p class="mut">Twijfel je over je uitvoering? Film jezelf een keer van opzij. Dat werkt
      beter dan welke uitleg ook — je ziet meteen wat er niet klopt.</p>`);
}

/* ============================================================================
   ADVIES — wat zou je vandaag moeten trainen?

   Werkt met een streefaantal werksets per week per spiergroep. Die getallen
   komen uit gangbare krachttrainingsrichtlijnen (grofweg 10–20 sets per week
   voor een grote spiergroep). Een groep die achterloopt én lang niet aan de
   beurt is geweest, scoort hoog. Een groep die je net hebt getraind valt af,
   want spieren groeien tijdens het herstel en niet tijdens de sessie.
   ============================================================================ */
const STREEF={Borst:12,Rug:14,Schouders:10,Biceps:8,Triceps:8,
              Quadriceps:12,Hamstrings:8,Bilspieren:6,Kuiten:6,Core:6};
/* Welke groepen horen bij elkaar op één dag */
const DAGSOORT=[
  {naam:"Duwdag",  kort:"borst, schouders en triceps", groepen:["Borst","Schouders","Triceps"]},
  {naam:"Trekdag", kort:"rug en biceps",               groepen:["Rug","Biceps"]},
  {naam:"Benendag",kort:"benen en bilspieren",         groepen:["Quadriceps","Hamstrings","Bilspieren","Kuiten"]},
];

const Advies={
  /* Per spiergroep: sets deze week, gemiddeld per week over 4 weken, dagen geleden */
  meting(){
    const uit={};
    for(const g in STREEF) uit[g]={groep:g,week:0,vier:0,dagen:999,laatst:null};
    for(const s of DB.d.sessions){
      const d=daysAgo(s.date);
      if(d<0||d>28) continue;
      for(const e of s.entries){
        const ex=exById(e.exId); if(!ex||!uit[ex.groep]) continue;
        const n=e.sets.filter(isWork).length; if(!n) continue;
        const u=uit[ex.groep];
        if(d<7) u.week+=n;
        u.vier+=n;
        if(d<u.dagen){ u.dagen=d; u.laatst=s.date; }
      }
    }
    for(const g in uit){
      const u=uit[g];
      u.streef=STREEF[g];
      u.perWeek=Math.round(u.vier/4*10)/10;
      u.tekort=Math.round(Math.max(0,u.streef-u.perWeek)*10)/10;
      // Net getraind = eerst herstellen. Verder weegt het tekort het zwaarst,
      // dan hoe lang je wacht, en licht mee hoe groot de spiergroep is —
      // anders duwt een kuitspier die je nooit doet je quads van de lijst.
      u.score = (u.dagen<2 ? -100 : 0) + u.tekort*3
              + Math.min(u.dagen,21)*0.5 + u.streef*0.15;
    }
    return uit;
  },

  keuze:0,

  /* Alle bruikbare dagsoorten, de urgentste voorop. Zo kun je zelf kiezen in
     plaats van dat de app één ding voorschrijft. */
  alle(){
    const m=this.meting();
    const uit=[];
    for(const d of DAGSOORT){
      // Groepen van deze dagsoort die niet net getraind zijn, op urgentie
      const kern=d.groepen.filter(g=>m[g] && m[g].dagen>=2)
                          .sort((a,b)=>m[b].score-m[a].score).slice(0,3);
      if(!kern.length) continue;
      // Core mag erbij, maar mag nooit een hoofdgroep verdringen
      const extra = (m.Core && m.Core.tekort>2 && m.Core.dagen>=3 && !kern.includes("Core"))
                    ? ["Core"] : [];
      const groepen=[...kern,...extra];
      const oefeningen=this.kiesOefeningen(groepen);
      if(oefeningen.length<2) continue;
      const score=kern.reduce((a,g)=>a+m[g].score,0)/kern.length;
      uit.push({dag:d, groepen, oefeningen, score, meting:m});
    }
    return uit.sort((a,b)=>b.score-a.score);
  },
  voorstel(){
    const a=this.alle();
    return a.length ? a[Math.min(this.keuze,a.length-1)] : null;
  },
  kies(i){ this.keuze=i; render(); },

  /* Per groep oefeningen kiezen: het liefst uit zijn eigen geschiedenis, en
     dan die hij het langst niet heeft gedaan. Heeft hij voor een groep nog
     niets staan — zoals bilspieren en kuiten — dan pakken we een standaard-
     oefening uit de bibliotheek, want anders blijft die groep leeg.        */
  kiesOefeningen(groepen){
    const uit=[];
    // de urgentste groep krijgt er twee, de rest één, tot je op ~5 oefeningen zit
    const aantal=groepen.map((_,i)=>i===0?2:1);
    for(let i=1; aantal.reduce((a,b)=>a+b,0)<4 && i<groepen.length*3; i++)
      aantal[i%groepen.length]=Math.min(3,aantal[i%groepen.length]+1);

    groepen.forEach((g,gi)=>{
      const perGroep=aantal[gi];
      const metHistorie=DB.d.exercises
        .filter(e=>e.groep===g && !e.arch && !e.nietVoorstellen && e.type!=="cardio")
        .map(e=>{
          const h=historyFor(e.id); if(!h.length) return null;
          const l=h[h.length-1], b=bestOf(l.sets);
          return {id:e.id,naam:e.name,sessies:h.length,dagen:daysAgo(l.date),w:b.w,r:b.r};
        }).filter(Boolean);

      let lijst=metHistorie.filter(k=>k.sessies>=2);
      if(!lijst.length) lijst=metHistorie;
      // Verwaarloosd weegt zwaar, maar niet oneindig: door de dagen op 45 te
      // kappen kan een vertrouwde basisoefening het nog winnen van iets wat
      // je één keer een half jaar geleden hebt gedaan.
      const gewicht=k=>Math.min(k.dagen,45)+k.sessies*4;
      lijst.sort((a,b)=>gewicht(b)-gewicht(a));

      if(!lijst.length){
        const e=DB.d.exercises.find(x=>x.groep===g && !x.arch && !x.nietVoorstellen && x.type!=="cardio");
        if(e) lijst=[{id:e.id,naam:e.name,sessies:0,dagen:999,w:null,r:null}];
      }
      for(const k of lijst.slice(0,perGroep)) uit.push({...k,groep:g});
    });
    return uit;
  },

  /* De kaart op het startscherm */
  kaart(){
    const opties=this.alle();
    // Alles net gehad? Dan is niet trainen het juiste advies.
    if(!opties.length) return `
      <div class="card">
        <div class="card-head"><div class="card-title">Voorstel voor vandaag</div>
          <span class="chip good">Rustdag</span></div>
        <div style="padding:13px 14px 15px"><p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">
          Je hebt elke spiergroep net gehad. Spieren groeien tijdens het herstel, niet tijdens
          de set — een dag rust levert je nu meer op dan een training erbij.</p></div>
      </div>`;
    const i=Math.min(this.keuze,opties.length-1);
    const v=opties[i];
    const m=v.meting;
    const reden=v.groepen.map(g=>{
      const u=m[g];
      if(u.dagen>=999) return `<b>${g}</b> heb je in geen vier weken getraind`;
      if(u.tekort>=u.streef*0.5) return `<b>${g}</b> kreeg ${u.perWeek} sets per week, je streeft naar ${u.streef}`;
      return `<b>${g}</b> is ${u.dagen} dagen geleden geweest`;
    }).slice(0,2).join(" en ");
    return `
      <div class="card">
        <div class="card-head"><div class="card-title">Voorstel voor vandaag</div>
          ${opties.length>1?`<span class="chip">${i+1} van ${opties.length}</span>`:`<span class="chip acc">${esc(v.dag.naam)}</span>`}</div>
        ${opties.length>1?`<div style="padding:12px 14px 0">
          <div class="seg">${opties.map((o,k)=>
            `<button type="button" class="${k===i?"on":""}" onclick="Advies.kies(${k})">${esc(o.dag.naam)}</button>`).join("")}</div>
        </div>`:""}
        <div style="padding:13px 14px 4px">
          <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">${reden}.</p>
        </div>
        <div style="padding:6px 14px 12px;display:flex;flex-direction:column;gap:7px">
          ${v.oefeningen.map(o=>{
            // Nieuw of lang niet gedaan? Dan een knopje met uitleg erbij.
            const onbekend = !o.sessies || o.dagen>90;
            return `<div style="display:flex;align-items:center;gap:10px">
              <span style="flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.naam)}</span>
              ${onbekend?`<button type="button" onclick="toonUitleg('${esc(o.naam).replace(/'/g,"\\'")}')"
                 style="width:26px;height:26px;flex:none;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px"
                 aria-label="Uitleg">?</button>`:`<span class="chip">${esc(o.groep)}</span>`}
              <span class="num" style="font-size:12.5px;color:var(--ink-3);white-space:nowrap">${o.w?setTekst(o.w,o.r):(o.sessies?"eigen gewicht":"nieuw")}</span>
            </div>`;
          }).join("")}
        </div>
        <div style="padding:0 14px 13px"><button class="btn primary wide" type="button"
          onclick="Advies.start()">Start deze workout</button></div>
      </div>`;
  },

  start(){
    const v=this.voorstel(); if(!v) return;
    unlockAudio();
    DB.d.active={id:uid(),date:today(),start:Date.now(),end:null,
      name:v.dag.naam,routineId:null,notes:"",
      entries:v.oefeningen.map(o=>({exId:o.id,note:"",rest:null,
        sets:Array.from({length:3},()=>({w:o.w||null,r:o.r||null,rpe:null,t:"work",done:false}))}))};
    DB.save(); render();
  },

  /* Balansoverzicht: sets deze week tegenover het streefgetal */
  balans(){
    const m=this.meting();
    const rijen=Object.keys(STREEF).map(g=>m[g]).sort((a,b)=>b.tekort-a.tekort);
    return `
      <div class="card">
        <div class="card-head"><div class="card-title">Balans deze week</div>
          <span class="chip">werksets</span></div>
        <div style="padding:12px 14px;display:flex;flex-direction:column;gap:9px">
          ${rijen.map(u=>{
            const pct=clamp(u.week/u.streef*100,0,100);
            const kleur = u.week>=u.streef ? "var(--good)" : (u.week>=u.streef*0.5 ? "var(--accent)" : "var(--bad)");
            return `<div style="display:flex;align-items:center;gap:10px">
              <span style="width:88px;flex:none;font-size:12.5px;color:var(--ink-2)">${u.groep}</span>
              <div style="flex:1;height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden">
                <i style="display:block;height:100%;width:${pct}%;background:${kleur};border-radius:99px"></i></div>
              <span class="num" style="width:46px;text-align:right;font-size:12px;color:var(--ink-3)">${u.week}/${u.streef}</span>
            </div>`;
          }).join("")}
        </div>
        <div style="padding:0 14px 13px"><p class="mut" style="font-size:12.5px">
          Streefgetallen zijn gangbare richtlijnen voor spiergroei, geen wet. Rood betekent
          dat je deze week onder de helft zit.</p></div>
      </div>`;
  }
};

/* ============================================================================
   TRAIN
   ============================================================================ */
const Train={
  render(V){
    const a=DB.d.active;
    if(a) return this.active(V,a);
    head("Klaar om te trainen?", DB.d.sessions.length?`${DB.d.sessions.length} trainingen gelogd`:"Nog geen trainingen");
    const laatste=allSessions()[0];
    let h="";
    h+=Advies.kaart();
    h+=`<button class="btn ${DB.d.sessions.length?"":"primary"} lg wide" type="button" onclick="Train.start(null)">Lege training starten</button>`;
    if(DB.d.sessions.length>=4) h+=Advies.balans();
    if(DB.d.routines.length){
      h+=`<div class="sec-label">Schema's</div><div class="list">`+
        DB.d.routines.map(r=>`<button class="li" type="button" onclick="Train.start('${r.id}')">
          <div class="li-main"><b>${esc(r.name)}</b><span>${r.items.length} oefeningen${r.last?" · laatst "+relDate(r.last):""}</span></div>
          <div class="chev"></div></button>`).join("")+`</div>`;
    } else {
      h+=`<button class="btn ghost wide" type="button" onclick="Meer.routineNew()">Schema aanmaken</button>`;
    }
    if(laatste){
      const st=sessionStats(laatste);
      h+=`<div class="sec-label">Vorige training</div>
      <div class="card">
        <div class="card-head"><div class="card-title">${esc(laatste.name||"Training")}</div><span class="chip">${relDate(laatste.date)}</span></div>
        <div class="tiles" style="border:0;border-radius:0">
          <div class="tile"><div class="k">Volume</div><div class="v">${kf(st.vol)}</div><div class="u">kg</div></div>
          <div class="tile"><div class="k">Sets</div><div class="v">${st.sets}</div><div class="u">werksets</div></div>
          <div class="tile"><div class="k">Duur</div><div class="v">${st.dur?hhmm(st.dur):"–"}</div><div class="u">&nbsp;</div></div>
        </div>
        <div style="padding:11px 14px">
          ${laatste.entries.map(e=>{
            const ws=e.sets.filter(isWork);
            return `<div style="display:flex;gap:8px;font-size:13.5px;padding:3px 0"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(exName(e.exId))}</span><span class="num" style="color:var(--ink-3);white-space:nowrap">${ws.length} sets${ws.length?" · "+nf(Math.max(...ws.map(s=>s.w||0)))+" kg":""}</span></div>`;
          }).join("")}
        </div>
        <div style="padding:0 14px 13px"><button class="btn sm wide" type="button" onclick="Train.repeat('${laatste.id}')">Deze training herhalen</button></div>
      </div>`;
    }
    V.innerHTML=h;
  },

  start(routineId){
    unlockAudio();
    const r=routineId?DB.d.routines.find(x=>x.id===routineId):null;
    DB.d.active={
      id:uid(),date:today(),start:Date.now(),end:null,
      name:r?r.name:"Training",routineId:routineId||null,notes:"",
      entries:(r?r.items:[]).map(it=>({exId:it.exId,note:"",rest:it.rest||null,
        sets:Array.from({length:it.sets||3},()=>({w:null,r:null,rpe:null,t:"work",done:false}))}))
    };
    DB.save(); render();
  },
  repeat(sessId){
    const s=DB.d.sessions.find(x=>x.id===sessId); if(!s) return;
    unlockAudio();
    DB.d.active={id:uid(),date:today(),start:Date.now(),end:null,name:s.name||"Training",
      routineId:s.routineId||null,notes:"",
      entries:s.entries.map(e=>({exId:e.exId,note:"",rest:e.rest||null,
        sets:e.sets.filter(x=>x.t!=="warmup").map(x=>({w:x.w,r:x.r,rpe:null,t:"work",done:false}))}))};
    DB.save(); render();
  },

  active(V,a){
    const st=sessionStats(a);
    const min=Math.round((Date.now()-a.start)/60000);
    head(esc(a.name), `<span class="num">${min} min</span> · ${st.sets} sets · <span class="num">${kf(st.vol)}</span> kg`,
      `<button class="btn sm primary" type="button" onclick="Train.finish()">Klaar</button>`);
    let h="";
    if(!a.entries.length){
      h+=`<div class="card"><div class="empty"><div class="big">Nog geen oefeningen</div><p>Voeg je eerste oefening toe en begin met loggen.</p></div></div>`;
    }
    h+=a.entries.map((e,i)=>this.exCard(e,i,a)).join("");
    h+=`<button class="btn wide" type="button" onclick="Train.pickExercise()">+ Oefening toevoegen</button>
        <div class="row"><button class="btn ghost wide" type="button" onclick="Train.notes()">Notitie</button>
        <button class="btn ghost wide" type="button" onclick="Train.cancel()">Training annuleren</button></div>`;
    V.innerHTML=h;
    clearInterval(this._iv);
    this._iv=setInterval(()=>{ if(DB.d.active&&page==="train"){
      const m=Math.round((Date.now()-DB.d.active.start)/60000);
      const s=sessionStats(DB.d.active);
      $("#pgSub").innerHTML=`<span class="num">${m} min</span> · ${s.sets} sets · <span class="num">${kf(s.vol)}</span> kg`;
    }},20000);
  },

  exCard(e,i,a){
    const ex=exById(e.exId)||{name:"?",type:"wr",groep:"?"};
    const hist=historyFor(e.exId,a.id);
    const vorige=hist[hist.length-1];
    const pr=prFor(e.exId,a.id);
    const cardio=ex.type==="cardio", tijd=ex.type==="time", bw=ex.type==="bw";
    // Robin noteert eerst de herhalingen, dan het gewicht: 5 x 80 kg
    const kolA = cardio?"Min":(tijd?"Sec":"Reps");
    const kolB = cardio?"Km":(bw?"Extra":"Kg");
    const kolC = cardio?"Kcal":"";
    return `<div class="ex">
      <div class="ex-head">
        <div class="ex-name"><b>${esc(ex.name)}</b>
          <div class="ex-meta"><span class="chip">${esc(ex.groep)}</span>
          ${vorige?`<span class="prev-hint">vorige: ${vorige.sets.map(s=>setTekst(s.w,s.r)).join("  ")}</span>`:`<span class="prev-hint">eerste keer</span>`}
          ${pr.e1?`<span class="prev-hint">· record ${nf(Math.round(pr.e1))}kg e1RM</span>`:""}</div>
        </div>
        <button class="ex-more" type="button" onclick="Train.exMenu(${i})" aria-label="Opties">⋯</button>
      </div>
      <div class="setgrid head${cardio?" cardio":""}"><span>Set</span><span>${kolA}</span><span>${kolB}</span>${cardio?`<span>${kolC}</span>`:""}<span></span></div>
      ${e.sets.map((s,j)=>this.setRow(s,j,i,e,vorige,cardio)).join("")}
      <div class="ex-foot">
        <button class="btn sm wide" type="button" onclick="Train.addSet(${i})">+ Set</button>
        <button class="btn sm ghost" type="button" onclick="Train.addSet(${i},'warmup')">+ Opwarm</button>
        ${!cardio?`<button class="btn sm ghost" type="button" onclick="Train.plateCalc(${i})">Platen</button>`:""}
      </div>
    </div>`;
  },
  setRow(s,j,i,e,vorige,cardio){
    const vs = vorige && vorige.sets[j];
    const nr = e.sets.slice(0,j+1).filter(x=>x.t!=="warmup").length;
    const label = s.t==="warmup"?"W":(s.t==="drop"?"D":(s.t==="fail"?"F":nr));
    return `<div class="setgrid setrow ${cardio?"cardio ":""}${s.done?"done":""}">
      <button class="setno ${s.t==="warmup"?"warmup":s.t==="drop"?"drop":s.t==="fail"?"fail":""}" type="button" onclick="Train.setMenu(${i},${j})">${label}</button>
      ${cardio
        ? `<input class="inp num" inputmode="decimal" value="${s.w??""}" placeholder="${vs?nf(vs.w||0):"–"}" onchange="Train.setVal(${i},${j},'w',this.value)" aria-label="Minuten">
           <input class="inp num" inputmode="numeric" value="${s.r??""}" placeholder="${vs?(vs.r||0):"–"}" onchange="Train.setVal(${i},${j},'r',this.value)" aria-label="Kilometers">`
        : `<input class="inp num" inputmode="numeric" value="${s.r??""}" placeholder="${vs?(vs.r||0):"–"}" onchange="Train.setVal(${i},${j},'r',this.value)" aria-label="Herhalingen">
           <input class="inp num" inputmode="decimal" value="${s.w??""}" placeholder="${vs?nf(vs.w||0):"–"}" onchange="Train.setVal(${i},${j},'w',this.value)" aria-label="Gewicht">`}
      ${cardio?`<input class="inp num" inputmode="numeric" value="${s.kcal??""}" placeholder="–" onchange="Train.setVal(${i},${j},'kcal',this.value)" aria-label="Calorieën">`:""}
      <button class="tick ${s.done?"on":""}" type="button" onclick="Train.toggle(${i},${j})" aria-label="Set afvinken">
        <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
    </div>`;
  },

  setVal(i,j,k,v){
    const s=DB.d.active.entries[i].sets[j];
    v=String(v).replace(",",".").trim();
    s[k]= v===""?null:((k==="r"||k==="kcal")?parseInt(v,10)||null:parseFloat(v)||null);
    DB.save();
  },
  toggle(i,j){
    unlockAudio();
    const a=DB.d.active, e=a.entries[i], s=e.sets[j];
    if(!s.done){
      // leeg? neem waardes van de vorige set of van de vorige training over
      if(s.w==null&&s.r==null){
        const prev=e.sets[j-1];
        if(prev&&(prev.w!=null||prev.r!=null)){ s.w=prev.w; s.r=prev.r; }
        else { const h=historyFor(e.exId,a.id).slice(-1)[0];
               if(h&&h.sets[j]){ s.w=h.sets[j].w; s.r=h.sets[j].r; } }
      }
      s.done=true; s.ts=Date.now();
      const rustT = s.t==="warmup" ? S().restWarm : (e.rest||S().rest);
      if(rustT>0) Rest.start(rustT);
      const p=this.checkPR(e.exId,s,a.id);
      render();
      if(p) toast(p);
    } else { s.done=false; render(); }
    DB.save();
  },
  checkPR(exId,s,sessId){
    if(s.t==="warmup"||!s.w||!s.r) return null;
    const pr=prFor(exId,sessId);
    if(!pr.sessies) return null;
    const e=e1rm(s.w,s.r);
    if(e>pr.e1+0.05) return `Record! ${setTekst(s.w,s.r,true)} — je beste ooit`;
    if(s.w>pr.zwaarst) return `Zwaarste ooit: ${nf(s.w)} kg`;
    return null;
  },
  addSet(i,type){
    const e=DB.d.active.entries[i];
    const last=e.sets.filter(s=>s.t!=="warmup").slice(-1)[0];
    e.sets.push({w:type==="warmup"?null:(last?last.w:null),r:type==="warmup"?null:(last?last.r:null),
                 rpe:null,t:type||"work",done:false});
    DB.save(); render();
  },
  setMenu(i,j){
    const s=DB.d.active.entries[i].sets[j];
    const opt=[["work","Werkset"],["warmup","Opwarmset"],["drop","Dropset"],["fail","Tot falen"]];
    Sheet.open("Set aanpassen",`
      <div class="seg">${opt.map(([k,l])=>`<button type="button" class="${s.t===k?"on":""}" onclick="Train.setType(${i},${j},'${k}')">${l}</button>`).join("")}</div>
      <button class="btn danger wide" type="button" onclick="Train.delSet(${i},${j})">Set verwijderen</button>`);
  },
  setType(i,j,t){ DB.d.active.entries[i].sets[j].t=t; DB.save(); Sheet.close(); render(); },
  delSet(i,j){ DB.d.active.entries[i].sets.splice(j,1); DB.save(); Sheet.close(); render(); },

  exMenu(i){
    const e=DB.d.active.entries[i];
    Sheet.open(exName(e.exId),`
      <div class="field"><label>Notitie bij deze oefening</label>
        <input class="ctrl" id="exNote" value="${esc(e.note||"")}" placeholder="bijv. stoel op 4, langzaam zakken"></div>
      <div class="field"><label>Rusttijd (seconden)</label>
        <input class="ctrl num" id="exRest" inputmode="numeric" value="${e.rest||""}" placeholder="${S().rest} (standaard)"></div>
      <button class="btn primary wide" type="button" onclick="Train.exSave(${i})">Opslaan</button>
      <div class="hr"></div>
      <button class="btn primary wide" type="button" onclick="Train.bovenaan(${i})">Deze nu doen</button>
      <button class="btn wide" type="button" onclick="toonUitleg('${esc(exName(e.exId)).replace(/'/g,"\\'")}')">Hoe doe ik dit?</button>
      <div class="row">
        <button class="btn ghost wide" type="button" onclick="Train.move(${i},-1)">↑ Omhoog</button>
        <button class="btn ghost wide" type="button" onclick="Train.move(${i},1)">↓ Omlaag</button>
      </div>
      <button class="btn wide" type="button" onclick="Sheet.close();go('oefening','${e.exId}')">Voortgang bekijken</button>
      <button class="btn danger wide" type="button" onclick="Train.delEx(${i})">Oefening verwijderen</button>`);
  },
  exSave(i){
    const e=DB.d.active.entries[i];
    e.note=$("#exNote").value.trim();
    e.rest=parseInt($("#exRest").value,10)||null;
    DB.save(); Sheet.close(); render();
  },
  move(i,d){
    const a=DB.d.active.entries, j=i+d; if(j<0||j>=a.length) return;
    [a[i],a[j]]=[a[j],a[i]]; DB.save(); Sheet.close(); render();
  },
  /* Van volgorde afwijken zonder tien keer op "omhoog" te tikken */
  bovenaan(i){
    const a=DB.d.active.entries;
    a.unshift(a.splice(i,1)[0]);
    DB.save(); Sheet.close(); render();
  },
  delEx(i){ DB.d.active.entries.splice(i,1); DB.save(); Sheet.close(); render(); },

  pickExercise(){
    ExPicker.open(id=>{
      DB.d.active.entries.push({exId:id,note:"",rest:null,
        sets:Array.from({length:3},()=>({w:null,r:null,rpe:null,t:"work",done:false}))});
      DB.save(); Sheet.close(); render();
    });
  },
  notes(){
    Sheet.open("Notitie bij training",`
      <textarea class="ctrl" id="sNote" placeholder="Hoe voelde het? Slaap, energie, blessures…">${esc(DB.d.active.notes||"")}</textarea>
      <button class="btn primary wide" type="button" onclick="DB.d.active.notes=$('#sNote').value;DB.save();Sheet.close();toast('Notitie opgeslagen')">Opslaan</button>`);
  },
  plateCalc(i){
    const e=DB.d.active.entries[i];
    const last=e.sets.filter(s=>s.w).slice(-1)[0];
    Sheet.open("Platen per kant",`
      <div class="field"><label>Totaalgewicht (kg)</label>
        <input class="ctrl num" id="pcW" inputmode="decimal" value="${last?last.w:""}" oninput="Train.pcDraw()"></div>
      <div class="field"><label>Stang (kg)</label>
        <input class="ctrl num" id="pcB" inputmode="decimal" value="${S().bar}" oninput="Train.pcDraw()"></div>
      <div id="pcOut"></div>`,()=>this.pcDraw());
  },
  pcDraw(){
    const PC={25:"#C8332A",20:"#1F5FA8",15:"#E2B33C",10:"#2E8B57",5:"#E9EAEC",2.5:"#C8332A",1.25:"#B9BEC6",0.5:"#B9BEC6"};
    const total=parseFloat(String($("#pcW").value).replace(",","."))||0;
    const bar=parseFloat(String($("#pcB").value).replace(",","."))||0;
    let side=(total-bar)/2, out=[];
    if(side<=0){ $("#pcOut").innerHTML=`<p class="mut">Alleen de stang${side<0?" — dit gewicht past niet":""}.</p>`; return; }
    let rest=side;
    for(const p of S().plates.slice().sort((a,b)=>b-a)){
      while(rest>=p-0.001){ out.push(p); rest=Math.round((rest-p)*100)/100; }
    }
    const maxP=Math.max(...out,25);
    $("#pcOut").innerHTML=`
      <div class="plates">
        <div class="bar"></div>
        ${out.map(p=>{
          const hgt=34+(p/maxP)*44, licht=p===5||p===1.25||p===0.5;
          return `<div class="plate ${licht?"light":""}" style="height:${hgt}px;background:${PC[p]||"#7A828E"}">${p}</div>`;
        }).join("")}
        <div class="bar" style="max-width:24px"></div>
      </div>
      <p class="mut" style="text-align:center">Per kant: <b class="num" style="color:var(--ink)">${out.map(nf).join(" + ")||"–"}</b> = ${nf(side)} kg${rest>0.01?` <span style="color:var(--bad)">(${nf(rest)} kg past niet)</span>`:""}</p>`;
  },

  async cancel(){
    if(await ask("Training annuleren?","Alles wat je deze training hebt gelogd gaat weg.","Annuleren",true)){
      DB.d.active=null; DB.save(); render();
    }
  },
  finish(){
    const a=DB.d.active, st=sessionStats(a);
    if(!st.sets){
      ask("Niets gelogd","Er zijn geen afgevinkte sets. Wil je de training weggooien?","Weggooien",true)
        .then(v=>{ if(v){ DB.d.active=null; DB.save(); render(); } });
      return;
    }
    const prs=[];
    for(const e of a.entries){
      const pr=prFor(e.exId,a.id); if(!pr.sessies) continue;
      const b=bestOf(e.sets.filter(isWork));
      if(b.e1>pr.e1+0.05) prs.push(`${exName(e.exId)} — ${setTekst(b.w,b.r,true)}`);
    }
    Sheet.open("Training afronden",`
      <div class="tiles">
        <div class="tile"><div class="k">Duur</div><div class="v">${hhmm(Math.round((Date.now()-a.start)/1000))}</div><div class="u">&nbsp;</div></div>
        <div class="tile"><div class="k">Volume</div><div class="v">${kf(st.vol)}</div><div class="u">kg</div></div>
        <div class="tile"><div class="k">Sets</div><div class="v">${st.sets}</div><div class="u">werksets</div></div>
        <div class="tile"><div class="k">Reps</div><div class="v">${st.reps}</div><div class="u">totaal</div></div>
      </div>
      ${prs.length?`<div class="card pr-pop"><div class="card-head"><div class="card-title">Nieuwe records</div><span class="chip good">${prs.length}</span></div>
        <div style="padding:11px 14px;display:flex;flex-direction:column;gap:6px">${prs.map(p=>`<div style="font-size:14px">${esc(p)}</div>`).join("")}</div></div>`:""}
      <div class="field"><label>Naam van deze training</label>
        <input class="ctrl" id="fName" value="${esc(a.name)}"></div>
      <div class="field"><label>Notitie</label>
        <textarea class="ctrl" id="fNote" style="min-height:70px" placeholder="Hoe ging het?">${esc(a.notes||"")}</textarea></div>
      <div class="hr"></div>
      <div class="sec-label">Van je Apple Watch · optioneel</div>
      <div class="field"><label>Plak wat de opdracht op je klembord zette</label>
        <textarea class="ctrl" id="fPlak" style="min-height:58px;font-size:12px"
          placeholder="Plak hier — de velden hieronder vullen zichzelf"
          oninput="Train.leesHorloge(this.value)"></textarea></div>
      <div class="row">
        <div class="field" style="flex:1"><label>Hartslag gem</label>
          <input class="ctrl num" id="fHr" inputmode="numeric" placeholder="128"></div>
        <div class="field" style="flex:1"><label>Max</label>
          <input class="ctrl num" id="fHrMax" inputmode="numeric" placeholder="171"></div>
        <div class="field" style="flex:1"><label>Kcal</label>
          <input class="ctrl num" id="fKcal" inputmode="numeric" placeholder="512"></div>
      </div>
      <button class="btn primary lg wide" type="button" onclick="Train.save()">Opslaan</button>`);
  },
  /* Vult de horlogevelden vanuit geplakte tekst */
  leesHorloge(txt){
    const r=Inspanning.lees(txt);
    if(r.gem)  $("#fHr").value=r.gem;
    if(r.max)  $("#fHrMax").value=r.max;
    if(r.kcal) $("#fKcal").value=r.kcal;
    if(r.gem||r.max||r.kcal) toast("Cijfers overgenomen");
  },

  save(){
    const a=DB.d.active;
    a.name=$("#fName").value.trim()||"Training";
    a.notes=$("#fNote").value.trim();
    a.end=Date.now();
    const hrGem=parseInt($("#fHr").value,10)||null;
    const hrMax=parseInt($("#fHrMax").value,10)||null;
    const kcal =parseInt($("#fKcal").value,10)||null;
    if(hrGem||hrMax) a.hr={gem:hrGem,max:hrMax};
    if(kcal) a.kcal=kcal;
    // duur uit de opdracht gebruiken als de app zelf niet meeliep
    const uitPlak=Inspanning.lees($("#fPlak")?$("#fPlak").value:"");
    if(uitPlak.min && (!a.start || (a.end-a.start)/60000 < 2)) a.start=a.end-uitPlak.min*60000;
    a.entries=a.entries.filter(e=>e.sets.some(s=>s.done));
    a.entries.forEach(e=>e.sets=e.sets.filter(s=>s.done));
    DB.d.sessions.push(a);
    if(a.routineId){ const r=DB.d.routines.find(x=>x.id===a.routineId); if(r) r.last=a.date; }
    DB.d.active=null; Rest.stop(); DB.save(); Sheet.close();
    clearInterval(this._iv);
    toast("Training opgeslagen"); go("log");
  }
};

/* ---------- Oefening kiezen -------------------------------------------- */
const ExPicker={
  cb:null,q:"",groep:"",
  open(cb){ this.cb=cb; this.q=""; this.groep="";
    Sheet.open("Oefening kiezen",`
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="exQ" placeholder="Zoek oefening…" oninput="ExPicker.filter(this.value)" autocomplete="off"></div>
      <div class="row wrap" id="exGroeps"></div>
      <div id="exList"></div>
      <button class="btn ghost wide" type="button" onclick="Meer.exNew(ExPicker.cb)">+ Nieuwe oefening maken</button>`,
      ()=>{ this.groepsBar(); this.list(); });
  },
  groepsBar(){
    $("#exGroeps").innerHTML=[["","Alles"],...GROEPEN.map(g=>[g,g])]
      .map(([k,l])=>`<button class="btn sm ${this.groep===k?"primary":"ghost"}" type="button" onclick="ExPicker.setGroep('${k}')">${l}</button>`).join("");
  },
  setGroep(g){ this.groep=g; this.groepsBar(); this.list(); },
  filter(v){ this.q=v.toLowerCase(); this.list(); },
  list(){
    // recent gebruikte oefeningen bovenaan
    const recent=[];
    for(const s of allSessions().slice(0,12)) for(const e of s.entries) if(!recent.includes(e.exId)) recent.push(e.exId);
    let ex=DB.d.exercises.filter(e=>!e.arch);
    if(this.groep) ex=ex.filter(e=>e.groep===this.groep);
    if(this.q) ex=ex.filter(e=>e.name.toLowerCase().includes(this.q));
    ex.sort((a,b)=>{
      const ra=recent.indexOf(a.id), rb=recent.indexOf(b.id);
      if(ra!==rb) return (ra<0?999:ra)-(rb<0?999:rb);
      return a.name.localeCompare(b.name);
    });
    $("#exList").innerHTML= ex.length? `<div class="list">`+ex.slice(0,60).map(e=>{
      const h=historyFor(e.id); const last=h[h.length-1];
      return `<button class="li" type="button" onclick="ExPicker.pick('${e.id}')">
        <div class="li-main"><b>${esc(e.name)}</b><span>${esc(e.groep)}${last?" · "+relDate(last.date):""}</span></div>
        ${recent.indexOf(e.id)>-1?`<span class="chip acc">recent</span>`:""}</button>`;
    }).join("")+`</div>` : `<p class="mut" style="padding:14px 2px">Niets gevonden. Maak hem hieronder aan.</p>`;
  },
  pick(id){ const cb=this.cb; if(cb) cb(id); }
};

/* ============================================================================
   LOGBOEK
   ============================================================================ */
const Log={
  render(V){
    this.bewerk=false;                       // bewerkstand niet meeslepen naar de lijst
    const ss=allSessions();
    head("Logboek", ss.length?`${ss.length} trainingen · sinds ${dShort(ss[ss.length-1].date)}`:"");
    if(!ss.length){
      V.innerHTML=`<div class="card"><div class="empty"><div class="big">Nog niets gelogd</div>
        <p>Start je eerste training, of haal je bestaande logboek uit Excel of Notities binnen via Meer → Importeren.</p></div></div>`;
      return;
    }
    // heatmap laatste ~18 weken
    const dagen=126, counts={};
    ss.forEach(s=>counts[s.date]=(counts[s.date]||0)+sessionStats(s).sets);
    let heat="";
    for(let i=dagen-1;i>=0;i--){
      const d=addDays(today(),-i), c=counts[d]||0;
      heat+=`<i class="${c?(c>=20?"l3":c>=10?"l2":"l1"):""}" title="${d}"></i>`;
    }
    const groepen=new Map();
    ss.forEach(s=>{ const k=s.date.slice(0,7); if(!groepen.has(k)) groepen.set(k,[]); groepen.get(k).push(s); });

    V.innerHTML=`
      <div class="card"><div class="card-head"><div class="card-title">Laatste 18 weken</div>
        <span class="chip">${ss.filter(s=>daysAgo(s.date)<126).length} trainingen</span></div>
        <div class="heat">${heat}</div></div>
      ${(()=>{
        const prs=Inspanning.prPerSessie();
        return [...groepen].map(([k,list])=>{
          const [y,m]=k.split("-");
          return `<div class="sec-label">${MNDL[+m-1]} ${y} · ${list.length} ${list.length===1?"training":"trainingen"}</div>
          <div class="list">`+list.map(s=>{
            const st=sessionStats(s);
            const top=this.hoofdoefening(s);
            // Een naam als "Training" zegt niets; dan liever de zwaarste oefening
            const vaag=/^(training|ge[iï]mporteerd)$/i.test((s.name||"").trim());
            const titel = vaag && top
              ? top.naam + (st.oef>1 ? ` +${st.oef-1}` : "")
              : (s.name||"Training");
            const records=prs[s.id]||0;
            return `<button class="li" type="button" onclick="go('sessie','${s.id}')">
              <div class="li-main"><b>${esc(titel)}</b>
                <span>${dShort(s.date)} · ${st.oef} ${st.oef===1?"oefening":"oefeningen"} · ${st.sets} sets</span>
                ${top&&top.w?`<span class="num" style="color:var(--ink-2);font-size:12.5px">zwaarst: ${esc(top.naam)} ${setTekst(top.w,top.r,true)}</span>`:""}
              </div>
              ${records?`<span class="chip good">${records>1?records+"× ":""}PR</span>`:""}
              <div class="chev"></div></button>`;
          }).join("")+`</div>`;
        }).join("");
      })()}`;
  },

  /* De zwaarste oefening van een training, op geschat 1RM. Dat is wat je
     herkent als je terugkijkt — veel meer dan een totaal aantal kilo's. */
  hoofdoefening(s){
    let best=null;
    for(const e of s.entries){
      const w=e.sets.filter(isWork);
      if(!w.length) continue;
      const b=bestOf(w);
      if(!best || b.e1>best.e1) best={naam:exName(e.exId), e1:b.e1, w:b.w, r:b.r};
    }
    return best;
  },

  detail(V,id){
    const s=DB.d.sessions.find(x=>x.id===id);
    if(!s){ go("log"); return; }
    const st=sessionStats(s);
    const b=this.bewerk;
    head(esc(s.name||"Training"),dLong(s.date),
      `<div style="display:flex;gap:6px">
         <button class="btn sm ghost" type="button" onclick="go('log')">Terug</button>
         <button class="btn sm ${b?"primary":""}" type="button" onclick="Log.togBewerk()">${b?"Klaar":"Bewerk"}</button>
       </div>`);
    V.innerHTML=`
      <div class="tiles">
        <div class="tile"><div class="k">Volume</div><div class="v">${kf(st.vol)}</div><div class="u">kg</div></div>
        <div class="tile"><div class="k">Sets</div><div class="v">${st.sets}</div><div class="u">werksets</div></div>
        <div class="tile"><div class="k">Reps</div><div class="v">${st.reps}</div><div class="u">totaal</div></div>
        <div class="tile"><div class="k">Duur</div><div class="v">${st.dur?hhmm(st.dur):"–"}</div><div class="u">&nbsp;</div></div>
      </div>
      ${(s.hr&&(s.hr.gem||s.hr.max))||s.kcal?`
      <div class="tiles">
        ${s.hr&&s.hr.gem?`<div class="tile"><div class="k">Hartslag</div><div class="v">${s.hr.gem}</div><div class="u">gemiddeld</div></div>`:""}
        ${s.hr&&s.hr.max?`<div class="tile"><div class="k">Piek</div><div class="v">${s.hr.max}</div><div class="u">slagen/min</div></div>`:""}
        ${s.kcal?`<div class="tile"><div class="k">Verbrand</div><div class="v">${s.kcal}</div><div class="u">kcal</div></div>`:""}
      </div>`:""}
      ${Inspanning.kaart(s)}
      ${s.notes?`<div class="card card-pad"><p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">${esc(s.notes)}</p></div>`:""}
      ${s.entries.map((e,i)=>{
        const ex=exById(e.exId)||{name:"?",groep:"?"};
        return `<div class="ex">
          <div class="ex-head"><div class="ex-name"><b>${esc(ex.name)}</b>
            <div class="ex-meta"><span class="chip">${esc(ex.groep)}</span>${e.note?`<span class="prev-hint">${esc(e.note)}</span>`:""}</div></div>
            <button class="ex-more" type="button" onclick="${b?`Log.exMenu('${s.id}',${i})`:`go('oefening','${e.exId}')`}"
              aria-label="${b?"Opties":"Voortgang"}">${b?"⋯":"→"}</button></div>
          <div class="setgrid head"><span>Set</span><span>Reps</span><span>Kg</span><span></span></div>
          ${e.sets.map((x,j)=>{
            const nr=e.sets.slice(0,j+1).filter(y=>y.t!=="warmup").length;
            const kleur=x.t==="warmup"?"warmup":x.t==="drop"?"drop":x.t==="fail"?"fail":"";
            const label=x.t==="warmup"?"W":x.t==="drop"?"D":x.t==="fail"?"F":nr;
            return `<div class="setgrid setrow">
              ${b?`<button class="setno ${kleur}" type="button" onclick="Log.setMenu('${s.id}',${i},${j})">${label}</button>`
                 :`<span class="setno ${kleur}">${label}</span>`}
              ${b?`<input class="inp num" inputmode="numeric" value="${x.r??""}" aria-label="Herhalingen"
                     onchange="Log.zet('${s.id}',${i},${j},'r',this.value)">`
                 :`<span class="num" style="text-align:center;font-size:16px;font-weight:650">${x.r??"–"}</span>`}
              ${b?`<input class="inp num" inputmode="decimal" value="${x.w??""}" aria-label="Gewicht"
                     onchange="Log.zet('${s.id}',${i},${j},'w',this.value)">`
                 :`<span class="num" style="text-align:center;font-size:16px;font-weight:650">${x.w!=null?nf(x.w):"–"}</span>`}
              <span class="num" style="text-align:center;color:var(--ink-3);font-size:11.5px">${x.w&&x.r?Math.round(e1rm(x.w,x.r)):""}</span>
            </div>`;
          }).join("")}
          ${b?`<div class="ex-foot">
                 <button class="btn sm wide" type="button" onclick="Log.addSet('${s.id}',${i})">+ Set</button>
                 <button class="btn sm ghost" type="button" onclick="Log.addSet('${s.id}',${i},'warmup')">+ Opwarm</button>
               </div>`:""}
        </div>`;
      }).join("")}
      ${b?`
        <button class="btn wide" type="button" onclick="Log.addEx('${s.id}')">+ Oefening toevoegen</button>
        <button class="btn ghost wide" type="button" onclick="Log.meta('${s.id}')">Naam, datum en notitie</button>
        <button class="btn danger wide" type="button" onclick="Log.del('${s.id}')">Training verwijderen</button>`
      :`<div class="row">
        <button class="btn ghost wide" type="button" onclick="Train.repeat('${s.id}');go('train')">Herhalen</button>
        <button class="btn danger wide" type="button" onclick="Log.del('${s.id}')">Verwijderen</button>
      </div>`}`;
  },

  /* ---- Bewerken van een opgeslagen training -------------------------------
     Alles schrijft rechtstreeks in de bewaarde training. Bewust géén render()
     na het typen van een getal: dat zou de focus uit het veld gooien terwijl
     je nog van gewicht naar herhalingen springt.                            */
  bewerk:false,
  togBewerk(){ this.bewerk=!this.bewerk; render(); },
  vind(id){ return DB.d.sessions.find(x=>x.id===id); },

  zet(id,i,j,veld,waarde){
    const s=this.vind(id); if(!s) return;
    const set=s.entries[i].sets[j];
    const v=String(waarde).replace(",",".").trim();
    set[veld]= v==="" ? null : (veld==="r" ? (parseInt(v,10)||null) : (parseFloat(v)||null));
    DB.save();
  },
  setMenu(id,i,j){
    const set=this.vind(id).entries[i].sets[j];
    const opt=[["work","Werkset"],["warmup","Opwarmset"],["drop","Dropset"],["fail","Tot falen"]];
    Sheet.open("Set aanpassen",`
      <div class="seg">${opt.map(([k,l])=>
        `<button type="button" class="${set.t===k?"on":""}" onclick="Log.setType('${id}',${i},${j},'${k}')">${l}</button>`).join("")}</div>
      <button class="btn danger wide" type="button" onclick="Log.delSet('${id}',${i},${j})">Set verwijderen</button>`);
  },
  setType(id,i,j,t){ this.vind(id).entries[i].sets[j].t=t; DB.save(); Sheet.close(); render(); },
  delSet(id,i,j){
    const s=this.vind(id);
    s.entries[i].sets.splice(j,1);
    if(!s.entries[i].sets.length) s.entries.splice(i,1);
    DB.save(); Sheet.close(); render(); toast("Set verwijderd");
  },
  addSet(id,i,type){
    const e=this.vind(id).entries[i];
    const laatste=e.sets[e.sets.length-1];
    e.sets.push({w:type==="warmup"?null:(laatste?laatste.w:null),
                 r:type==="warmup"?null:(laatste?laatste.r:null),
                 rpe:null,t:type||"work",done:true});
    DB.save(); render();
  },
  exMenu(id,i){
    const e=this.vind(id).entries[i];
    Sheet.open(exName(e.exId),`
      <div class="row">
        <button class="btn ghost wide" type="button" onclick="Log.move('${id}',${i},-1)">↑ Omhoog</button>
        <button class="btn ghost wide" type="button" onclick="Log.move('${id}',${i},1)">↓ Omlaag</button>
      </div>
      <button class="btn wide" type="button" onclick="Sheet.close();go('oefening','${e.exId}')">Voortgang bekijken</button>
      <button class="btn danger wide" type="button" onclick="Log.delEx('${id}',${i})">Oefening verwijderen</button>`);
  },
  move(id,i,d){
    const a=this.vind(id).entries, j=i+d;
    if(j<0||j>=a.length) return;
    [a[i],a[j]]=[a[j],a[i]]; DB.save(); Sheet.close(); render();
  },
  delEx(id,i){ this.vind(id).entries.splice(i,1); DB.save(); Sheet.close(); render(); toast("Oefening verwijderd"); },
  addEx(id){
    ExPicker.open(exId=>{
      this.vind(id).entries.push({exId,note:"",rest:null,
        sets:[{w:null,r:null,rpe:null,t:"work",done:true}]});
      DB.save(); Sheet.close(); render();
    });
  },
  meta(id){
    const s=this.vind(id);
    Sheet.open("Training aanpassen",`
      <div class="field"><label>Naam</label>
        <input class="ctrl" id="mNaam" value="${esc(s.name||"")}"></div>
      <div class="field"><label>Datum</label>
        <input class="ctrl" id="mDat" type="date" value="${s.date}"></div>
      <div class="field"><label>Notitie</label>
        <textarea class="ctrl" id="mNote" style="min-height:80px">${esc(s.notes||"")}</textarea></div>
      <button class="btn primary wide" type="button" onclick="Log.metaSave('${id}')">Opslaan</button>`);
  },
  metaSave(id){
    const s=this.vind(id);
    s.name=$("#mNaam").value.trim()||"Training";
    s.date=$("#mDat").value||s.date;
    s.notes=$("#mNote").value.trim();
    DB.save(); Sheet.close(); render(); toast("Opgeslagen");
  },
  async del(id){
    if(await ask("Training verwijderen?","Dit kan niet ongedaan worden gemaakt.","Verwijderen",true)){
      DB.d.sessions=DB.d.sessions.filter(x=>x.id!==id); DB.save(); go("log"); toast("Verwijderd");
    }
  }
};

/* ============================================================================
   TIPS — regelgebaseerde analyse van je eigen data
   ============================================================================ */
const Tips={
  render(V){
    head("Tips","Gebaseerd op wat je hebt gelogd");
    const ss=DB.d.sessions;
    if(ss.length<3){
      V.innerHTML=`<div class="card"><div class="empty"><div class="big">Nog te weinig data</div>
        <p>Log een stuk of drie trainingen — daarna kan ik patronen zien: stilstand, onbalans, te snelle opbouw.</p></div></div>`;
      return;
    }
    const tips=this.analyse();
    V.innerHTML= tips.length
      ? `<div class="card">${tips.map(t=>`
          <div class="tip">
            <div class="tip-bar ${t.k}"></div>
            <div class="tip-main">
              <div class="tip-top"><span class="chip ${t.k}">${t.label}</span></div>
              <b>${esc(t.titel)}</b><p>${t.tekst}</p>
              ${t.doe?`<div class="do">${t.doe}</div>`:""}
            </div>
          </div>`).join("")}</div>
          <p class="mut" style="padding:0 4px">Dit zijn signalen uit je eigen cijfers, geen medisch advies. Jij weet hoe je lichaam voelt — dat weegt zwaarder.</p>`
      : `<div class="card"><div class="empty"><div class="big">Niets op te merken</div>
         <p>Je opbouw is netjes, je balans klopt en je gaat vooruit. Doorgaan zo.</p></div></div>`;
  },

  /* Het herhalingsaantal dat je bij deze oefening het vaakst draait */
  vaakstReps(h){
    const tel={};
    h.slice(-8).forEach(d=>d.sets.forEach(s=>{ if(s.r) tel[s.r]=(tel[s.r]||0)+1; }));
    const e=Object.entries(tel).sort((a,b)=>b[1]-a[1])[0];
    return e?+e[0]:8;
  },

  analyse(){
    const T=[];
    const ss=allSessions();
    const add=(k,label,titel,tekst,doe,prio)=>T.push({k,label,titel,tekst,doe,prio});

    /* --- 1. Stilstand per oefening --- */
    const tel={};
    for(const s of DB.d.sessions) for(const e of s.entries){
      const n=e.sets.filter(isWork).length; if(n) tel[e.exId]=(tel[e.exId]||0)+n;
    }
    const belangrijk=Object.entries(tel).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
    const stil=[]; let groeit=0;
    for(const id of belangrijk){
      const h=historyFor(id);
      if(h.length<6) continue;
      if(daysAgo(h[h.length-1].date)>28) continue;        // oefening doe je niet meer
      const e=h.map(d=>({d:d.date,v:bestOf(d.sets).e1})).filter(x=>x.v>0);
      if(e.length<6) continue;
      const nu=e.slice(-3), eerder=e.slice(-8,-3);
      if(eerder.length<2) continue;
      if(daysAgo(eerder[0].d)<28) continue;               // te kort om iets van te vinden
      const vNu=Math.max(...nu.map(x=>x.v)), vEerder=Math.max(...eerder.map(x=>x.v));
      const piek=Math.max(...e.map(x=>x.v));
      const piekDatum=e.filter(x=>x.v>=piek*0.9995)[0].d;

      // Meten doen we met het geschatte 1RM (dat vergelijkt 80×8 eerlijk met 90×5),
      // maar we vertéllen het in de sets die hij echt heeft gedaan.
      const zwaarste=r=>{ let b={w:0,r:0};
        for(const d of h){ if(r && d.date<r) continue;
          for(const s of d.sets) if((s.w||0)>b.w) b={w:s.w,r:s.r}; }
        return b; };
      if(vNu>vEerder*1.02){
        const nu3=zwaarste(nu[0].d);
        if(groeit++<2) add("good","Groeit",`${exName(id)} loopt goed`,
          `Je zwaarste set is nu <b class="num">${setTekst(nu3.w,nu3.r,true)}</b>, en je gaat er nog steeds op vooruit.`,
          `Blijf op dit spoor. Voeg volgende keer 2,5 kg toe óf één herhaling per set — niet allebei tegelijk.`,1);
      } else if(vNu<=vEerder*1.005){
        stil.push({id,zwaarst:zwaarste(),wkn:Math.max(1,Math.round(daysAgo(piekDatum)/7)),
                   reps:this.vaakstReps(h)});
      }
    }
    stil.sort((a,b)=>b.wkn-a.wkn);
    for(const s of stil.slice(0,2)){
      const laag = s.reps>=8;
      add("bad","Stilstand",`${exName(s.id)} staat stil`,
        `Je zwaarste set blijft <b class="num">${setTekst(s.zwaarst.w,s.zwaarst.r,true)}</b>, en daar sta je nu <b class="num">${s.wkn}</b> weken. De laatste sessies kom je daar niet meer boven.`,
        `Verander één ding tegelijk, niet alles: ${laag?`ga van ${s.reps} herhalingen naar 4–6 zware`:`ga van ${s.reps} herhalingen naar 8–12 met minder gewicht`}, óf zet er één werkset per training bij, óf neem eerst een rustige week. Geef elke aanpassing drie weken voordat je oordeelt.`,3);
    }
    if(stil.length>2)
      add("warn","Stilstand","Meer oefeningen zitten vast",
        `Ook <b>${stil.slice(2).map(s=>exName(s.id)).join(", ")}</b> gaan al weken niet meer vooruit.`,
        `Als bijna alles tegelijk stilstaat, ligt het zelden aan je schema. Kijk eerst naar slaap, eten en of je een rustweek overslaat.`,3);

    /* --- 2. Duwen / trekken balans --- */
    const cat=setsPerCat(28);
    const push=cat.push||0, pull=cat.pull||0;
    if(push+pull>=20){
      const r=push/Math.max(1,pull);
      if(r>1.35) add("warn","Onbalans","Je duwt veel meer dan je trekt",
        `Afgelopen 4 weken: <b class="num">${push}</b> duw-sets tegen <b class="num">${pull}</b> trek-sets. Dat trekt je schouders naar voren en vergroot de kans op schouderklachten.`,
        `Zet er per week 3–4 trek-sets bij: face pulls, rows of rear delt flys.`,3);
      else if(r<0.7) add("warn","Onbalans","Je trekt veel meer dan je duwt",
        `Afgelopen 4 weken: <b class="num">${pull}</b> trek-sets tegen <b class="num">${push}</b> duw-sets.`,
        `Voeg een duw-oefening toe, of een extra set bij je bench of shoulder press.`,2);
    }

    /* --- 3. Quads vs hamstrings --- */
    const g28=setsPerGroup(28);
    const q=g28["Quadriceps"]||0, ham=(g28["Hamstrings"]||0)+(g28["Bilspieren"]||0);
    if(q+ham>=12){
      if(q/Math.max(1,ham)>2.0) add("warn","Onbalans","Weinig hamstrings en bilspieren",
        `<b class="num">${q}</b> quad-sets tegen <b class="num">${ham}</b> voor je achterkant. Een scheve verhouding hier is een klassieke bron van kniepijn en hamstringblessures.`,
        `Twee sets romanian deadlift of leg curl per beentraining maakt dit al recht.`,3);
    }

    /* --- 4. Verwaarloosde spiergroepen --- */
    const g14=setsPerGroup(14);
    const actief=DB.d.sessions.filter(s=>daysAgo(s.date)<14).length;
    if(actief>=3){
      const vergeten=["Rug","Borst","Schouders","Quadriceps","Hamstrings","Core"].filter(g=>(g14[g]||0)<3);
      if(vergeten.length) add("warn","Gat","Deze spiergroepen bleven liggen",
        `De afgelopen 2 weken deed je minder dan 3 werksets voor: <b>${vergeten.join(", ")}</b>.`,
        `Plan er per groep één oefening bij, of check of je schema wel alles dekt.`,2);
    }

    /* --- 5. Volumesprong (blessurerisico) --- */
    const wk=k=>DB.d.sessions.filter(s=>weekKey(s.date)===k).reduce((a,s)=>a+sessionStats(s).sets,0);
    const dezeW=wk(weekKey(today())), vorigeW=wk(weekKey(addDays(today(),-7)));
    if(vorigeW>=10 && dezeW>vorigeW*1.35)
      add("bad","Risico","Je bouwt snel op",
        `Deze week <b class="num">${dezeW}</b> werksets tegen <b class="num">${vorigeW}</b> vorige week — een sprong van ${Math.round((dezeW/vorigeW-1)*100)}%.`,
        `Grote sprongen in volume zijn de meest voorspelbare weg naar een blessure. Houd de groei onder ~10% per week.`,4);

    /* --- 6. Deload: al weken achtereen op volle kracht, zonder lichte week --- */
    const wkn=[1,2,3,4,5,6].map(i=>wk(weekKey(addDays(today(),-i*7)))).filter(v=>v>0);
    if(wkn.length>=5){
      const top=Math.max(...wkn), laag=Math.min(...wkn);
      if(laag>=top*0.7)
        add("warn","Herstel","Tijd voor een rustige week",
          `Je draait al <b class="num">${wkn.length}</b> weken op rij tussen de <b class="num">${laag}</b> en <b class="num">${top}</b> werksets, zonder één week terug te schakelen.`,
          `Doe één week met ongeveer 60% van je normale sets en blijf drie herhalingen van falen af. Je komt er sterker uit — juist na zo'n week vallen de records.`,3);
    }

    /* --- 7. Frequentie gedaald --- */
    const f4=DB.d.sessions.filter(s=>daysAgo(s.date)<28).length;
    const f8=DB.d.sessions.filter(s=>daysAgo(s.date)>=28&&daysAgo(s.date)<56).length;
    if(f8>=6 && f4<f8*0.65)
      add("warn","Frequentie","Je traint minder dan eerder",
        `<b class="num">${f4}</b> trainingen in de laatste 4 weken, tegen <b class="num">${f8}</b> in de 4 weken daarvoor.`,
        `Als dat bewust is: prima. Zo niet, plan je trainingen als afspraken in je agenda — dat werkt beter dan losse voornemens.`,2);

    /* --- 8. Rep-bereik vastgeroest --- */
    const vast=[];
    for(const id of belangrijk.slice(0,6)){
      const h=historyFor(id); if(h.length<8) continue;
      const reps=[]; h.slice(-8).forEach(d=>d.sets.forEach(s=>{ if(s.r) reps.push(s.r); }));
      if(reps.length<12) continue;
      if(Math.max(...reps)-Math.min(...reps)<=2) vast.push(exName(id));
    }
    if(vast.length>=3)
      add("acc","Variatie","Je draait altijd hetzelfde aantal herhalingen",
        `Bij <b>${vast.slice(0,4).join(", ")}</b>${vast.length>4?" en nog "+(vast.length-4):""} zaten je laatste 8 sessies telkens in vrijwel hetzelfde bereik.`,
        `Je lichaam went aan een prikkel die niet verandert. Draai eens zes weken 4–6 zware herhalingen, of juist 12–15 lichtere. Dat is vaak genoeg om een plateau te doorbreken.`,2);
    else vast.forEach(n=>add("acc","Variatie",`${n} zit altijd in hetzelfde bereik`,
        `Je laatste 8 sessies zaten allemaal binnen 2 herhalingen van elkaar.`,
        `Wissel eens een blok van 4–6 zware herhalingen af met 12–15 lichtere. Andere prikkel, nieuwe groei.`,1));

    const recent=DB.d.sessions.filter(s=>daysAgo(s.date)<28);

    /* --- 10. Lange sessies --- */
    const lang=recent.filter(s=>{ const d=sessionStats(s).dur; return d>6600; });
    if(lang.length>=3)
      add("acc","Duur","Je trainingen duren lang",
        `${lang.length} van je laatste ${recent.length} trainingen duurden meer dan anderhalf uur.`,
        `Na ~75 minuten zakt de kwaliteit van je sets meestal. Splits liever in twee kortere trainingen dan één lange.`,1);

    /* --- 11. Lichaamsgewicht --- */
    const w=DB.d.weights.slice().sort((a,b)=>a.date<b.date?-1:1).filter(x=>daysAgo(x.date)<60);
    if(w.length>=4){
      const d=w[w.length-1].kg-w[0].kg, wkn2=Math.max(1,(dParse(w[w.length-1].date)-dParse(w[0].date))/6048e5);
      const perWk=d/wkn2;
      if(Math.abs(perWk)>0.7) add("warn","Gewicht",perWk>0?"Je komt snel aan":"Je valt snel af",
        `<b class="num">${perWk>0?"+":""}${nf(Math.round(perWk*100)/100)} kg per week</b> over de laatste ${Math.round(wkn2)} weken.`,
        perWk>0?`Meer dan ~0,4 kg per week is meestal vooral vet. Temper je overschot iets als spiergroei het doel is.`
               :`Meer dan ~0,7 kg per week eraf kost je kracht en spiermassa. Eet iets meer en houd je zware sets vast.`,2);
    }

    /* --- 12. Back-up --- */
    const lb=S().lastBackup;
    if(DB.d.sessions.length>=8 && (!lb || daysAgo(lb)>30))
      add("bad","Back-up","Maak een reservekopie",
        `Je data staat alleen in de browser van deze telefoon. ${lb?`Je laatste back-up was ${relDate(lb)}.`:"Je hebt nog nooit geëxporteerd."} Browsergeheugen wordt soms opgeruimd — dan is een jaar loggen weg.`,
        `Ga naar Meer → Exporteren en bewaar het bestand. Kost tien seconden.`,4);

    return T.sort((a,b)=>b.prio-a.prio);
  }
};

          <div class="chev"></div></button>`).join("")+`</div>`

    Sheet.open("Schema",`
      <div class="field"><label>Naam</label>
        <input class="ctrl" id="rName" value="${esc(r.name)}" placeholder="bijv. Push A" onchange="Meer.rSetName('${id}',this.value)"></div>

        `<div class="li"><div class="li-main"><b>${esc(exName(it.exId))}</b>
           <span>${it.sets} sets · rust ${it.rest||S().rest}s</span></div>

  rSetName(id,v){ const r=DB.d.routines.find(x=>x.id===id); r.name=v.trim()||"Naamloos"; DB.save(); },
  rAdd(id){ ExPicker.open(exId=>{

      r.items.push({exId,sets:3,rest:null}); DB.save(); this.routineEdit(id);
    }); },
  rSets(id,i,d){ const r=DB.d.routines.find(x=>x.id===id);
    r.items[i].sets=clamp(r.items[i].sets+d,1,12); DB.save(); this.routineEdit(id); },
  rDel(id,i){ const r=DB.d.routines.find(x=>x.id===id); r.items.splice(i,1); DB.save(); this.routineEdit(id); },
  async rRemove(id){
    if(await ask("Schema verwijderen?","Je gelogde trainingen blijven gewoon staan.","Verwijderen",true)){
      DB.d.routines=DB.d.routines.filter(x=>x.id!==id); DB.save(); Sheet.close(); render();

  rStart(id){ const r=DB.d.routines.find(x=>x.id===id);
    if(!r.name) r.name="Training";
    if(!r.items.length) return toast("Voeg eerst oefeningen toe");
    Sheet.close(); Train.start(id); go("train"); },

  stravaLees(){

          <tbody>${k.raak.slice(0,14).map(({sess,act})=>`

              <td class="n">${act.dur?hhmm(act.dur):"–"}</td>

        <button class="btn primary lg wide" type="button" onclick="Meer.stravaZet()">Toevoegen aan mijn trainingen</button>
        <p class="mut">Alleen hartslag, calorieën en duur worden aangevuld. Je sets en gewichten blijven zoals ze zijn.</p>`
      :`<div class="warnbox">Geen enkele activiteit viel op dezelfde dag als een training in je logboek. Klopt het jaartal in je bestand?</div>`}`;

  stravaZet(){
    const k=Meer._strava; if(!k) return;
    let n=0;
    for(const {sess,act} of k.raak){
      let iets=false;
      if(act.hrGem||act.hrMax){ sess.hr={gem:act.hrGem||null,max:act.hrMax||null}; iets=true; }
      if(act.kcal){ sess.kcal=act.kcal; iets=true; }
      if(act.effort!=null){ sess.effort=act.effort; iets=true; }
      if(act.dur && !(sess.start&&sess.end)){
        sess.end=dParse(sess.date).getTime(); sess.start=sess.end-act.dur*1000; iets=true;
      }
      if(iets) n++;
    }
    DB.save(); Sheet.close(); go("log");
    toast(`${n} trainingen aangevuld`);
  },

    Sheet.open("Apple Watch koppelen",`
      <button class="btn wide" type="button" onclick="Meer.strava()">Ik gebruik Strava — lees dat in</button>
      <div class="hr"></div>`+`
      <p class="mut" style="font-size:14.5px;color:var(--ink-2)">
        Apple laat geen enkele website bij je gezondheidsgegevens, dus je horloge kan niet
        rechtstreeks met deze app praten. De Opdrachten-app op je iPhone mág daar wél bij.
        Die haalt de cijfers op en zet ze op je klembord; jij plakt ze hier in.</p>

      <div class="sec-label">Tijdens je training</div>
      <p class="mut" style="font-size:14.5px;color:var(--ink-2)">
        Start op je horloge een workout <b>Krachttraining</b>. Zonder die workout meet je
        Apple Watch je hartslag maar af en toe, en dan klopt het gemiddelde niet.</p>

      <div class="sec-label">De opdracht eenmalig maken</div>
      <ol style="font-size:14.5px;line-height:1.65;color:var(--ink-2);padding-left:20px;list-style:decimal">
        <li>Open de app <b>Opdrachten</b> en tik op <b>+</b>.</li>
        <li>Voeg toe: <b>Zoek gezondheidsmonsters</b>. Zet Type op <b>Hartslag</b>,
            sorteer op <b>Startdatum</b>, en beperk tot <b>vandaag</b>.</li>
        <li>Voeg toe: <b>Bereken statistiek</b> → <b>Gemiddelde</b> over die monsters.
            Bewaar die in een variabele.</li>
        <li>Herhaal stap 2 en 3, maar kies nu <b>Maximum</b>.</li>
        <li>Voeg toe: <b>Zoek gezondheidsmonsters</b> met Type <b>Actieve energie</b>,
            en daarna <b>Bereken statistiek</b> → <b>Som</b>.</li>
        <li>Voeg als laatste <b>Kopieer naar klembord</b> toe met deze tekst erin,
            waarbij je de drie variabelen invoegt:</li>
      </ol>
      <div class="notebox" style="font-family:var(--mono);font-size:12px;line-height:1.6">
        Gemiddeld: [gemiddelde]<br>Max: [maximum]<br>[energie] kcal
      </div>
      <p class="mut">Geef de opdracht een naam als <b>Training klaar</b>. Je kunt hem op je
        beginscherm zetten, of tegen Siri zeggen.</p>

      <div class="sec-label">Na je training</div>
      <p class="mut" style="font-size:14.5px;color:var(--ink-2)">
        Tik de opdracht aan, ga in Rep King naar <b>Klaar</b> en plak in het vakje onder
        &bdquo;Van je Apple Watch&rdquo;. De velden vullen zichzelf. Het maakt niet uit in welke
        volgorde of met welke woorden de cijfers erin staan — ik zoek ze er zelf uit.</p>

      <div class="hr"></div>
      <p class="mut">Liever met de hand? Ook prima: dezelfde drie velden staan er gewoon,
        je kunt ze rechtstreeks invullen vanaf je horloge.</p>`);
  },

  async wipe(){
    if(await ask("Alles wissen?","Al je trainingen, oefeningen en instellingen verdwijnen. Exporteer eerst als je twijfelt.","Alles wissen",true)){
      try{ localStorage.removeItem(KEY); }catch(e){}
      DB.d=DB.fresh(); DB.save(); Sheet.close(); go("train"); toast("Leeg");
    }
  },
