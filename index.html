<title>REP KING FORGED</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RK FORGED">
<meta name="theme-color" content="#111318">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
/* ============================================================
   TOKENS — alle kleuren staan hier. Licht is de basis,
   donker herdefinieert alleen de tokens (3 states: systeem,
   expliciet licht, expliciet donker).
   ============================================================ */
:root{
  /* REP KING FORGED — één palet, altijd donker. De lichte modus is eruit:
     Forged Turquoise haalt op wit 1,8 op 1 aan contrast en is daar onleesbaar,
     en de lichte modus werd nooit gebruikt.
     Almost Black #111318 · Dark Steel #252A30 · Steel Grey #858A91
     Forged Turquoise #2DD4BF · White #FFFFFF                                   */
  --ground:#111318; --surface:#171A20; --surface-2:#1C2027; --surface-3:#252A30;
  --line:#252A30; --line-strong:#3A4049;
  --ink:#FFFFFF; --ink-2:#B9BEC5; --ink-3:#858A91;
  --accent:#2DD4BF; --accent-ink:#111318; --accent-soft:#123029; --accent-line:#2A6A62;
  /* Bewust groen en niet turquoise: in de gestapelde weekgrafiek staan
     Duwen (accent) en Trekken (good) naast elkaar. Met turquoise als accent
     moet good gewoon groen zijn, anders lopen die twee in elkaar over. */
  --good:#8FD96B; --good-soft:#1B2A16;
  --good-ink:#06231C;                /* donkere tekst óp een groen vlak */
  --warn:#E3B341; --warn-soft:#332913;
  --bad:#F0685B;  --bad-soft:#3A1B18;
  /* Een persoonlijk record is geen "goed", het is iets zeldzamers. Daarom
     goud en niet het groen dat ook een afgevinkte set markeert. */
  --pr:#D6B56D;   --pr-soft:#2E2718;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.45);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:14px; --r-sm:9px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
/* ---- Openingsscherm ---------------------------------------
   De letters zijn zo zwaar mogelijk gezet met wat op een iPhone
   beschikbaar is; Arial Black staat er niet op, dus we vragen om
   het zwaarste gewicht dat het systeemlettertype kan.          */
#splash{
  position:fixed; inset:0; z-index:300; background:var(--ground);
  display:grid; place-items:center; text-align:center;
  transition:opacity .45s ease; padding:0 24px;
}
#splash.weg{opacity:0; pointer-events:none}
.sp-mark{
  font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:900; font-size:78px; line-height:1; letter-spacing:-.02em;
  color:#FFFFFF;
}
.sp-bar{
  height:12px; background:var(--accent); border-radius:2px;
  margin:9px auto 0; width:118px;
}
.sp-naam{
  margin-top:30px; font-size:19px; font-weight:800; letter-spacing:.1em; color:var(--ink);
}
.sp-slogan{
  margin-top:9px; font-size:12px; font-weight:700; letter-spacing:.26em; color:var(--accent);
}
.sp-sub{
  margin-top:7px; font-size:10px; letter-spacing:.2em; color:var(--ink-3);
}

/* ============================================================
   BASIS
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.45;
  overflow:hidden; overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* App-schil: de pagina zelf scrollt niet, alleen het middenstuk. Zo kan de
   tabbalk onderin niet losraken — een bekend probleem met vastgezette balken
   in schermvullende modus op iOS. */
html,body{height:100%}
#app{position:fixed;inset:0;max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--ground)}

/* Koptekst */
.topbar{
  flex:none;z-index:40;background:var(--ground);
  padding:calc(var(--safe-t) + 14px) 16px 10px;
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.topbar.stuck{border-bottom-color:var(--line)}
.topbar-row{display:flex;align-items:center;gap:10px;min-height:34px}
.title{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;flex:1;text-wrap:balance}
.sub{font-size:13px;color:var(--ink-3);margin-top:2px}

/* Geen -webkit-overflow-scrolling:touch: op iOS is dat sinds jaren standaard, en in
   combinatie met een vaste schil maakt het elementen soms onaanraakbaar. */
main{flex:1;min-height:0;overflow-y:auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:14px}
/* Kinderen van een scrollende flex-kolom mogen NIET krimpen. Zonder deze regel
   drukt de browser lange lijsten plat tot een streepje zodra de inhoud niet
   past — en met overflow:hidden erop verdwijnt de inhoud dan helemaal. */
main > *{flex:0 0 auto}

/* Kaarten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.card-pad{padding:14px}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-title{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);flex:1}

/* Knoppen */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 16px;border-radius:11px;
  background:var(--surface-3);color:var(--ink);font-weight:650;font-size:15px;
  border:1px solid transparent;transition:transform .06s, filter .15s;
}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.btn.lg{min-height:56px;font-size:17px;border-radius:13px;font-weight:750;letter-spacing:-.01em}
.btn.sm{min-height:34px;padding:0 11px;font-size:13.5px;border-radius:9px;font-weight:600}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:9px}
.row.wrap{flex-wrap:wrap}

/* Chips */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:var(--surface-3);color:var(--ink-2);white-space:nowrap;
}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.pr{background:var(--pr-soft);color:var(--pr)}

/* Statistiek-tegels */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.tile{background:var(--surface);padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-size:21px;font-weight:750;letter-spacing:-.03em;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tile .u{font-size:11px;color:var(--ink-3);font-weight:600}

/* Lege staat */
.empty{text-align:center;padding:34px 20px;color:var(--ink-3)}
.empty .big{font-size:17px;font-weight:700;color:var(--ink-2);margin-bottom:6px;letter-spacing:-.01em}
.empty p{font-size:14px;line-height:1.5;max-width:34ch;margin:0 auto}

/* ============================================================
   TABBALK
   ============================================================ */
.tabbar{
  flex:none;position:relative;z-index:61;background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
.tabbar-inner{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;color:var(--ink-3);font-size:10.5px;font-weight:650;letter-spacing:.01em}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.on svg{stroke-width:2.1}

/* ============================================================
   TRAINING — setrijen als logboek
   ============================================================ */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-1)}
.ex-head{display:flex;align-items:flex-start;gap:8px;padding:12px 13px 10px;border-bottom:2px solid var(--line-strong)}
.ex-name{flex:1;min-width:0}
.ex-name b{display:block;font-size:16.5px;font-weight:750;letter-spacing:-.02em;line-height:1.25}
.ex-meta{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ex-more{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink-3);flex:none}
.ex-more:active{background:var(--surface-3)}

.setgrid{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 46px;gap:7px;align-items:center;padding:7px 13px}
.setgrid.cardio{grid-template-columns:30px repeat(3,minmax(0,1fr)) 46px}
.setgrid.head{padding-top:8px;padding-bottom:4px}
.setgrid.head span{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.setgrid.head span:first-child{text-align:left}
/* In het logboek staat achter Kg niets meer: daar stond een geschat 1RM, en
   dat getal wilde hij nergens zien. Drie kolommen dus, geen lege vierde. */
.setgrid.drie{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr)}
.setrow{border-bottom:1px solid var(--line)}
.setrow:last-of-type{border-bottom:0}
.setrow.done{background:var(--surface-2)}
.setno{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-size:12.5px;font-weight:750;background:var(--surface-3);color:var(--ink-2);
  font-family:var(--mono);
}
.setno.warmup{background:var(--warn-soft);color:var(--warn)}
.setno.drop{background:var(--accent-soft);color:var(--accent)}
.setno.fail{background:var(--bad-soft);color:var(--bad)}
/* Bij het apparaat wil je geen toetsenbord. Met − en + naast het veld pas je
   het gewicht en de herhalingen aan zonder te typen; tikken op het getal zelf
   opent nog gewoon het cijferklavier. */
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;background:var(--surface-2);min-height:46px}
.step button{width:34px;flex:none;font-size:19px;font-weight:700;color:var(--ink-2);
  background:var(--surface-3);line-height:1}
.step button:active{background:var(--accent-soft);color:var(--accent)}
.step input{flex:1;min-width:0;border:0;background:transparent;text-align:center;
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:650;
  letter-spacing:-.02em;padding:0}
.step input:focus{outline:none;background:var(--surface)}
.step input::placeholder{color:var(--ink-3);font-weight:500;opacity:.65}
.inp{
  width:100%;min-height:42px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:10px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:17px;font-weight:650;letter-spacing:-.02em;padding:0 2px;
}
.inp::placeholder{color:var(--ink-3);font-weight:500;opacity:.65}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.rpe{font-size:15px}
/* Gewichtsveld met een knop voor eigen lichaamsgewicht: bij dips en pull-ups
   is een leeg veld dubbelzinnig — "BW" zegt precies wat je bedoelde. */
.wcel{display:flex;gap:4px;min-width:0}
.wcel .inp{flex:1;min-width:0}
.bwknop{width:38px;flex:none;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-3);font-size:12px;font-weight:750;letter-spacing:.03em}
.bwknop.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tick{
  width:46px;height:46px;border-radius:10px;display:grid;place-items:center;
  background:var(--surface-3);color:var(--ink-3);border:1px solid transparent;
}
.tick svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tick.on{background:var(--good);color:var(--good-ink);border-color:transparent}
.ex-foot{display:flex;gap:8px;padding:9px 13px 12px;border-top:1px solid var(--line)}
.prev-hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

/* Rusttimer-balk */
/* ============================================================
   LIJSTEN
   ============================================================ */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-1)}
.li{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li:active{background:var(--surface-2)}
.li-main{flex:1;min-width:0}
.li-main b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-main span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.li-right{text-align:right;flex:none;font-size:12.5px;color:var(--ink-3)}
.chev{width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);flex:none;opacity:.7}
.sec-label{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:4px 2px 0}

/* ============================================================
   BOTTOM SHEET
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(6,9,14,.55);z-index:100;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;max-width:600px;margin:0 auto;
  background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow-2);
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  max-height:88vh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);
}
.sheet.on{transform:translateY(0)}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;flex:none}
.sheet-head h2{font-size:19px;font-weight:750;letter-spacing:-.02em;flex:1}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
/* Zonder dit krimpen lange lijsten in een sheet tot platte balkjes: een
   scrollende flexkolom perst zijn kinderen samen, en `.list` heeft
   overflow:hidden, dus dan verdwijnt de tekst. Dezelfde fout zat ooit in
   main#view — zie `main > *` hierboven. */
.sheet-body > *{flex:0 0 auto}
.x{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);font-size:17px;flex:none;line-height:1}

/* Formulier */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ctrl{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:0 12px;font-size:16px}
.ctrl:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.ctrl{padding:11px 12px;min-height:110px;resize:vertical;line-height:1.5;font-family:var(--mono);font-size:13px}
select.ctrl{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:13.5px;font-weight:650;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
/* Meerkeuze: tik zoveel knopjes aan als je wilt. De eerste die je kiest is de
   hoofdgroep — die staat op het label en bepaalt de volgorde in lijsten. */
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi button{
  min-height:36px;padding:0 12px;border-radius:999px;font-size:13.5px;font-weight:650;
  background:var(--surface-3);color:var(--ink-2);border:1px solid transparent;
}
.multi button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.multi button.eerste::after{content:"·1";font-size:10.5px;opacity:.7;margin-left:4px}
.switch{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch .sw-main{flex:1}
.switch b{display:block;font-size:15px;font-weight:600}
.switch span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px;line-height:1.4}
.toggle{width:50px;height:30px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .2s;flex:none}
.toggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;background:#fff;box-shadow:var(--shadow-1);transition:transform .2s}
.toggle.on{background:var(--good)}
.toggle.on i{transform:translateX(20px)}

/* Zoeken */
.search{position:relative}
.search input{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:0 12px 0 38px;font-size:16px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2}

/* ============================================================
   GRAFIEKEN
   ============================================================ */
.chartwrap{position:relative;width:100%;height:190px}
canvas{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:9px 14px;padding:10px 14px 12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend span{font-size:11.5px;color:var(--ink-2);font-weight:600}

/* Kalender-heatmap */

/* Tips */
.tip{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip-bar{width:3px;border-radius:99px;flex:none;background:var(--ink-3)}
.tip-bar.good{background:var(--good)} .tip-bar.warn{background:var(--warn)} .tip-bar.bad{background:var(--bad)}
.tip-main{flex:1;min-width:0}
.tip-main b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.015em;margin-bottom:3px;text-wrap:balance}
.tip-main p{font-size:14px;color:var(--ink-2);line-height:1.5}
.tip-main .do{font-size:13.5px;color:var(--ink);margin-top:7px;padding:8px 10px;background:var(--surface-2);border-radius:9px;border-left:2px solid var(--accent)}
.tip-top{display:flex;align-items:center;gap:7px;margin-bottom:4px}


/* ============================================================
   BODYWORKOUT — stopwatch, intervaltimer en rondes
   ============================================================ */
.klokkaart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-1);overflow:hidden}
.klokrij{display:flex;align-items:center;gap:12px;padding:16px 16px 14px}
.klokrij .tijd{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:40px;
  font-weight:750;letter-spacing:-.05em;line-height:1;flex:1}
.intervalbalk{padding:12px 16px;display:flex;align-items:center;gap:12px;
  border-top:1px solid var(--line);background:var(--surface-2)}
.intervalbalk.werk{background:var(--accent);color:var(--accent-ink)}
.intervalbalk.rust{background:var(--good);color:var(--good-ink)}
.intervalbalk .t{font-family:var(--mono);font-variant-numeric:tabular-nums;

<script>
"use strict";
/* ============================================================================
   REP KING FORGED — REFORGE YOURSELF.
   Alles zit in dit ene bestand. Data staat lokaal op je telefoon.
   ============================================================================ */

/* ---------- 1. Hulpjes ------------------------------------------------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const MND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MNDL=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const DAG=["zo","ma","di","wo","do","vr","za"];

const today = () => new Date().toISOString().slice(0,10);
const dParse = s => { const d=new Date(s+"T12:00:00"); return isNaN(d)?new Date():d; };
const dShort = s => { const d=dParse(s); return `${DAG[d.getDay()]} ${d.getDate()} ${MND[d.getMonth()]}`; };
const dLong  = s => { const d=dParse(s); return `${DAG[d.getDay()]} ${d.getDate()} ${MNDL[d.getMonth()]} ${d.getFullYear()}`; };
const daysAgo = s => Math.round((dParse(today())-dParse(s))/864e5);
const addDays = (s,n)=>{ const d=dParse(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function relDate(s){
  const n=daysAgo(s);
  if(n===0) return "vandaag"; if(n===1) return "gisteren";
  if(n<7) return n+" dagen geleden";
  if(n<14) return "vorige week";
  if(n<60) return Math.round(n/7)+" weken geleden";
  return Math.round(n/30)+" maanden geleden";
}
function mmss(sec){ const m=Math.floor(Math.abs(sec)/60), s=Math.abs(sec)%60; return (sec<0?"-":"")+m+":"+String(s).padStart(2,"0"); }
function hhmm(sec){ const h=Math.floor(sec/3600), m=Math.round(sec%3600/60); return h?`${h}u ${m}m`:`${m}m`; }
const nf = n => (Math.round(n*100)/100).toLocaleString("nl-NL");
const kf = n => n>=10000 ? Math.round(n/1000)+"k" : nf(Math.round(n));

/* Robin leest een set als "5 x 80 kg": eerst het aantal, dan het gewicht. */
function setTekst(w,r,metEenheid,bw){
  if(!r) return "–";
  if(bw) return w ? r+" × BW +"+nf(w)+(metEenheid?" kg":"") : r+" × BW";
  if(!w) return r+" × BW";
  return r+" × "+nf(w)+(metEenheid?" kg":"");
}

/* Geschat 1RM (Epley). Alleen zinnig tot ~12 herhalingen. */
function e1rm(w,r){ if(!w||!r) return 0; if(r===1) return w; if(r>15) r=15; return w*(1+r/30); }
function isWork(s){ return s.done && s.t!=="warmup"; }

/* Gym of body? Alles wat vóór de bodysectie is gelogd heeft nog geen `soort`
   en is dus gewoon een gymworkout. Twee soorten die je niet met elkaar moet
   vergelijken: een circuit van 25 minuten met kettlebells is niet "lichter"
   dan een uur bankdrukken, het is iets anders. */
function soortVan(s){ return (s && s.soort==="body") ? "body" : "gym"; }
const SOORTNAAM={gym:"Gymworkout", body:"Bodyworkout"};
const SOORTWOORD={gym:"gymworkouts", body:"bodyworkouts"};

/* ---------- 2. Oefeningenbibliotheek ----------------------------------- */
/* groep = spiergroep, cat = push/pull/legs/core/cardio, type = meetsoort */
const LIB = [
 ["Barbell bench press","Borst","push"],["Incline barbell press","Borst","push"],
 ["Dumbbell bench press","Borst","push"],["Incline dumbbell press","Borst","push"],
 ["Chest press machine","Borst","push"],["Cable fly","Borst","push"],
 ["Pec deck","Borst","push"],["Dips","Borst","push","bw+"],["Push-up","Borst","push","bw"],
 ["Deadlift","Rug","pull"],["Barbell row","Rug","pull"],["Dumbbell row","Rug","pull"],
 ["T-bar row","Rug","pull"],["Seated cable row","Rug","pull"],["Lat pulldown","Rug","pull"],
 ["Pull-up","Rug","pull","bw+"],["Chin-up","Rug","pull","bw+"],["Straight-arm pulldown","Rug","pull"],
 ["Back extension","Rug","pull","bw+"],["Shrug","Rug","pull"],
 ["Overhead press","Schouders","push"],["Dumbbell shoulder press","Schouders","push"],
 ["Arnold press","Schouders","push"],["Lateral raise","Schouders","push"],
 ["Cable lateral raise","Schouders","push"],["Rear delt fly","Schouders","pull"],
 ["Face pull","Schouders","pull"],["Upright row","Schouders","pull"],
 ["Barbell curl","Biceps","pull"],["Dumbbell curl","Biceps","pull"],["Hammer curl","Biceps","pull"],
 ["Preacher curl","Biceps","pull"],["Cable curl","Biceps","pull"],["Incline dumbbell curl","Biceps","pull"],
 ["Close-grip bench press","Triceps","push"],["Triceps pushdown","Triceps","push"],
 ["Overhead triceps extension","Triceps","push"],["Skullcrusher","Triceps","push"],
 ["Triceps kickback","Triceps","push"],
 ["Back squat","Quadriceps","legs"],["Front squat","Quadriceps","legs"],
 ["Hack squat","Quadriceps","legs"],["Leg press","Quadriceps","legs"],
 ["Leg extension","Quadriceps","legs"],["Bulgarian split squat","Quadriceps","legs"],
 ["Lunge","Quadriceps","legs"],["Goblet squat","Quadriceps","legs"],
 ["Romanian deadlift","Hamstrings","legs"],["Leg curl","Hamstrings","legs"],
 ["Seated leg curl","Hamstrings","legs"],["Good morning","Hamstrings","legs"],
 ["Nordic curl","Hamstrings","legs","bw+"],
 ["Hip thrust","Bilspieren","legs"],["Glute bridge","Bilspieren","legs"],
 ["Cable kickback","Bilspieren","legs"],["Hip abduction","Bilspieren","legs"],
 ["Standing calf raise","Kuiten","legs"],["Seated calf raise","Kuiten","legs"],
 ["Calf press","Kuiten","legs"],
 ["Plank","Core","core","time"],["Hanging leg raise","Core","core","bw+"],
 ["Cable crunch","Core","core"],["Ab wheel","Core","core","bw+"],
 ["Russian twist","Core","core"],["Sit-up","Core","core","bw+"],
 ["Wrist curl","Onderarmen","pull"],["Farmer's walk","Onderarmen","pull"],
 ["Roeien","Cardio","cardio","cardio"],["Loopband","Cardio","cardio","cardio"],
 ["Crosstrainer","Cardio","cardio","cardio"],["Hometrainer","Cardio","cardio","cardio"],
 ["Stairmaster","Cardio","cardio","cardio"],
];
const GROEPEN=["Borst","Rug","Schouders","Biceps","Triceps","Quadriceps","Hamstrings","Bilspieren","Kuiten","Core","Onderarmen","Cardio"];
function defaultExercises(){
  return LIB.map(([name,groep,cat,type])=>({id:uid(),name,groep,cat,type:type||"wr",fav:false,arch:false}));
}

/* Een oefening mag meerdere spiergroepen en meerdere soorten bewegingen hebben:
   bankdrukken is borst én triceps. De eerste in de lijst is de hoofdgroep — die
   staat op het chipje en bepaalt waar de oefening in lijsten terechtkomt.

   Oefeningen van vóór deze versie hebben alleen `groep` en `cat`. Die lezen we
   hier als een lijst van één, zodat er niets omgezet hoeft te worden en oude
   trainingen precies blijven zoals ze waren. */
function exGroepen(ex){
  if(!ex) return [];
  return (ex.groepen&&ex.groepen.length) ? ex.groepen : (ex.groep?[ex.groep]:[]);
}
function exCats(ex){
  if(!ex) return [];
  return (ex.cats&&ex.cats.length) ? ex.cats : (ex.cat?[ex.cat]:[]);
}
function heeftGroep(ex,g){ return exGroepen(ex).indexOf(g)>=0; }
const CATS=[["push","Duwen"],["pull","Trekken"],["legs","Benen"],["core","Core"],["cardio","Cardio"]];

/* ---------- 3. Opslag --------------------------------------------------- */
const KEY="ijzerlog.v1";
const VERSIE="30 okt 2026 - 17:45";   // zichtbaar onder Meer -> Over, om te zien welke versie je telefoon draait
let storageOK=true;
const DB={
  d:null,
  boot(){
    let raw=null;
    try{ raw=localStorage.getItem(KEY); }catch(e){ storageOK=false; }
    if(raw){ try{ this.d=JSON.parse(raw); }catch(e){ this.d=null; } }
    if(!this.d) this.d=this.fresh();
    // migratie-vangnet
    const f=this.fresh();
    for(const k in f) if(this.d[k]===undefined) this.d[k]=f[k];
    for(const k in f.settings) if(this.d.settings[k]===undefined) this.d.settings[k]=f.settings[k];
    if(!this.d.exercises.length) this.d.exercises=defaultExercises();
    // Eenmalig: oefeningen die Robin niet doet uit het voorstel houden
    if(!this.d.settings.aanpassing1){
      for(const n of ["Hip thrust"]){
        const e=this.d.exercises.find(x=>x.name.toLowerCase()===n.toLowerCase());
        if(e) e.nietVoorstellen=true;
      }
      this.d.settings.aanpassing1=true;
    }
  },
  fresh(){
    return {
      v:1,
      settings:{unit:"kg",lastBackup:null,
                interval:{werk:40,rust:20,rondes:5}},
      exercises:defaultExercises(),
      routines:[],
      sessions:[],
      weights:[],
      evaluaties:[],      // bewaarde momentopnames, om de volgende mee te vergelijken
      profiel:null,        // Coach: leeftijd, doelen, dagen, blessures, eten
      checkins:[],         // Coach: één korte vragenlijst per week
      active:null
    };
  },
  save(){
    if(!storageOK) return;
    try{ localStorage.setItem(KEY,JSON.stringify(this.d)); }
    catch(e){ storageOK=false; toast("Opslaan mislukt — maak een back-up!"); }
  }
};
const S = () => DB.d.settings;
const exById = id => DB.d.exercises.find(e=>e.id===id);
const exName = id => (exById(id)||{}).name || "Onbekend";

/* ---------- 4. Interface-bouwstenen ------------------------------------ */
function toast(msg,ms=2100){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),ms);
}
/* De inhoud van een tekstvak naar het klembord. navigator.clipboard is de
   moderne weg en werkt op iOS het betrouwbaarst, maar bestaat alleen op een
   beveiligde verbinding; execCommand is de terugval voor het geval dat. Blijft
   het mislukken, dan laten we de tekst geselecteerd staan zodat hij alleen nog
   op Kopiëren hoeft te tikken. */
function kopieerVeld(sel,gelukt){
  const el=$(sel); if(!el) return;
  const klaar=()=>toast(gelukt||"Gekopieerd");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.value).then(klaar).catch(()=>oudeManier());
    return;
  }
  oudeManier();
  function oudeManier(){
    const was=el.hasAttribute("readonly");
    el.removeAttribute("readonly");                 // iOS kopieert niet uit een readonly veld
    el.focus(); el.select();
    try{ el.setSelectionRange(0,el.value.length); }catch(e){}
    let ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){}
    if(was) el.setAttribute("readonly","readonly");
    toast(ok ? (gelukt||"Gekopieerd") : "Tik nu op Kopiëren in het menu dat verschijnt");
  }
}

/* Melding met een knop erin, voor dingen die je meteen terug wilt kunnen
   draaien. Blijft wat langer staan dan een gewone melding. */
function toastActie(msg,label,fn,ms=6000){
  const t=$("#toast");
  t.innerHTML=`<span>${esc(msg)}</span><button type="button" class="tst-act">${esc(label)}</button>`;
  t.classList.add("on");
  t.querySelector(".tst-act").onclick=()=>{ clearTimeout(t._t); t.classList.remove("on"); fn(); };
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),ms);
}
const Sheet={
  open(title,html,onOpen){
    $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=html;
    $("#sheetBody").scrollTop=0;
    $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
    if(onOpen) onOpen($("#sheetBody"));
  },
  close(){ $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
           setTimeout(()=>{ if(!$("#sheet").classList.contains("on")) $("#sheetBody").innerHTML=""; },320); }
};
/* Eigen bevestiging (browser-confirm werkt niet overal in een iframe) */
let _askRes=null;
function ask(title,text,okLabel="Ja",gevaar=false){
  return new Promise(res=>{
    _askRes=res;
    Sheet.open(title,`
      <p class="mut" style="font-size:14.5px;color:var(--ink-2)">${esc(text)}</p>
      <div class="row" style="margin-top:4px">
        <button class="btn ghost wide" type="button" onclick="_ans(false)">Annuleren</button>
        <button class="btn ${gevaar?"danger":"primary"} wide" type="button" onclick="_ans(true)">${esc(okLabel)}</button>
      </div>`);
  });
}
function _ans(v){ Sheet.close(); if(_askRes){ _askRes(v); _askRes=null; } }

/* ---------- 5. Klok en intervaltimer (bodyworkouts) ----------------------
   Een stopwatch die de hele workout meeloopt, en daarbovenop een optionele
   intervaltimer voor circuits: zoveel seconden werk, zoveel rust, zoveel
   rondes. iOS wil een aanraking voordat het geluid mag maken.            */
let AC=null;
function unlockAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==="suspended") AC.resume();
}
function piep(n=1,hoog){
  if(!AC) return;
  for(let i=0;i<n;i++){
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+i*0.18;
    o.frequency.setValueAtTime(hoog?1046:784,t); o.type="sine";
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.18);
  }
  if(navigator.vibrate) try{ navigator.vibrate(n>1?[120,60,120]:120); }catch(e){}
}

const Klok={
  iv:null,
  verstreken(){
    const a=DB.d.active; if(!a||!a.start) return 0;
    const pauze=(a.pauzeTotaal||0)+(a.pauzeVanaf?Date.now()-a.pauzeVanaf:0);
    return Math.max(0,Math.round((Date.now()-a.start-pauze)/1000));
  },
  loopt(){ const a=DB.d.active; return !!(a&&a.start&&!a.pauzeVanaf); },
  pauze(){
    const a=DB.d.active; if(!a) return;
    if(a.pauzeVanaf){ a.pauzeTotaal=(a.pauzeTotaal||0)+(Date.now()-a.pauzeVanaf); a.pauzeVanaf=null; }
    else a.pauzeVanaf=Date.now();
    DB.save(); render();
  },
  tik(){ const el=$("#klok"); if(el) el.textContent=mmss(this.verstreken()); },
  aan(){ clearInterval(this.iv); this.iv=setInterval(()=>this.tik(),500); this.tik(); },
  uit(){ clearInterval(this.iv); this.iv=null; }
};

const Interval={
  aan:false, fase:"werk", eind:0, ronde:1, iv:null,
  start(){
    unlockAudio();
    // Begin je met een interval, dan is de workout begonnen: klok mee laten lopen
    const a=DB.d.active;
    if(a && a.pauzeVanaf){ a.pauzeTotaal=(a.pauzeTotaal||0)+(Date.now()-a.pauzeVanaf); a.pauzeVanaf=null; DB.save(); }
    const c=S().interval;
    this.aan=true; this.fase="werk"; this.ronde=1;
    this.eind=Date.now()+c.werk*1000;
    clearInterval(this.iv); this.iv=setInterval(()=>this.tik(),200);
    render();
  },
  stop(){ this.aan=false; clearInterval(this.iv); this.iv=null; render(); },
  tik(){
    if(!this.aan) return;
    const over=Math.ceil((this.eind-Date.now())/1000);
    const el=$("#intT"); if(el) el.textContent=mmss(Math.max(0,over));
    const lb=$("#intL"); if(lb) lb.textContent=this.fase==="werk"?"Werken":"Rust";
    const bal=$("#intBal"); if(bal) bal.className="intervalbalk "+this.fase;
    if(over>0) return;
    const c=S().interval;
    if(this.fase==="werk"){
      if(c.rust>0){ this.fase="rust"; this.eind=Date.now()+c.rust*1000; piep(1); }
      else { this.volgendeRonde(c); }
    } else this.volgendeRonde(c);
  },
  volgendeRonde(c){
    if(this.ronde>=c.rondes){ this.aan=false; clearInterval(this.iv); this.iv=null; piep(3,true); render(); return; }
    this.ronde++; this.fase="werk"; this.eind=Date.now()+c.werk*1000; piep(2,true);
    const r=$("#intR"); if(r) r.textContent=`Ronde ${this.ronde} van ${c.rondes}`;
  }
};

/* ---------- 6. Analyse: records, volume, statistieken -------------------- */
function allSessions(){ return DB.d.sessions.slice().sort((a,b)=>a.date<b.date?1:-1); }

/* Alle sets van één oefening, chronologisch per sessie */
function historyFor(exId,excludeSessionId){
  const out=[];
  for(const s of DB.d.sessions){
    if(s.id===excludeSessionId) continue;
    for(const e of s.entries){
      if(e.exId!==exId) continue;
      const sets=e.sets.filter(isWork);
      if(sets.length) out.push({date:s.date,sessionId:s.id,sets});
    }
  }
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function bestOf(sets){
  let b={e1:0,w:0,r:0,vol:0,set:null};
  for(const s of sets){
    // Sets op tijd doen hier niet mee: 40 seconden met 24 kg is geen 1RM en
    // geen volume, dat zou alleen maar valse records opleveren.
    if(s.sec) continue;
    const v=(s.w||0)*(s.r||0); b.vol+=v;
    const e=e1rm(s.w,s.r);
    if(e>b.e1){ b.e1=e; b.w=s.w; b.r=s.r; b.set=s; }
  }
  return b;
}
/* ---------- Persoonlijke records ---------------------------------------
   Drie soorten, in gewone taal:

     gewicht      — zwaarder getild dan ooit bij deze oefening
     herhalingen  — meer herhalingen op dit gewicht (of zwaarder) dan ooit
     sets         — meer werksets in één training dan ooit

   Waarom "op dit gewicht of zwaarder" en niet gewoon het meeste aantal
   herhalingen? Omdat 4 × 100 anders nooit een record zou zijn zolang er ooit
   15 × 40 in het logboek staat. En waarom geen geschat 1RM meer: dat getal
   wilde hij niet zien, en het gaf rare uitkomsten.

   Sets op tijd (plank, farmer's hold) doen niet mee — daar zijn seconden de
   maat, geen kilo's.                                                       */
function recordsUit(nuSets, eerder, maxSetsEerder){
  const nu=nuSets.filter(s=>isWork(s) && !s.sec);
  if(!nu.length || !eerder.length) return [];          // de eerste keer is geen record
  const uit=[];

  const oudZwaarst=Math.max(0,...eerder.map(s=>s.w||0));
  const zwaarsteNu=nu.reduce((a,s)=>
    ((s.w||0)>(a.w||0) || ((s.w||0)===(a.w||0) && (s.r||0)>(a.r||0))) ? s : a, nu[0]);

  if((zwaarsteNu.w||0)>oudZwaarst && zwaarsteNu.w){
    uit.push({soort:"gewicht", set:zwaarsteNu, was:oudZwaarst,
      kort:`${setTekst(zwaarsteNu.w,zwaarsteNu.r,true,zwaarsteNu.bw)} (zwaarste ooit)`,
      tekst:`zwaarste ooit — ${setTekst(zwaarsteNu.w,zwaarsteNu.r,true,zwaarsteNu.bw)}${oudZwaarst?` (was ${nf(oudZwaarst)} kg)`:""}`});
  } else {
    // Geen zwaarder gewicht? Dan kijken we of je er meer uit hebt geperst.
    let best=null;
    for(const s of nu){
      const oud=Math.max(0,...eerder.filter(x=>(x.w||0)>=(s.w||0)).map(x=>x.r||0));
      if((s.r||0)>oud && (!best || s.r>best.set.r)) best={set:s, was:oud};
    }
    if(best) uit.push({soort:"herhalingen", set:best.set, was:best.was,
      kort:`${setTekst(best.set.w,best.set.r,true,best.set.bw)} (meeste herhalingen)`,
      tekst:`meeste herhalingen ${best.set.bw&&!best.set.w?"op eigen gewicht":`op ${nf(best.set.w)} kg`} — ${setTekst(best.set.w,best.set.r,true,best.set.bw)} (was ${best.was})`});
  }

  // Van twee naar drie sets is geen prestatie om te vieren; vanaf drie wel.
  if(nu.length>maxSetsEerder && nu.length>=3)
    uit.push({soort:"sets", aantal:nu.length, was:maxSetsEerder,
      kort:`${nu.length} sets (meeste in één training)`,
      tekst:`meeste sets in één training — ${nu.length} (was ${maxSetsEerder})`});

  return uit;
}
/* ============================================================================
   PROGRESSIE — wat leg je de volgende keer op de stang?

   Drie dingen samen maken dit mogelijk:

     doel  — hoeveel sets en welk herhalingsbereik je nastreeft (3 × 6–8)
     stap  — de kleinste sprong die bij deze oefening haalbaar is
     RIR   — hoeveel herhalingen je nog in de tank had

   RIR is optioneel. Vul je het niet in, dan kijkt het voorstel alleen of je je
   doelbereik haalde. Dat werkt ook, maar minder scherp: drie sets van acht met
   nog drie in de tank is iets heel anders dan drie sets van acht waarbij de
   laatste er met moeite uit kwam.

   Alles wordt hier berekend uit wat je zelf hebt gelogd. Er wordt niets
   ingevuld of overschreven — het voorstel is een regel tekst, jij typt. */

/* Het doel van een oefening. Staat er nog niets, dan leiden we het af uit wat
   je met deze oefening gewoonlijk doet: je gebruikelijke aantal sets en het
   herhalingsaantal dat je het vaakst draait. Dat is een beter startpunt dan
   één standaardwaarde voor alles — bij jou is dat voor bankdrukken iets heel
   anders dan voor bicep curls. */
function doelVan(ex){
  if(ex && ex.doel && ex.doel.min) return ex.doel;
  const h=ex?historyFor(ex.id):[];
  const werk=[]; let setsPerSessie=[];
  for(const d of h.slice(-8)){
    const w=d.sets.filter(s=>!s.sec);
    if(!w.length) continue;
    setsPerSessie.push(w.length);
    for(const s of w) if(s.r) werk.push(s.r);
  }
  if(werk.length<3) return {sets:3, min:8, max:12, stap:stapVan(ex), afgeleid:true};
  // De mediaan, niet het meest voorkomende getal: bij bankdrukken staan er
  // tientallen losse zware pogingen van één herhaling in zijn logboek, en dan
  // zou "1 herhaling" als doel uit de bus komen.
  werk.sort((a,b)=>a-b);
  const mediaan=werk[Math.floor(werk.length/2)];
  const sets=Math.round(setsPerSessie.reduce((a,b)=>a+b,0)/setsPerSessie.length)||3;
  // een bereik van vier herhalingen rond wat je doorgaans draait
  const min=Math.max(1,mediaan-1);
  return {sets:clamp(sets,2,5), min, max:min+3, stap:stapVan(ex), afgeleid:true};
}
/* De kleinste sprong die je bij deze oefening in de praktijk maakt. Afgeleid
   uit je eigen gewichten: bij een machine met blokken van 5 kg heeft 2,5 kg
   voorstellen geen zin. */
function stapVan(ex){
  if(ex && ex.doel && ex.doel.stap) return ex.doel.stap;
  const h=ex?historyFor(ex.id):[];
  const gewichten=new Set();
  for(const d of h) for(const s of d.sets) if(s.w>0 && !s.sec) gewichten.add(s.w);
  const lijst=[...gewichten].sort((a,b)=>a-b);
  if(lijst.length<3) return 2.5;
  // De stap die het váákst tussen twee van zijn gewichten zit, niet de
  // kleinste: één keer 1,5 kg verschil maakt nog geen apparaat met stappen
  // van anderhalve kilo.
  const tel={};
  for(let i=1;i<lijst.length;i++){
    const d=Math.round((lijst[i]-lijst[i-1])*4)/4;
    if(d>=0.5 && d<=10) tel[d]=(tel[d]||0)+1;
  }
  const beste=Object.entries(tel).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0];
  // Pas als diezelfde sprong minstens drie keer voorkomt geloven we hem. Bij
  // lat pulldown kwam er anders 7,5 kg uit omdat hij er toevallig drie ver uit
  // elkaar liggende gewichten op had staan — dan zou het voorstel van 17,5
  // naar 25 kg springen.
  return (beste && beste[1]>=3) ? clamp(+beste[0],0.5,10) : 2.5;
}

/* Is het weer tijd om je max te testen?

   Een zware poging meet je kracht, hij bouwt hem niet — en hij kost herstel.
   Daarom pas als aan drie dingen is voldaan: het is minstens acht weken
   geleden, je hebt de oefening sindsdien geregeld gedaan, én je werkgewicht is
   omhoog gegaan. Dat laatste is de belangrijkste: testen terwijl er niets is
   veranderd levert alleen hetzelfde getal op.

   Een "poging" is een set van één of twee herhalingen op minstens 90% van je
   zwaarste ooit. Lichtere lage-repsets tellen niet mee.                     */
function maxMoment(exId, exclSessionId){
  const ex=exById(exId);
  if(!ex || ex.type==="cardio") return null;
  const h=historyFor(exId,exclSessionId);
  if(h.length<6) return null;
  const alle=[];
  for(const d of h) for(const s of d.sets) if(!s.sec && s.w>0) alle.push({date:d.date,w:s.w,r:s.r||0});
  if(!alle.length) return null;
  // Alleen bij oefeningen die je écht zwaar traint. Zonder deze voorwaarde
  // stelde hij voor om te maxen op fietsen, front raises en bicep curls —
  // daar test je geen maximum op.
  if(alle.filter(s=>s.r>=1 && s.r<=5).length<3) return null;
  const best=Math.max(...alle.map(s=>s.w));
  const pogingen=alle.filter(s=>s.r<=2 && s.w>=best*0.9);
  const laatste=pogingen.length ? pogingen[pogingen.length-1].date : null;
  const weken = laatste ? Math.floor(daysAgo(laatste)/7) : 99;
  if(weken<8) return null;

  const sinds=h.filter(d=>!laatste || d.date>laatste);
  if(sinds.length<4) return null;                       // te weinig getraind sinds toen

  // werksets: drie herhalingen of meer, dat is het werk waar kracht uit komt
  const werkNa=Math.max(0,...alle.filter(s=>s.r>=3 && (!laatste||s.date>laatste)).map(s=>s.w));
  const werkVoor=Math.max(0,...alle.filter(s=>s.r>=3 && laatste && s.date<=laatste).map(s=>s.w));
  if(laatste && werkNa<=werkVoor) return null;          // niets veranderd, niets te testen

  return {
    weken, laatste, best,
    tekst: laatste
      ? `Je laatste zware poging was ${weken} weken geleden, en je werkgewicht ging sindsdien van ${nf(werkVoor)} naar ${nf(werkNa)} kg. Goed moment om te kijken waar je max nu staat.`
      : `Je hebt bij deze oefening nog nooit een zware poging gelogd, en je draait er inmiddels ${sinds.length} sessies op. Je zou kunnen kijken waar je max ligt.`
  };
}

/* Het voorstel zelf. Geeft null terug als er te weinig te vergelijken valt —
   liever niets zeggen dan iets verzinnen.

   `taak` ("zwaar" of "volume") kijkt terug naar je vorige dag van diezelfde
   soort. Zonder dat ging het mis: Robin deed 4 × 6 × 80 op een volumedag, en
   voor de zware dag erna stelde de app 85 kg voor — terwijl hij een week
   eerder 110 kg drukte. Je vergelijkt een zware dag met een zware dag.
   En het doel hoort bij de taak: op een volumedag wil je 6–8 herhalingen,
   niet de 3–5 die bij je zware dag staan.                                   */
function voorstelVoor(exId, exclSessionId, taak){
  const ex=exById(exId); if(!ex || ex.type==="cardio") return null;
  const h=historyFor(exId,exclSessionId);
  if(!h.length) return null;

  let bron=h[h.length-1];
  if(taak){
    // de laatste keer dat je deze oefening met dezelfde taak deed
    for(let i=h.length-1;i>=0;i--){
      const s=DB.d.sessions.find(x=>x.id===h[i].sessionId);
      if(s && taakVan(s,exId)===taak){ bron=h[i]; break; }
    }
  }
  const vorige=bron.sets.filter(s=>!s.sec);
  if(!vorige.length) return null;

  const basis=doelVan(ex), stap=basis.stap||stapVan(ex);
  // Op een volumedag gelden andere herhalingen dan je ingestelde doel.
  const doel = taak==="volume" ? {...basis, sets:Math.max(3,basis.sets), min:6, max:8} : basis;
  // het gewicht waar je vorige keer je werk deed: dat wat het vaakst voorkwam,
  // bij gelijkspel het zwaarste
  const tel={};
  for(const s of vorige) if(s.w>0) tel[s.w]=(tel[s.w]||0)+1;
  const kandidaten=Object.entries(tel).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  if(!kandidaten.length) return null;                       // puur lichaamsgewicht
  const kg=+kandidaten[0][0];
  const opKg=vorige.filter(s=>s.w===kg);
  const reps=opKg.map(s=>s.r||0);
  const laagste=Math.min(...reps), hoogste=Math.max(...reps);

  // RIR van die sets, als je het hebt ingevuld
  const rirs=opKg.map(s=>s.rir).filter(v=>v!==null&&v!==undefined);
  const rir = rirs.length ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  const rirTekst = rir===null ? "" : ` met gemiddeld ${nf(Math.round(rir*10)/10)} in de tank`;
  const setsTekst = `${opKg.length}× ${laagste===hoogste?laagste:laagste+"–"+hoogste} × ${nf(kg)} kg`;

  // Optellen vanaf het gewicht dat je gebruikte, niet afronden naar een raster:
  // 17,5 kg met stappen van 5 wordt 22,5 kg, niet 25. En nooit meer dan een
  // tiende erbij in één keer — bij een licht gewicht is een stap van 7,5 kg
  // een sprong van veertig procent, en dat gaat je niet lukken.
  const rond=v=>Math.round(v*2)/2;
  const sprong=Math.max(1,Math.min(stap, kg*0.10));
  const maak=(nieuwKg,reden,soort)=>({kg:Math.round(nieuwKg*100)/100, reden, soort, doel, stap, vorige:{kg,laagste,hoogste,sets:opKg.length,rir}});

  // 1. doelbereik niet gehaald: niet verhogen
  if(laagste < doel.min){
    if(rir!==null && rir>=2)
      return maak(kg, `Je bleef onder je doel (${setsTekst}${rirTekst}). Er zat nog ruimte in — probeer hetzelfde gewicht nog eens en ga voor ${doel.min}+ herhalingen.`, "zelfde");
    return maak(kg, `Je haalde ${setsTekst}, onder je doel van ${doel.min}. Blijf op dit gewicht tot je ${doel.min} herhalingen haalt in al je sets.`, "zelfde");
  }

  // 2. bovenkant van het bereik gehaald in alle sets
  if(laagste >= doel.max){
    if(rir!==null && rir>=3)
      return maak(rond(kg+Math.min(stap*2,kg*0.15)), `Je draaide ${setsTekst}${rirTekst}. Dat was duidelijk te licht — twee stappen omhoog kan.`, "omhoog");
    if(rir!==null && rir<=0)
      return maak(rond(kg+sprong), `Je haalde ${setsTekst}, maar ging er helemaal doorheen${rirTekst}. Eén stap omhoog, en verwacht dat je onderin je bereik begint.`, "omhoog");
    return maak(rond(kg+sprong), `Je haalde ${setsTekst} — je hele doelbereik vol. Tijd voor ${nf(rond(kg+sprong))} kg.`, "omhoog");
  }

  // 3. binnen het bereik: eerst herhalingen erbij
  // Vier of meer in de tank is geen "bijna": dan kon je er nog een stuk bij.
  // Dit stond eerst op één stap terwijl tak 2 bij dezelfde RIR al twee stappen
  // deed — inconsequent, en bij Robin bleef zijn bankdruk daardoor hangen op
  // 85 kg met RIR 3,8 terwijl hij een week eerder 110 kg drukte.
  // De grens ligt op 3,5 en niet op 4, omdat dit een gemiddelde over je sets
  // is: wie 4, 4, 3, 4 invult komt uit op 3,75 en bedoelt gewoon "een stuk of
  // vier in de tank". Een halve herhaling speling.
  if(rir!==null && rir>=3.5)
    return maak(rond(kg+Math.min(stap*2,kg*0.15)), `Je zat op ${setsTekst}${rirTekst}. Dat is nog ruim binnen wat je kunt — twee stappen omhoog kan.`, "omhoog");
  if(rir!==null && rir>=3)
    return maak(rond(kg+sprong), `Je zat op ${setsTekst}${rirTekst}. Je bent nog niet aan de bovenkant van je bereik, maar het kostte je weinig — dit gewicht mag omhoog.`, "omhoog");
  return maak(kg, `Je zat op ${setsTekst}${rirTekst}. Blijf op ${nf(kg)} kg en werk naar ${doel.max} herhalingen in elke set.`, "zelfde");
}

/* ---- Focusoefening ---------------------------------------------------------
   De oefening waar je programma omheen draait. Niet iets wat je instelt maar
   iets wat we aflezen: welke oefening deed je de laatste twaalf weken het
   vaakst, en dan vooral zwaar (sets van 1 tot 5 herhalingen)? Bij Robin wint
   bankdrukken met 166 punten tegen 34 voor de nummer twee, dus daar valt niets
   te twijfelen. Verschuift zijn focus ooit naar squat of deadlift, dan schuift
   dit mee zonder dat hij iets hoeft aan te zetten.                           */
function focusOefening(){
  let beste=null;
  for(const ex of DB.d.exercises){
    if(ex.arch || ex.type==="cardio") continue;
    const h=historyFor(ex.id).filter(d=>daysAgo(d.date)<=84);
    if(h.length<6) continue;
    let zwaar=0;
    for(const d of h) for(const s of d.sets){
      if(s.sec || !(s.w>0)) continue;
      if(s.r>=1 && s.r<=5) zwaar++;
    }
    if(zwaar<6) continue;                       // geen oefening die je zwaar traint
    const score=h.length*2+zwaar;
    if(!beste || score>beste.score) beste={id:ex.id, ex, score, sessies:h.length};
  }
  return beste;
}

/* Was dat een zware dag of een volumedag? Startte je de workout vanuit het
   voorstel, dan staat de taak gewoon op de sessie. Zo niet, dan leiden we hem
   af uit de mediaan van je werksets — met de kanttekening dat daar bij Robin
   twaalf van de twaalf keer "zwaar" uit komt. Hij hééft geen volumedagen; dat
   is precies het gat dat dit voorstel moet vullen.                          */
/* Alleen "zwaar" en "volume" zeggen iets over hoe zwaar je die dag tilde; een
   trekdag of benendag is geen belastingstaak. Bij die laatste vergelijken we
   gewoon met je vorige keer. */
function laadTaak(sessie){
  const t=sessie && sessie.taak;
  return (t==="zwaar" || t==="volume") ? t : null;
}

function taakVan(sessie, exId){
  if(sessie && sessie.taak) return sessie.taak;
  const e=((sessie&&sessie.entries)||[]).find(x=>x.exId===exId);
  if(!e) return null;
  const reps=e.sets.filter(s=>!s.sec && s.w>0 && s.t!=="warmup")
                   .map(s=>s.r||0).sort((a,b)=>a-b);
  if(!reps.length) return null;
  return reps[Math.floor(reps.length/2)]<=5 ? "zwaar" : "volume";
}

/* Het gewicht voor een volumedag: het zwaarste waarop je ooit zes of meer
   herhalingen maakte. Heb je dat nooit gedaan, dan rekenen we terug vanaf je
   zwaarste werkset — ongeveer een achtste eraf. Nooit verzinnen: is er geen
   geschiedenis, dan geven we niets terug.                                   */
function volumeGewicht(exId){
  const h=historyFor(exId);
  let metReps=0;
  for(const d of h) for(const s of d.sets){
    if(s.sec || !(s.w>0)) continue;
    if(s.r>=6 && s.w>metReps) metReps=s.w;
  }
  if(metReps) return metReps;
  const w=werkGewicht(exId);
  return w ? Math.round(w*0.88/2.5)*2.5 : null;
}

/* Je werkgewicht: het zwaarste waarmee je ooit drie of meer herhalingen deed.
   Dit is de maat waar een rustige week vanaf rekent, níet je zwaarste poging
   ooit — 80% van een maximale single is bij Robin 88 kg, en dat is gewoon zijn
   normale zware werkgewicht. Dan deload je niets.                           */
function werkGewicht(exId){
  const h=historyFor(exId);
  let w=0;
  for(const d of h) for(const s of d.sets)
    if(!s.sec && s.w>0 && s.r>=3 && s.w>w) w=s.w;
  return w||null;
}

/* ---- Mijlpalen -------------------------------------------------------------
   Geen punten, geen niveaus, geen streak die je kwijtraakt. En bewust niets
   dat je verdient door vaker te trainen dan goed voor je is: er is geen
   mijlpaal voor zeven dagen achter elkaar. Elke mijlpaal beloont iets dat je
   doel dient, en elke nog niet behaalde zegt in je eigen cijfers wat eraan
   ontbreekt.

   Alles wordt elke keer opnieuw uitgerekend uit je logboek, net als de tips.
   Het enige dat we bewaren is wélke je al een keer te zien kreeg, zodat er
   precies één keer eentje opduikt na een training.                          */
function mijlpaalGezien(){
  const s=S();
  if(!s.mijlpalen || !Array.isArray(s.mijlpalen.gezien)) s.mijlpalen={gezien:[]};
  return s.mijlpalen.gezien;
}

function mijlpalen(extra){
  const f=focusOefening(); if(!f) return null;
  const ex=f.ex, doel=doelVan(ex);
  // Treden van één stap, niet twee: bij bankdrukken is dat 2,5 kg. Fijner
  // verdeeld betekent vaker iets te vieren, en dat is het punt van een ladder.
  const stap=doel.stap||stapVan(ex);
  const sessies = extra ? DB.d.sessions.concat([extra]) : DB.d.sessions;
  const WEEK=6048e5, nu=Date.now();

  /* Eerste doorloop: wat is het zwaarste dat je ooit tilde? Dat getal is de
     maat voor "zwaar" in de tweede doorloop, dus het moet eerst klaar zijn. */
  let topKg=0, topDatum="", werkDatum="", werkKg=0;
  const focusVan=s=>{
    for(const e of s.entries||[]){
      if(e.exId!==f.id) continue;
      const w=e.sets.filter(y=>isWork(y)&&!y.sec);
      if(w.length) return w;
    }
    return null;
  };
  for(const s of sessies){
    const w=focusVan(s); if(!w) continue;
    for(const st of w) if((st.w||0)>topKg){ topKg=st.w; topDatum=s.date; }
  }
  const doelKg = (ex.doel && ex.doel.max1rm>0) ? ex.doel.max1rm : 0;
  // Zestien treden terug, zodat de ladder dezelfde afstand overspant als
  // voorheen (bij hem 100 tot 140 kg) maar in kleinere stappen.
  const eersteTrede = doelKg ? doelKg - 16*stap : 0;
  const drempel = topKg*0.85;

  const W=[];
  const vak=i=>{ while(W.length<=i) W.push({duw:0,trek:0,dagen:0,zwaar:0,volume:0,rirDagen:0,zware:0,iets:false}); return W[i]; };
  for(const s of sessies){
    const i=Math.floor((nu-dParse(s.date).getTime())/WEEK);
    if(i<0 || i>15) {
      // buiten het venster, maar wel meetellen voor "ooit behaald"
      const w=focusVan(s);
      if(w) for(const st of w) if(st.r>=3 && eersteTrede && st.w>=eersteTrede && (!werkDatum || s.date<werkDatum)){ werkDatum=s.date; werkKg=st.w; }
      continue;
    }
    const v=vak(i); v.iets=true;
    for(const e of s.entries||[]){
      const x=exById(e.exId); if(!x || x.type==="cardio") continue;
      const w=e.sets.filter(y=>isWork(y)&&!y.sec); if(!w.length) continue;
      const g=exGroepen(x);
      if(g.some(y=>y==="Borst"||y==="Schouders"||y==="Triceps")) v.duw+=w.length;
      if(g.some(y=>y==="Rug"||y==="Biceps")) v.trek+=w.length;
    }
    const w=focusVan(s);
    if(w){
      v.dagen++;
      const reps=w.map(x=>x.r||0).sort((a,b)=>a-b);
      const med=reps[Math.floor(reps.length/2)];
      const taak = (s.taak==="zwaar"||s.taak==="volume") ? s.taak : (med<=5?"zwaar":"volume");
      if(taak==="zwaar") v.zwaar++; else v.volume++;
      if(w.some(x=>x.rir!==null && x.rir!==undefined)) v.rirDagen++;
      v.zware += w.filter(x=>x.w>=drempel && x.r<=6).length;
      for(const st of w) if(st.r>=3 && eersteTrede && st.w>=eersteTrede && (!werkDatum || s.date<werkDatum)){ werkDatum=s.date; werkKg=st.w; }
    }
  }

  /* Reeksen tellen we over vólle weken; de lopende week doet niet mee, die is
     nog niet af. Een week waarin je niets logde breekt de reeks. */
  const reeks=(test)=>{
    let beste=0, lopend=0;
    for(let i=1;i<W.length;i++){
      if(!W[i].iets){ lopend=0; continue; }
      if(test(W[i])){ lopend++; if(lopend>beste) beste=lopend; } else lopend=0;
    }
    return beste;
  };
  const trekOk = v => v.duw>0 && v.trek/v.duw >= 0.5;
  const nuTrek = W[0] && W[0].duw ? Math.round(W[0].trek/W[0].duw*100) : 0;
  const platform = reeks(trekOk);
  const programma = reeks(v=>v.dagen>=2 && v.dagen<=3);
  const rirReeks = reeks(v=>v.dagen>0 && v.rirDagen===v.dagen);
  const tweeTaken = W.some(v=>v.zwaar>=1 && v.volume>=1);

  // Teruggeschakeld: een volle week met minder dan de helft van je gewone
  // zware sets, direct na een week die daar juist boven zat.
  const gem = W.slice(0,8).reduce((a,v)=>a+v.zware,0)/Math.max(1,Math.min(8,W.length));
  let terug=false;
  for(let i=1;i<W.length-1;i++)
    if(W[i].iets && gem>=3 && W[i].zware < gem*0.5 && W[i+1].zware >= gem) terug=true;

  const lijst=[
    {id:"werkgewicht", naam:"Werkgewicht op de eerste trede",
     wat:`3 of meer herhalingen op ${nf(eersteTrede)} kg`,
     behaald:!!werkDatum, datum:werkDatum,
     stand: werkDatum ? "" : `je zwaarste werkset staat nu lager`},
    {id:"platform4", naam:"Platform",
     wat:"4 volle weken op rij minstens 50% treksets",
     behaald:platform>=4, datum:"",
     stand: platform>=4 ? "" : `je beste reeks is ${platform} ${platform===1?"week":"weken"} — deze week sta je op ${nuTrek}%`},
    {id:"fundament8", naam:"Fundament",
     wat:"8 volle weken op rij minstens 50% treksets",
     behaald:platform>=8, datum:"",
     stand: platform>=8 ? "" : `je beste reeks is ${platform} ${platform===1?"week":"weken"}`},
    {id:"tweetaken", naam:"Twee taken",
     wat:`een zware én een volumedag ${esc(ex.name.toLowerCase())} in dezelfde week`,
     behaald:tweeTaken, datum:"",
     stand: tweeTaken ? "" : "je draait vrijwel alles zwaar"},
    {id:"programma4", naam:"Vier weken programma",
     wat:`4 volle weken op rij 2 of 3 keer ${esc(ex.name.toLowerCase())}`,
     behaald:programma>=4, datum:"",
     stand: programma>=4 ? "" : `je beste reeks is ${programma} ${programma===1?"week":"weken"}`},
    {id:"rir4", naam:"In de tank",
     wat:"4 volle weken op rij RIR ingevuld bij elke sessie",
     behaald:rirReeks>=4, datum:"",
     stand: rirReeks>=4 ? "" : `je beste reeks is ${rirReeks} ${rirReeks===1?"week":"weken"}`},
    {id:"teruggeschakeld", naam:"Teruggeschakeld",
     wat:"een week terugschakelen na een zware week",
     behaald:terug, datum:"",
     stand: terug ? "" : "nog geen rustige week na een zware"}
  ];

  const treden=[];
  if(doelKg) for(let k=eersteTrede;k<=doelKg+0.001;k+=stap) treden.push(Math.round(k*10)/10);

  return {focus:f, doelKg, treden, topKg, topDatum, lijst,
          behaald:lijst.filter(m=>m.behaald), open:lijst.filter(m=>!m.behaald)};
}

/* Wat heb je net verdiend en nog niet gezien? */
function nieuweMijlpalen(extra){
  const m=mijlpalen(extra); if(!m) return [];
  const g=mijlpaalGezien();
  const nieuw=m.behaald.filter(x=>g.indexOf(x.id)<0);
  // treden tellen ook mee, elk met hun eigen sleutel
  for(const t of m.treden)
    if(m.topKg>=t && g.indexOf("trede"+t)<0)
      nieuw.push({id:"trede"+t, naam:`${nf(t)} kg`, wat:`een nieuwe trede op weg naar ${nf(m.doelKg)} kg`, behaald:true, datum:m.topDatum, stand:""});
  return nieuw;
}
function mijlpalenGezienZetten(lijst){
  const g=mijlpaalGezien();
  for(const m of lijst) if(g.indexOf(m.id)<0) g.push(m.id);
  DB.save();
}

/* Je zwaarste set ooit bij deze oefening — een getal dat je écht getild hebt,
   geen schatting. Daar meten we je doel-1RM tegen af.                       */
function zwaarsteOoit(exId){
  const h=historyFor(exId);
  let w=0, r=0;
  for(const d of h) for(const s of d.sets){
    if(s.sec || !(s.w>0)) continue;
    if(s.w>w){ w=s.w; r=s.r||0; }
  }
  return w ? {w,r} : null;
}

/* Je record bij een oefening, in gewone taal: de zwaarste set die je ooit
   deed. Bij oefeningen op eigen lichaamsgewicht bestaat "zwaarst" niet, dus
   daar is het aantal herhalingen de maat. Geen geschat 1RM — dat getal heeft
   hij nooit willen zien. */
function recordTekst(exId, exclSessionId){
  const h=historyFor(exId,exclSessionId);
  const sets=[];
  for(const d of h) for(const s of d.sets) if(!s.sec) sets.push(s);
  if(!sets.length) return "";
  const zwaarst=Math.max(0,...sets.map(s=>s.w||0));
  if(!zwaarst){
    const meeste=Math.max(0,...sets.map(s=>s.r||0));
    return meeste ? `record ${meeste} herhalingen` : "";
  }
  // bij dat gewicht: de set met de meeste herhalingen
  const reps=Math.max(0,...sets.filter(s=>(s.w||0)>=zwaarst).map(s=>s.r||0));
  const bw=sets.some(s=>(s.w||0)===zwaarst && s.bw);
  return `record ${setTekst(zwaarst,reps,true,bw)}`;
}
/* Wat je vorige keer deed, kort genoeg om tussen twee sets te lezen. De hele
   rij uitschrijven werd acht setjes op één grijs regeltje — onleesbaar. */
function vorigeTekst(vorige){
  if(!vorige || !vorige.sets.length) return "eerste keer";
  const sets=vorige.sets.filter(s=>!s.sec);
  const n=vorige.sets.length;
  let top=null;
  for(const s of sets)
    if(!top || (s.w||0)>(top.w||0) || ((s.w||0)===(top.w||0) && (s.r||0)>(top.r||0))) top=s;
  const kop=`vorige: ${n} ${n===1?"set":"sets"}`;
  if(!top) return kop;
  // zonder gewicht is het aantal herhalingen de maat (dips, pull-ups, plank)
  if(!top.w){
    const meeste=Math.max(0,...sets.map(s=>s.r||0));
    return meeste ? `${kop}, meeste ${meeste} herhalingen` : kop;
  }
  return `${kop}, zwaarst ${setTekst(top.w,top.r,true,top.bw)}`;
}

/* Dezelfde test, maar met de geschiedenis er zelf bij gezocht */
function recordsVoor(exId, sets, exclSessionId){
  const h=historyFor(exId,exclSessionId);
  const eerder=[]; let maxSets=0;
  for(const d of h){
    const w=d.sets.filter(s=>!s.sec);
    if(w.length>maxSets) maxSets=w.length;
    eerder.push(...w);
  }
  return recordsUit(sets, eerder, maxSets);
}

/* De beste wérkset van een reeks: drie herhalingen of meer.

   Waarom dit onderscheid ertoe doet: een zware poging van één herhaling en een
   normale trainingsdag zijn twee verschillende dingen. Zet je ze op één lijn,
   dan duikt die lijn omlaag zodra je na een testdag weer gewoon traint — en
   dan lijkt het alsof je achteruitgaat terwijl er niets aan de hand is. */
function besteWerkset(sets){
  let b=null;
  for(const s of sets){
    if(s.sec || (s.r||0)<3 || !(s.w>0)) continue;
    const e=e1rm(s.w,s.r);
    if(!b || e>b.e1) b={e1:e, w:s.w, r:s.r, set:s};
  }
  return b;
}
/* Je beste set ooit per herhalingsaantal: 1 × 110, 3 × 100, 5 × 90, …
   Dat is het hele krachtprofiel in plaats van één getal, en bijna elke
   training zit er wel ergens tegenaan. */
function repMaxima(exId, exclSessionId){
  const h=historyFor(exId,exclSessionId);
  const beste={};
  for(const d of h) for(const s of d.sets){
    if(s.sec || !(s.w>0) || !(s.r>0) || s.r>15) continue;
    const r=s.r;
    if(!beste[r] || s.w>beste[r].w) beste[r]={w:s.w, datum:d.date};
  }
  return beste;
}

/* Records voor een oefening op basis van alle geschiedenis */
function prFor(exId,excludeSessionId){
  const h=historyFor(exId,excludeSessionId);
  let e1=0,zwaarst=0,reps=0,volSessie=0,e1Date=null;
  for(const d of h){
    const b=bestOf(d.sets);
    if(b.e1>e1){ e1=b.e1; e1Date=d.date; }
    for(const s of d.sets){ if(s.sec) continue;
      if((s.w||0)>zwaarst) zwaarst=s.w||0; if((s.r||0)>reps) reps=s.r||0; }
    if(b.vol>volSessie) volSessie=b.vol;
  }
  return {e1,zwaarst,reps,volSessie,e1Date,sessies:h.length};
}
function sessionStats(sess){
  let vol=0,sets=0,reps=0,kcal=0; const groepen={};
  for(const e of sess.entries){
    const ex=exById(e.exId); const gs=exGroepen(ex).length?exGroepen(ex):["?"];
    // Cardio telt niet mee in volume en werksets: daar staat minuten in het
    // gewichtsveld, en minuten × kilometers is geen kilo's.
    const isCardio = ex && ex.type==="cardio";
    for(const s of e.sets){
      if(!isWork(s)) continue;
      kcal += s.kcal||0;
      if(isCardio) continue;
      sets++;
      for(const g of gs) groepen[g]=(groepen[g]||0)+1;
      // Een set op tijd (plank, farmer's hold) telt in seconden. 40 seconden
      // × 24 kg is geen volume, dus die laten we hier buiten.
      if(s.sec) continue;
      reps+=s.r||0; vol+=(s.w||0)*(s.r||0);
    }
  }
  const dur = sess.start&&sess.end ? Math.round((sess.end-sess.start)/1000) : 0;
  return {vol,sets,reps,dur,kcal,groepen,oef:sess.entries.length};
}
function weekKey(dateStr){
  const d=dParse(dateStr); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
/* Werksets per spiergroep in een periode van N dagen terug */
function setsPerGroup(dagen,vanaf){
  const grens=addDays(vanaf||today(),-dagen);
  const out={};
  for(const s of DB.d.sessions){
    if(s.date<=grens || s.date>(vanaf||today())) continue;
    for(const e of s.entries){
      const ex=exById(e.exId); if(!ex) continue;
      const n=e.sets.filter(isWork).length;
      // Een set telt mee bij elke spiergroep die je bij de oefening hebt gezet.
      // Deze cijfers staan los van elkaar (geen totaal), dus dat telt niet dubbel.
      if(n) for(const g of exGroepen(ex)) out[g]=(out[g]||0)+n;
    }
  }
  return out;
}
function setsPerCat(dagen,vanaf){
  const grens=addDays(vanaf||today(),-dagen); const out={};
  for(const s of DB.d.sessions){
    if(s.date<=grens || s.date>(vanaf||today())) continue;
    for(const e of s.entries){
      const ex=exById(e.exId); if(!ex) continue;
      const n=e.sets.filter(isWork).length;
      if(n) for(const c of exCats(ex)) out[c]=(out[c]||0)+n;
    }
  }
  return out;
}

/* ---------- 7. Grafieken (canvas) -------------------------------------- */
const CV={
  css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); },
  prep(cv){
    const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
    cv.width=w*dpr; cv.height=h*dpr;
    const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,w,h); return {c,w,h};
  },
  line(cv,pts,opt={}){
    const {c,w,h}=this.prep(cv); if(pts.length===0) return;
    const acc=this.css("--accent"), line=this.css("--line"), ink3=this.css("--ink-3"), surf=this.css("--surface");
    const padL=38,padR=12,padT=14,padB=24;
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    let y0=Math.min(...ys), y1=Math.max(...ys);
    if(y1-y0<1){ y0-=1; y1+=1; }
    const m=(y1-y0)*0.15; y0-=m; y1+=m;
    const x0=Math.min(...xs), x1=Math.max(...xs);
    const X=v=>padL+(x1===x0?0.5:(v-x0)/(x1-x0))*(w-padL-padR);
    const Y=v=>padT+(1-(v-y0)/(y1-y0))*(h-padT-padB);
    // raster
    c.strokeStyle=line; c.lineWidth=1; c.font="10px "+this.css("--mono").split(",")[0]; c.fillStyle=ink3;
    for(let i=0;i<=3;i++){
      const v=y0+(y1-y0)*i/3, y=Math.round(Y(v))+0.5;
      c.beginPath(); c.moveTo(padL,y); c.lineTo(w-padR,y); c.stroke();
      // Bij een krachtlijn zetten we geen getallen langs de as: daar staat een
      // berekende waarde, geen gewicht dat hij echt heeft getild.
      if(!opt.geenY){
        c.textAlign="right"; c.textBaseline="middle";
        c.fillText(Math.round(v),padL-6,y);
      }
    }
    // vlak
    const grad=c.createLinearGradient(0,padT,0,h-padB);
    grad.addColorStop(0,acc+"44"); grad.addColorStop(1,acc+"05");
    c.beginPath(); c.moveTo(X(xs[0]),h-padB);
    pts.forEach(p=>c.lineTo(X(p.x),Y(p.y)));
    c.lineTo(X(xs[xs.length-1]),h-padB); c.closePath(); c.fillStyle=grad; c.fill();
    // lijn
    c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(X(p.x),Y(p.y)):c.moveTo(X(p.x),Y(p.y)));
    c.strokeStyle=acc; c.lineWidth=2.2; c.lineJoin="round"; c.lineCap="round"; c.stroke();
    // punten
    pts.forEach((p,i)=>{
      const last=i===pts.length-1;
      c.beginPath(); c.arc(X(p.x),Y(p.y),last?5:2.6,0,7);
      c.fillStyle=last?acc:surf; c.fill();
      if(!last){ c.strokeStyle=acc; c.lineWidth=1.6; c.stroke(); }
      else { c.strokeStyle=surf; c.lineWidth=2.4; c.stroke(); }
    });
    // as-labels
    c.fillStyle=ink3; c.textBaseline="top"; c.font="10px "+this.css("--sans").split(",")[0];
    c.textAlign="left";  c.fillText(opt.l0||"",padL,h-padB+6);
    c.textAlign="right"; c.fillText(opt.l1||"",w-padR,h-padB+6);
  },
  bars(cv,groups,keys,colors,opt={}){
    const {c,w,h}=this.prep(cv); if(!groups.length) return;
    const line=this.css("--line"), ink3=this.css("--ink-3");
    const padL=34,padR=8,padT=12,padB=22;
    const totals=groups.map(g=>keys.reduce((a,k)=>a+(g.v[k]||0),0));
    const max=Math.max(1,...totals)*1.12;
    const bw=(w-padL-padR)/groups.length;
    c.strokeStyle=line; c.lineWidth=1; c.fillStyle=ink3; c.font="10px "+this.css("--mono").split(",")[0];
    for(let i=0;i<=3;i++){
      const v=max*i/3, y=Math.round(padT+(1-i/3)*(h-padT-padB))+0.5;
      c.beginPath(); c.moveTo(padL,y); c.lineTo(w-padR,y); c.stroke();
      c.textAlign="right"; c.textBaseline="middle"; c.fillText(Math.round(v),padL-5,y);
    }
    groups.forEach((g,i)=>{
      let acc=0; const x=padL+i*bw+bw*0.18, bwid=bw*0.64;
      keys.forEach((k,ki)=>{
        const v=g.v[k]||0; if(!v) return;
        const hh=(v/max)*(h-padT-padB);
        const y=padT+(h-padT-padB)-((acc+v)/max)*(h-padT-padB);
        c.fillStyle=colors[ki]; c.fillRect(x,y,bwid,hh); acc+=v;
      });
      c.fillStyle=ink3; c.textAlign="center"; c.textBaseline="top";
      c.font="9.5px "+this.css("--sans").split(",")[0];
      c.fillText(g.label,x+bwid/2,h-padB+5);
    });
  }
};
