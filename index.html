    const body=soortVan(a)==="body";
    Sheet.open("Workout afronden",`
      <div class="tiles">
        <div class="tile"><div class="k">Duur</div><div class="v">${hhmm(Math.round((Date.now()-a.start)/1000))}</div><div class="u">&nbsp;</div></div>
        ${body?`<div class="tile"><div class="k">Oefeningen</div><div class="v">${st.oef}</div><div class="u">in het rijtje</div></div>`
              :`<div class="tile"><div class="k">Volume</div><div class="v">${kf(st.vol)}</div><div class="u">kg</div></div>`}
        <div class="tile"><div class="k">${body?"Rondes":"Sets"}</div><div class="v">${st.sets}</div><div class="u">${body?"afgevinkt":"werksets"}</div></div>
        <div class="tile"><div class="k">Reps</div><div class="v">${st.reps}</div><div class="u">totaal</div></div>
      </div>
      <div class="card${prs.length?" pr-pop":""}">
        <div class="card-head"><div class="card-title">Zo ging het</div>
          ${prs.length?`<span class="chip pr">${prs.length}× PR</span>`:""}</div>
        <div style="padding:13px 14px 15px;display:flex;flex-direction:column;gap:9px">
          ${this.samenvatting(a).map(z=>`<p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">${z}</p>`).join("")}
        </div>
      </div>
      ${(()=>{
        // Mijlpalen rekenen over je logboek, en deze training staat daar nog
        // niet in — dus geven we hem mee. Markeren als gezien gebeurt pas bij
        // opslaan, zodat een afgebroken afronding er geen opmaakt.
        const nw=nieuweMijlpalen(a);
        if(!nw.length) return "";
        return `<div class="card pr-pop">
          <div class="card-head"><div class="card-title">Mijlpaal</div>
            <span class="chip acc">${nw.length>1?nw.length+" nieuw":"nieuw"}</span></div>
          <div style="padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px">
            ${nw.map(x=>`<p style="font-size:14.5px;line-height:1.5;color:var(--ink)">
              <b>${esc(x.naam)}</b> — <span style="color:var(--ink-2)">${x.wat}</span></p>`).join("")}
          </div></div>`;
      })()}
      <div class="field"><label>Naam van deze workout</label>
        <input class="ctrl" id="fName" value="${esc(a.name)}"></div>
      <div class="field"><label>Notitie</label>
        <textarea class="ctrl" id="fNote" style="min-height:70px" placeholder="Hoe ging het?">${esc(a.notes||"")}</textarea></div>
      <div class="hr"></div>
      <div class="sec-label">Voor Strava</div>
      <button class="btn primary wide" type="button" onclick="Train.kopieerStrava()">Hele samenvatting kopiëren</button>
      <p class="mut" style="margin:-2px 0 6px">Eén tik en alles staat op je klembord. Plak het in de
        omschrijving van je Strava-activiteit.</p>
      <textarea class="ctrl" id="fStrava" style="min-height:190px;font-size:12.5px;line-height:1.5"
        readonly>${esc(this.stravaTekst(a))}</textarea>
      <button class="btn primary lg wide" type="button" onclick="Train.save()">Opslaan</button>`);
  },

  /* ---- De tekst die hij in Strava plakt ----------------------------------
     Platte tekst, geen opmaak: Strava doet niets met vetgedrukt of met
     opsommingstekens. Per oefening al zijn sets, met tussen haakjes wat hij
     de vorige keer deed, zodat hij in één oogopslag ziet of hij vooruit is
     gegaan. Onderaan de vergelijking met zijn vorige workouts.            */
  stravaTekst(a){
    const st=sessionStats(a);
    const sec=Math.round((Date.now()-a.start)/1000);
    const body=soortVan(a)==="body";
    const r=[];
    r.push(`${Log.groepNaam(a)} · ${hhmm(sec)}`);
    r.push("");

    /* Eén set in woorden. Een set op tijd is geen "45 × BW" maar 45 seconden,
       en bij louter kilo's zetten we de eenheid één keer achteraan in plaats
       van achter elke set. */
    const setTxt=s=>{
      if(s.sec) return `${s.r} sec${s.w?` × ${nf(s.w)} kg`:""}`;
      return setTekst(s.w,s.r,true,s.bw);
    };
    /* Dezelfde set drie keer achter elkaar schrijven we als "3 × 80 (3×)".
       Zonder dat werd één oefening een regel van drie regels in Strava. */
    const reeks=sets=>{
      const groepen=[];
      for(const s of sets){
        const t=setTxt(s), laatste=groepen[groepen.length-1];
        if(laatste && laatste.t===t) laatste.n++; else groepen.push({t,n:1});
      }
      // De eenheid staat achter elke groep en de herhaling erachter: dan leest
      // "8 × 24 kg (3×)" als één ding, in plaats van twee keer een maalteken
      // die verschillende dingen betekenen.
      return groepen.map(g=>g.n>1?`${g.t} (${g.n}×)`:g.t).join(", ");
    };
    /* Hoeveel werk zat er in een oefening? Kilo's maal herhalingen, en bij
       oefeningen zonder gewicht de herhalingen zelf. Op dit cijfer vergelijken
       we met de vorige keer — níét op de zwaarste set. Anders staat er een
       pijl omlaag zodra je na één zware single een keer zes nette sets doet,
       en dat is precies andersom. */
    const werk=sets=>{
      const v=sets.reduce((a,s)=>a+(s.sec?0:(s.w||0)*(s.r||0)),0);
      return {vol:v, reps:sets.reduce((a,s)=>a+(s.sec?0:(s.r||0)),0)};
    };

    for(const e of a.entries){
      const w=e.sets.filter(isWork); if(!w.length) continue;
      const h=historyFor(e.exId,a.id);
      const vorige=h[h.length-1];
      // Een record zegt alles; dan hoeft er geen pijl meer bij. "↓ PR" op één
      // regel leest alsof je tegelijk achteruit en vooruit ging.
      let merk="";
      if(recordsVoor(e.exId,e.sets,a.id).length) merk=" ⭐";
      else if(!vorige) merk=" (nieuw)";
      else {
        const nuW=werk(w), oudW=werk(vorige.sets);
        const nu = (nuW.vol&&oudW.vol) ? nuW.vol : nuW.reps;
        const oud= (nuW.vol&&oudW.vol) ? oudW.vol : oudW.reps;
        if(oud>0){
          if(nu>=oud*1.05) merk=" ↑";
          else if(nu<=oud*0.95) merk=" ↓";
        }
      }
      r.push(`${exName(e.exId)}: ${reeks(w)}${merk}`);
    }

    r.push("");
    const regel=[`${st.sets} ${body?"rondes":"werksets"}`];
    if(!body && st.vol) regel.push(`${nf(Math.round(st.vol))} kg totaal`);
    if(st.reps) regel.push(`${st.reps} herhalingen`);
    r.push(regel.join(" · "));

    // records van vandaag
    const prs=[];
    for(const e of a.entries){
      for(const rec of recordsVoor(e.exId,e.sets,a.id))
        prs.push(`${exName(e.exId)} — ${rec.kort||rec.tekst}`);
    }
    // Elk record op een eigen regel: op één regel liep het in Strava over
    // vier regels door en was er geen beginnen aan.
    if(prs.length){
      r.push("");
      r.push(prs.length===1?"⭐ Record":"⭐ Records");
      for(const p of prs) r.push(p);
    }

    // en hoe deze workout zich verhoudt tot de vorige
    const v=Inspanning.vergelijk(a);
    if(v){
      const p=v.index-100;
      r.push("");
      r.push(Math.abs(p)<5
        ? `Even zwaar als mijn vorige ${v.basis} ${v.woord}.`
        : `${Math.abs(p)}% ${p>0?"zwaarder":"lichter"} dan mijn vorige ${v.basis} ${v.woord}.`);
    }
    return r.join("\n");
  },
  /* Alles in één tik naar je klembord. Eerst de moderne manier — die werkt op
     iOS het betrouwbaarst — en lukt dat niet, dan de oude truc met selecteren.
     Allebei mislukt? Dan staat de tekst in elk geval geselecteerd, zodat je
     alleen nog op Kopiëren hoeft te tikken. */
  kopieerStrava(){ kopieerVeld("#fStrava","Gekopieerd — plak het in Strava"); },

  save(){
    const a=DB.d.active;
    a.name=$("#fName").value.trim()||"Training";
    a.notes=$("#fNote").value.trim();
    a.end=Date.now();
    // Bij een bodyworkout telt de stopwatch, niet de tijd sinds je hem aanmaakte
    if(a.soort==="body"){ const sec=Klok.verstreken(); a.start=a.end-sec*1000; }
    // Hartslag en calorieën worden hier niet meer gevraagd: die staan al in
    // Strava. Oude trainingen die ze wél hebben, houden ze gewoon.
    a.entries=a.entries.filter(e=>e.sets.some(s=>s.done));
    a.entries.forEach(e=>e.sets=e.sets.filter(s=>s.done));

    // De samenvatting bij de workout bewaren, zodat je hem later kunt teruglezen.
    // Pas hier berekend: nu staan alleen de sets erin die je echt hebt afgevinkt.
    const tekst=this.samenvatting(a).map(z=>z.replace(/<[^>]+>/g,"")).join("\n");
    a.notes=[a.notes,tekst].filter(Boolean).join("\n\n");

    DB.d.sessions.push(a);
    if(a.routineId){ const r=DB.d.routines.find(x=>x.id===a.routineId); if(r) r.last=a.date; }
    // Nu de training in je logboek staat, tellen de mijlpalen hem mee. Pas hier
    // afvinken: een afronding die je afbreekt mag er geen opmaken.
    mijlpalenGezienZetten(nieuweMijlpalen());
    DB.d.active=null; DB.save(); Sheet.close();
    clearInterval(this._iv); Klok.uit(); Interval.stop();
    toast("Workout opgeslagen"); go("log");
  }
};

/* ---------- Oefening kiezen -------------------------------------------- */
const ExPicker={
  cb:null,q:"",groep:"",
  open(cb){ this.cb=cb; this.q=""; this.groep="";
    Sheet.open("Oefening kiezen",`
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="exQ" placeholder="Zoek oefening…" oninput="ExPicker.filter(this.value)" autocomplete="off"></div>
      <div class="row wrap" id="exGroeps"></div>
      <div id="exList"></div>
      <button class="btn ghost wide" type="button" onclick="Meer.exNew(ExPicker.cb)">+ Nieuwe oefening maken</button>`,
      ()=>{ this.groepsBar(); this.list(); });
  },
  groepsBar(){
    $("#exGroeps").innerHTML=[["","Alles"],...GROEPEN.map(g=>[g,g])]
      .map(([k,l])=>`<button class="btn sm ${this.groep===k?"primary":"ghost"}" type="button" onclick="ExPicker.setGroep('${k}')">${l}</button>`).join("");
  },
  setGroep(g){ this.groep=g; this.groepsBar(); this.list(); },
  filter(v){ this.q=v.toLowerCase(); this.list(); },
  list(){
    // recent gebruikte oefeningen bovenaan
    const recent=[];
    for(const s of allSessions().slice(0,12)) for(const e of s.entries) if(!recent.includes(e.exId)) recent.push(e.exId);
    let ex=DB.d.exercises.filter(e=>!e.arch);
    if(this.groep) ex=ex.filter(e=>heeftGroep(e,this.groep));
    if(this.q) ex=ex.filter(e=>e.name.toLowerCase().includes(this.q));
    ex.sort((a,b)=>{
      const ra=recent.indexOf(a.id), rb=recent.indexOf(b.id);
      if(ra!==rb) return (ra<0?999:ra)-(rb<0?999:rb);
      return a.name.localeCompare(b.name);
    });
    $("#exList").innerHTML= ex.length? `<div class="list">`+ex.slice(0,60).map(e=>{
      const h=historyFor(e.id); const last=h[h.length-1];
      return `<button class="li" type="button" onclick="ExPicker.pick('${e.id}')">
        <div class="li-main"><b>${esc(e.name)}</b><span>${esc(exGroepen(e).join(" · "))}${last?" · "+relDate(last.date):""}</span></div>
        ${recent.indexOf(e.id)>-1?`<span class="chip acc">recent</span>`:""}</button>`;
    }).join("")+`</div>` : `<p class="mut" style="padding:14px 2px">Niets gevonden. Maak hem hieronder aan.</p>`;
  },
  pick(id){ const cb=this.cb; if(cb) cb(id); }
};

/* ============================================================================
   LOGBOEK
   ============================================================================ */
const Log={
  render(V){
    this.bewerk=false;                       // bewerkstand niet meeslepen naar de lijst
    const ss=allSessions();
    const nBody=ss.filter(s=>soortVan(s)==="body").length;
    head("Logboek", ss.length
      ? `${ss.length} workouts${nBody?` · ${ss.length-nBody} gym, ${nBody} body`:""} · sinds ${dShort(ss[ss.length-1].date)}`
      : "");
    if(!ss.length){
      V.innerHTML=`<div class="card"><div class="empty"><div class="big">Nog niets gelogd</div>
        <p>Start je eerste training, of haal je bestaande logboek uit Excel of Notities binnen via Meer → Importeren.</p></div></div>`;
      return;
    }
    const groepen=new Map();
    ss.forEach(s=>{ const k=s.date.slice(0,7); if(!groepen.has(k)) groepen.set(k,[]); groepen.get(k).push(s); });

    V.innerHTML=`
      ${this.frequentieKaart()}
      ${(()=>{
        const prs=Inspanning.prPerSessie();
        return [...groepen].map(([k,list])=>{
          const [y,m]=k.split("-");
          return `<div class="sec-label">${MNDL[+m-1]} ${y} · ${list.length} ${list.length===1?"training":"trainingen"}</div>
          <div class="list">`+list.map(s=>{
            const st=sessionStats(s);
            const top=this.hoofdoefening(s);
            const titel=this.groepNaam(s);
            // Een eigen naam als "Push A" blijft zichtbaar; "Training" en
            // "Geïmporteerd" zeggen niets en laten we weg.
            const vaag=/^(training|ge[iï]mporteerd|workout)$/i.test((s.name||"").trim());
            const eigenNaam = vaag ? "" : (s.name||"");
            const records=prs[s.id]||0;
            // Gym of body meteen zichtbaar: een circuit van 20 minuten en een
            // uur bankdrukken staan anders door elkaar zonder dat je het ziet.
            const srt=soortVan(s);
            return `<button class="li" type="button" onclick="go('sessie','${s.id}')">
              <div class="li-main"><b>${esc(titel)}</b>
                <span>${dShort(s.date)}${eigenNaam?" · "+esc(eigenNaam):""} · ${st.oef} ${st.oef===1?"oefening":"oefeningen"} · ${st.sets} ${srt==="body"?"rondes":"sets"}</span>
                ${top&&top.w?`<span class="num" style="color:var(--ink-2);font-size:12.5px">zwaarst: ${esc(top.naam)} ${setTekst(top.w,top.r,true)}</span>`:""}
              </div>
              <span class="chip ${srt==="body"?"acc":""}">${SOORTNAAM[srt]}</span>
              ${records?`<span class="chip pr">${records>1?records+"× ":""}PR</span>`:""}
              <div class="chev"></div></button>`;
          }).join("")+`</div>`;
        }).join("");
      })()}`;
  },

  /* ---- Hoe vaak train je? ------------------------------------------------
     Hier stond een kalender met gekleurde blokjes per dag. Mooi, maar hij zei
     niets: je kon er op een telefoon niet eens op tikken om de datum te zien.
     Nu staan er twee getallen die je meteen snapt — deze vier weken tegenover
     de vier daarvoor — met de losse weken eronder zodat je ziet waar de gaten
     vallen. De week die nu loopt telt niet mee in het gemiddelde: die is nog
     niet af en zou je cijfer omlaag trekken.                                */
  frequentie(){
    const per=[];
    for(let i=8;i>=0;i--) per.push({week:weekKey(addDays(today(),-i*7)), gym:0, body:0});
    const idx=new Map(per.map((w,i)=>[w.week,i]));
    for(const s of DB.d.sessions){
      const i=idx.get(weekKey(s.date));
      if(i!==undefined) per[i][soortVan(s)]++;
    }
    const af=per.slice(0,8);                       // de acht afgeronde weken
    const som=a=>a.reduce((x,w)=>x+w.gym+w.body,0);
    return {per, nu:som(af.slice(4))/4, ervoor:som(af.slice(0,4))/4};
  },
  frequentieKaart(){
    const f=this.frequentie();
    const max=Math.max(1,...f.per.map(w=>w.gym+w.body));
    const een=n=>n.toLocaleString("nl-NL",{minimumFractionDigits:1,maximumFractionDigits:1});
    const verschil=f.nu-f.ervoor;
    const chip = Math.abs(verschil)<0.25 ? {k:"",     t:"gelijk"}
               : verschil>0             ? {k:"good", t:"vaker"}
                                        : {k:"warn", t:"minder vaak"};
    let zin;
    if(!f.nu && !f.ervoor) zin="Je hebt de afgelopen acht weken niets gelogd.";
    else if(!f.ervoor)     zin=`Je traint <b class="num" style="color:var(--ink)">${een(f.nu)}×</b> per week. In de vier weken daarvóór stond er niets in je logboek.`;
    else zin=`Je traint <b class="num" style="color:var(--ink)">${een(f.nu)}×</b> per week over de laatste vier weken, tegen <b class="num" style="color:var(--ink)">${een(f.ervoor)}×</b> in de vier weken daarvoor.`;

    const heeftBody=f.per.some(w=>w.body>0);
    const H=64;                                    // hoogte van de hoogste balk
    const kolommen=f.per.map((w,i)=>{
      const n=w.gym+w.body, nu=(i===f.per.length-1);
      const hg=w.gym ?Math.max(4,Math.round(w.gym /max*H)):0;
      const hb=w.body?Math.max(4,Math.round(w.body/max*H)):0;
      const d=dParse(w.week);
      return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px${nu?";opacity:.6":""}">
        <span class="num" style="font-size:11px;color:var(--ink-3)">${n||"–"}</span>
        <div style="width:100%;height:${H}px;display:flex;flex-direction:column;justify-content:flex-end">
          ${hb?`<i style="display:block;height:${hb}px;background:var(--good);border-radius:4px 4px 0 0"></i>`:""}
          ${hg?`<i style="display:block;height:${hg}px;background:var(--accent);border-radius:${hb?"0":"4px 4px"} 0 0"></i>`:""}
          ${n?"":`<i style="display:block;height:3px;background:var(--surface-3);border-radius:2px"></i>`}
        </div>
        <span style="font-size:10px;color:var(--ink-3);white-space:nowrap">${nu?"nu":d.getDate()+"/"+(d.getMonth()+1)}</span>
      </div>`;
    }).join("");

    return `
      <div class="card">
        <div class="card-head"><div class="card-title">Hoe vaak train je</div>
          <span class="chip ${chip.k}">${chip.t}</span></div>
        <div style="padding:13px 14px 2px">
          <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">${zin}</p></div>
        <div style="padding:10px 14px 4px;display:flex;align-items:flex-end;gap:5px">${kolommen}</div>
        <div style="padding:2px 14px 13px">
          <p class="mut" style="font-size:12px">Workouts per week. ${heeftBody?`Turquoise is gym, groen is body. `:""}De week die nu loopt telt nog niet mee in de vergelijking.</p></div>
      </div>`;
  },

  /* Waar ging deze workout over? De spiergroepen met de meeste werksets,
     want "Borst & Triceps" zegt meer dan "Geïmporteerd". */
  spiergroepen(s){
    const tel={};
    for(const e of s.entries){
      const ex=exById(e.exId); if(!ex) continue;
      const n=e.sets.filter(isWork).length; if(!n) continue;
      // De hoofdgroep telt vol mee, een bijgroep half: anders heet elke
      // borstsessie ineens "Borst & Triceps" omdat de triceps meedoen.
      exGroepen(ex).forEach((g,i)=>{
        if(g==="Cardio") return;
        tel[g]=(tel[g]||0)+(i===0?n:n/2);
      });
    }
    return Object.entries(tel).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  },
  groepNaam(s){
    const g=this.spiergroepen(s);
    if(!g.length){
      // alleen cardio gedaan? dan die naam gebruiken
      const c=s.entries.map(e=>exById(e.exId)).find(x=>x&&x.groep==="Cardio");
      return c?c.name:"Workout";
    }
    if(g.length<=2) return g.join(" & ");
    return g.slice(0,2).join(" & ")+" +"+(g.length-2);
  },

  /* De zwaarste oefening van een training, op geschat 1RM. Dat is wat je
     herkent als je terugkijkt — veel meer dan een totaal aantal kilo's. */
  hoofdoefening(s){
    let best=null;
    for(const e of s.entries){
      const w=e.sets.filter(isWork);
      if(!w.length) continue;
      const b=bestOf(w);
      if(!best || b.e1>best.e1) best={naam:exName(e.exId), e1:b.e1, w:b.w, r:b.r};
    }
    return best;
  },

  detail(V,id){
    const s=DB.d.sessions.find(x=>x.id===id);
    if(!s){ go("log"); return; }
    const st=sessionStats(s);
    const b=this.bewerk;
    head(this.groepNaam(s),`${SOORTNAAM[soortVan(s)]} · ${dLong(s.date)}`,
      `<div style="display:flex;gap:6px">
         <button class="btn sm ghost" type="button" onclick="go('log')">Terug</button>
         <button class="btn sm ${b?"primary":""}" type="button" onclick="Log.togBewerk()">${b?"Klaar":"Bewerk"}</button>
       </div>`);
    // Bij een bodyworkout draait alles om rondes en tijd; een volumetegel van
    // 0 kg zegt daar niets, dus die laten we weg.
    const body=soortVan(s)==="body";
    V.innerHTML=`
      <div class="tiles">
        ${body?`<div class="tile"><div class="k">Oefeningen</div><div class="v">${st.oef}</div><div class="u">in het rijtje</div></div>`
              :`<div class="tile"><div class="k">Volume</div><div class="v">${kf(st.vol)}</div><div class="u">kg</div></div>`}
        <div class="tile"><div class="k">${body?"Rondes":"Sets"}</div><div class="v">${st.sets}</div><div class="u">${body?"afgevinkt":"werksets"}</div></div>
        <div class="tile"><div class="k">Reps</div><div class="v">${st.reps}</div><div class="u">totaal</div></div>
        <div class="tile"><div class="k">Duur</div><div class="v">${st.dur?hhmm(st.dur):"–"}</div><div class="u">&nbsp;</div></div>
      </div>
      ${(s.hr&&(s.hr.gem||s.hr.max))||s.kcal?`
      <div class="tiles">
        ${s.hr&&s.hr.gem?`<div class="tile"><div class="k">Hartslag</div><div class="v">${s.hr.gem}</div><div class="u">gemiddeld</div></div>`:""}
        ${s.hr&&s.hr.max?`<div class="tile"><div class="k">Piek</div><div class="v">${s.hr.max}</div><div class="u">slagen/min</div></div>`:""}
        ${s.kcal?`<div class="tile"><div class="k">Verbrand</div><div class="v">${s.kcal}</div><div class="u">kcal</div></div>`:""}
      </div>`:""}
      ${Inspanning.kaart(s)}
      ${s.notes?`<div class="card card-pad"><p style="font-size:14.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap">${esc(s.notes)}</p></div>`:""}
      ${s.entries.map((e,i)=>{
        const ex=exById(e.exId)||{name:"?",groep:"?"};
        return `<div class="ex">
          <div class="ex-head"><div class="ex-name"><b>${esc(ex.name)}</b>
            <div class="ex-meta"><span class="chip">${esc(exGroepen(ex).join(" · ")||"?")}</span>${e.note?`<span class="prev-hint">${esc(e.note)}</span>`:""}</div></div>
            <button class="ex-more" type="button" onclick="${b?`Log.exMenu('${s.id}',${i})`:`go('oefening','${e.exId}')`}"
              aria-label="${b?"Opties":"Voortgang"}">${b?"⋯":"→"}</button></div>
          <div class="setgrid head drie"><span>${body?"Ronde":"Set"}</span>
            <span>${e.sets.length&&e.sets.every(x=>x.sec)?"Sec":"Reps"}</span><span>Kg</span></div>
          ${e.sets.map((x,j)=>{
            const nr=e.sets.slice(0,j+1).filter(y=>y.t!=="warmup").length;
            const kleur=x.t==="warmup"?"warmup":x.t==="drop"?"drop":x.t==="fail"?"fail":"";
            const label=x.t==="warmup"?"W":x.t==="drop"?"D":x.t==="fail"?"F":nr;
            return `<div class="setgrid setrow drie">
              ${b?`<button class="setno ${kleur}" type="button" onclick="Log.setMenu('${s.id}',${i},${j})">${label}</button>`
                 :`<span class="setno ${kleur}">${label}</span>`}
              ${b?`<input class="inp num" inputmode="numeric" value="${x.r??""}" aria-label="Herhalingen"
                     onchange="Log.zet('${s.id}',${i},${j},'r',this.value)">`
                 :`<span class="num" style="text-align:center;font-size:16px;font-weight:650">${x.r??"–"}${x.sec?"s":""}</span>`}
              ${b?`<input class="inp num" inputmode="decimal" value="${x.w??""}" aria-label="Gewicht"
                     onchange="Log.zet('${s.id}',${i},${j},'w',this.value)">`
                 :`<span class="num" style="text-align:center;font-size:16px;font-weight:650">${x.bw?(x.w?"BW+"+nf(x.w):"BW"):(x.w!=null?nf(x.w):"–")}</span>`}
            </div>`;
          }).join("")}
          ${b?`<div class="ex-foot">
                 <button class="btn sm wide" type="button" onclick="Log.addSet('${s.id}',${i})">+ Set</button>
                 <button class="btn sm ghost" type="button" onclick="Log.addSet('${s.id}',${i},'warmup')">+ Opwarm</button>
               </div>`:""}
        </div>`;
      }).join("")}
      ${b?`
        <button class="btn wide" type="button" onclick="Log.addEx('${s.id}')">+ Oefening toevoegen</button>
        <button class="btn ghost wide" type="button" onclick="Log.meta('${s.id}')">Naam, datum en notitie</button>
        <button class="btn danger wide" type="button" onclick="Log.del('${s.id}')">Workout verwijderen</button>`
      :`<div class="row">
        <button class="btn ghost wide" type="button" onclick="Train.repeat('${s.id}');go('train')">Herhalen</button>
        <button class="btn danger wide" type="button" onclick="Log.del('${s.id}')">Verwijderen</button>
      </div>`}`;
  },

  /* ---- Bewerken van een opgeslagen training -------------------------------
     Alles schrijft rechtstreeks in de bewaarde training. Bewust géén render()
     na het typen van een getal: dat zou de focus uit het veld gooien terwijl
     je nog van gewicht naar herhalingen springt.                            */
  bewerk:false,
  togBewerk(){ this.bewerk=!this.bewerk; render(); },
  vind(id){ return DB.d.sessions.find(x=>x.id===id); },

  zet(id,i,j,veld,waarde){
    const s=this.vind(id); if(!s) return;
    const set=s.entries[i].sets[j];
    const v=String(waarde).replace(",",".").trim();
    set[veld]= v==="" ? null : (veld==="r" ? (parseInt(v,10)||null) : (parseFloat(v)||null));
    DB.save();
  },
  setMenu(id,i,j){
    const set=this.vind(id).entries[i].sets[j];
    const opt=[["work","Werkset"],["warmup","Opwarmset"],["drop","Dropset"],["fail","Tot falen"]];
    Sheet.open("Set aanpassen",`
      <div class="seg">${opt.map(([k,l])=>
        `<button type="button" class="${set.t===k?"on":""}" onclick="Log.setType('${id}',${i},${j},'${k}')">${l}</button>`).join("")}</div>
      <button class="btn danger wide" type="button" onclick="Log.delSet('${id}',${i},${j})">Set verwijderen</button>`);
  },
  setType(id,i,j,t){ this.vind(id).entries[i].sets[j].t=t; DB.save(); Sheet.close(); render(); },
  delSet(id,i,j){
    const s=this.vind(id);
    s.entries[i].sets.splice(j,1);
    if(!s.entries[i].sets.length) s.entries.splice(i,1);
    DB.save(); Sheet.close(); render(); toast("Set verwijderd");
  },
  addSet(id,i,type){
    const e=this.vind(id).entries[i];
    const laatste=e.sets[e.sets.length-1];
    e.sets.push({w:type==="warmup"?null:(laatste?laatste.w:null),
                 r:type==="warmup"?null:(laatste?laatste.r:null),
                 rpe:null,t:type||"work",done:true});
    DB.save(); render();
  },
  exMenu(id,i){
    const e=this.vind(id).entries[i];
    Sheet.open(exName(e.exId),`
      <div class="row">
        <button class="btn ghost wide" type="button" onclick="Log.move('${id}',${i},-1)">↑ Omhoog</button>
        <button class="btn ghost wide" type="button" onclick="Log.move('${id}',${i},1)">↓ Omlaag</button>
      </div>
      <button class="btn wide" type="button" onclick="Sheet.close();go('oefening','${e.exId}')">Voortgang bekijken</button>
      <button class="btn danger wide" type="button" onclick="Log.delEx('${id}',${i})">Oefening verwijderen</button>`);
  },
  move(id,i,d){
    const a=this.vind(id).entries, j=i+d;
    if(j<0||j>=a.length) return;
    [a[i],a[j]]=[a[j],a[i]]; DB.save(); Sheet.close(); render();
  },
  delEx(id,i){ this.vind(id).entries.splice(i,1); DB.save(); Sheet.close(); render(); toast("Oefening verwijderd"); },
  addEx(id){
    ExPicker.open(exId=>{
      this.vind(id).entries.push({exId,note:"",rest:null,
        sets:[{w:null,r:null,rpe:null,t:"work",done:true}]});
      DB.save(); Sheet.close(); render();
    });
  },
  meta(id){
    const s=this.vind(id);
    Sheet.open("Workout aanpassen",`
      <div class="field"><label>Naam</label>
        <input class="ctrl" id="mNaam" value="${esc(s.name||"")}"></div>
      <div class="field"><label>Datum</label>
        <input class="ctrl" id="mDat" type="date" value="${s.date}"></div>
      <div class="field"><label>Notitie</label>
        <textarea class="ctrl" id="mNote" style="min-height:80px">${esc(s.notes||"")}</textarea></div>
      <button class="btn primary wide" type="button" onclick="Log.metaSave('${id}')">Opslaan</button>`);
  },
  metaSave(id){
    const s=this.vind(id);
    s.name=$("#mNaam").value.trim()||"Training";
    s.date=$("#mDat").value||s.date;
    s.notes=$("#mNote").value.trim();
    DB.save(); Sheet.close(); render(); toast("Opgeslagen");
  },
  async del(id){
    if(await ask("Workout verwijderen?","Dit kan niet ongedaan worden gemaakt.","Verwijderen",true)){
      DB.d.sessions=DB.d.sessions.filter(x=>x.id!==id); DB.save(); go("log"); toast("Verwijderd");
    }
  }
};

/* ============================================================================
   VOORTGANG
   ============================================================================ */
const Prog={
  /* Mijlpalen: de ladder naar je doel, dan wat je hebt, dan wat er nog ligt.
     Bij wat nog niet behaald is staat altijd hoe ver je bent — een gesloten
     slotje zonder getal zegt je niets. */
  mijlpalenScherm(V){
    const m=mijlpalen();
    if(!m){ head("Mijlpalen","",`<button class="btn sm ghost" type="button" onclick="go('prog')">Terug</button>`);
      V.innerHTML=`<div class="card"><div class="empty"><p>Nog te weinig gelogd. Zodra je een oefening
        twaalf weken lang regelmatig zwaar doet, verschijnen hier je mijlpalen.</p></div></div>`; return; }
    const tredenGehaald=m.treden.filter(t=>m.topKg>=t).length;
    const totaal=m.behaald.length+tredenGehaald;
    head("Mijlpalen",`${totaal} behaald · ${m.open.length} te gaan`,
      `<button class="btn sm ghost" type="button" onclick="go('prog')">Terug</button>`);

    const volgende=m.treden.filter(t=>m.topKg<t)[0];
    V.innerHTML=`
      ${m.doelKg?`<div class="card">
        <div class="card-head"><div class="card-title">De weg naar ${nf(m.doelKg)} kg</div>
          <span class="chip acc">${nf(m.topKg)} kg</span></div>
        <div style="padding:12px 14px 4px;display:flex;flex-wrap:wrap;gap:7px">
          ${m.treden.map(t=>{
            const g=m.topKg>=t;
            return `<span class="chip ${g?"acc":""}"${t===volgende?` style="border:1.5px solid var(--accent)"`:""}>${nf(t)}</span>`;
          }).join("")}
        </div>
        <div style="padding:8px 14px 13px"><p class="mut" style="font-size:12.5px">
          ${esc(m.focus.ex.name)} · je zwaarste gelogde set zet de markering.
          ${volgende?`Volgende trede: <b>${nf(volgende)} kg</b>, nog ${nf(Math.round((volgende-m.topKg)*10)/10)} kg.`
                    :`Je hebt de hele ladder gehad.`}</p></div>
      </div>`:`<div class="notebox">Vul bij ${esc(m.focus.ex.name)} een doelgewicht in
        (Meer → Oefeningen) en hier verschijnt je ladder ernaartoe.</div>`}

      ${totaal?`<div class="sec-label">Behaald</div><div class="list">
        ${m.treden.filter(t=>m.topKg>=t).map(t=>`<div class="li">
          <div class="li-main"><b>${nf(t)} kg</b><span>een trede op weg naar ${nf(m.doelKg)} kg</span></div>
          <span class="chip acc">✓</span></div>`).join("")}
        ${m.behaald.map(x=>`<div class="li">
          <div class="li-main"><b>${esc(x.naam)}</b><span>${x.wat}${x.datum?` · ${dLong(x.datum)}`:""}</span></div>
          <span class="chip acc">✓</span></div>`).join("")}
      </div>`:""}

      ${m.open.length?`<div class="sec-label">Nog te halen</div><div class="list">
        ${m.open.map(x=>`<div class="li">
          <div class="li-main"><b style="color:var(--ink-2)">${esc(x.naam)}</b>
            <span>${x.wat}${x.stand?` — ${x.stand}`:""}</span></div></div>`).join("")}
      </div>`:""}

      <p class="mut" style="margin-top:14px">Alles hierboven wordt elke keer opnieuw uit je logboek
        gerekend. Er staat bewust niets tussen dat je verdient door vaker te trainen dan goed voor je is.</p>`;
  },

  render(V){
    const ss=allSessions();
    head("Voortgang", ss.length?"Records, volume en trends":"");
    if(!ss.length){ V.innerHTML=`<div class="card"><div class="empty"><div class="big">Nog geen data</div><p>Zodra je een paar trainingen hebt gelogd, verschijnen hier je grafieken en records.</p></div></div>`; return; }

    // wekelijks volume per categorie, laatste 12 weken
    const weken=new Map();
    for(let i=11;i>=0;i--){
      const wk=weekKey(addDays(today(),-i*7));
      weken.set(wk,{push:0,pull:0,legs:0,core:0,cardio:0});
    }
    for(const s of DB.d.sessions){
      const wk=weekKey(s.date); if(!weken.has(wk)) continue;
      for(const e of s.entries){
        const ex=exById(e.exId); if(!ex) continue;
        weken.get(wk)[ex.cat]=(weken.get(wk)[ex.cat]||0)+e.sets.filter(isWork).length;
      }
    }
    const groups=[...weken].map(([k,v])=>({label:dParse(k).getDate()+"/"+(dParse(k).getMonth()+1),v}));

    // meest getrainde oefeningen
    const tel={};
    for(const s of DB.d.sessions) for(const e of s.entries){
      const n=e.sets.filter(isWork).length; if(n) tel[e.exId]=(tel[e.exId]||0)+n;
    }
    const top=Object.entries(tel).sort((a,b)=>b[1]-a[1]).slice(0,40);

    const d30=DB.d.sessions.filter(s=>daysAgo(s.date)<30);
    const vol30=d30.reduce((a,s)=>a+sessionStats(s).vol,0);
    const sets30=d30.reduce((a,s)=>a+sessionStats(s).sets,0);
    const gew=DB.d.weights.slice().sort((a,b)=>a.date<b.date?-1:1);

    V.innerHTML=`
      <div class="tiles">
        <div class="tile"><div class="k">30 dagen</div><div class="v">${d30.length}</div><div class="u">trainingen</div></div>
        <div class="tile"><div class="k">Volume</div><div class="v">${kf(vol30)}</div><div class="u">kg</div></div>
        <div class="tile"><div class="k">Werksets</div><div class="v">${sets30}</div><div class="u">30 dagen</div></div>
      </div>
      ${ss.length>=8?`<div class="row">
        <button class="btn wide" type="button" onclick="go('evaluatie')">Evaluatie</button>
        ${ss.length>=20?`<button class="btn wide" type="button" onclick="go('jaar')">Jaaroverzicht</button>`:""}
      </div>`:""}
      ${mijlpalen()?`<button class="btn wide" type="button" onclick="go('mijlpalen')">Mijlpalen</button>`:""}

      <div class="card">
        <div class="card-head"><div class="card-title">Werksets per week</div></div>
        <div class="chartwrap" style="padding:0 4px"><canvas id="cVol"></canvas></div>
        <div class="legend">
          <span><i style="background:var(--accent)"></i>Duwen</span>
          <span><i style="background:var(--good)"></i>Trekken</span>
          <span><i style="background:var(--warn)"></i>Benen</span>
          <span><i style="background:var(--ink-3)"></i>Core</span>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title">Spiergroepen · 28 dagen</div></div>
        <div style="padding:12px 14px;display:flex;flex-direction:column;gap:9px">${(()=>{
          const g=setsPerGroup(28); const max=Math.max(1,...Object.values(g));
          const rows=GROEPEN.filter(k=>g[k]).sort((a,b)=>g[b]-g[a]);
          if(!rows.length) return `<p class="mut">Nog geen sets in de afgelopen 4 weken.</p>`;
          return rows.map(k=>`<div style="display:flex;align-items:center;gap:10px">
            <span style="width:88px;font-size:12.5px;color:var(--ink-2);flex:none">${k}</span>
            <div style="flex:1;height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden">
              <i style="display:block;height:100%;width:${g[k]/max*100}%;background:var(--accent);border-radius:99px"></i></div>
            <span class="num" style="width:24px;text-align:right;font-size:12.5px;color:var(--ink-3)">${g[k]}</span></div>`).join("");
        })()}</div>
      </div>

      ${(()=>{
        const L=Inspanning.loontHet();
        if(!L) return "";
        const verschil=L.metPR-L.zonderPR;
        let uitleg;
        if(verschil>=6) uitleg=`Je records vallen in trainingen die gemiddeld <b class="num" style="color:var(--ink)">${verschil}%</b> zwaarder zijn dan je gewone sessies. Bij jou loont er harder tegenaan gaan dus daadwerkelijk.`;
        else if(verschil<=-6) uitleg=`Opvallend: je records vallen juist in trainingen die <b class="num" style="color:var(--ink)">${Math.abs(verschil)}%</b> lichter zijn dan gemiddeld. Uitgerust zijn levert je meer op dan hard doorgaan.`;
        else uitleg=`Je records vallen even vaak in zware als in lichte trainingen. Hoe hard je gaat voorspelt bij jou dus weinig — hersteld beginnen waarschijnlijk des te meer.`;
        return `<div class="card">
          <div class="card-head"><div class="card-title">Loont harder werken?</div>
            <span class="chip">${L.aantalPR} van ${L.aantal}</span></div>
          <div style="padding:13px 14px 6px">
            <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">${uitleg}</p></div>
          <div style="padding:6px 14px 14px;display:flex;flex-direction:column;gap:9px">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="width:112px;flex:none;font-size:12.5px;color:var(--ink-2)">Mét record</span>
              <div style="flex:1;height:10px;background:var(--surface-3);border-radius:99px;overflow:hidden">
                <i style="display:block;height:100%;width:${clamp(L.metPR/1.6,5,100)}%;background:var(--good);border-radius:99px"></i></div>
              <span class="num" style="width:38px;text-align:right;font-size:12.5px;color:var(--ink-3)">${L.metPR}</span></div>
            <div style="display:flex;align-items:center;gap:10px">
              <span style="width:112px;flex:none;font-size:12.5px;color:var(--ink-2)">Zonder record</span>
              <div style="flex:1;height:10px;background:var(--surface-3);border-radius:99px;overflow:hidden">
                <i style="display:block;height:100%;width:${clamp(L.zonderPR/1.6,5,100)}%;background:var(--accent);border-radius:99px"></i></div>
              <span class="num" style="width:38px;text-align:right;font-size:12.5px;color:var(--ink-3)">${L.zonderPR}</span></div>
          </div>
          <div style="padding:0 14px 13px"><p class="mut" style="font-size:12.5px">
            100 is een doorsnee training. Hoger betekent meer volume, sets, duur en — als je die
            invult — een hogere hartslag dan je voorgaande acht trainingen.</p></div>
        </div>`;
      })()}

      <div class="sec-label">Per oefening</div>
      <div class="list">${top.map(([id,n])=>{
        const pr=prFor(id); const h=historyFor(id);
        const last=h[h.length-1];
        const trend=this.trend(h);
        return `<button class="li" type="button" onclick="go('oefening','${id}')">
          <div class="li-main"><b>${esc(exName(id))}</b><span>${h.length} sessies · ${n} sets${last?" · "+relDate(last.date):""}</span></div>
          <div class="li-right"><span class="num" style="font-weight:700;color:var(--ink)">${pr.zwaarst?nf(pr.zwaarst):"–"}</span> kg
            ${trend?`<br><span class="chip ${trend.k}" style="font-size:10px">${trend.t}</span>`:""}</div>
          <div class="chev"></div></button>`;
      }).join("")}</div>

      <div class="card">
        <div class="card-head"><div class="card-title">Lichaamsgewicht</div>
          <button class="btn sm" type="button" onclick="Prog.addWeight()">+ Wegen</button></div>
        ${gew.length>1?`<div class="chartwrap" style="height:150px;padding:0 4px"><canvas id="cGew"></canvas></div>
          <div class="legend"><span>Laatste: <b class="num">${nf(gew[gew.length-1].kg)}</b> kg · ${relDate(gew[gew.length-1].date)}</span></div>`
        :`<div class="empty" style="padding:22px"><p>Weeg je regelmatig, dan zie je hier of je aankomt of afvalt naast je krachtcijfers.</p></div>`}
      </div>`;

    window._charts.push(()=>{
      const cv=$("#cVol"); if(cv) CV.bars(cv,groups,["push","pull","legs","core"],
        [CV.css("--accent"),CV.css("--good"),CV.css("--warn"),CV.css("--ink-3")]);
      const cg=$("#cGew");
      if(cg&&gew.length>1) CV.line(cg,gew.map(w=>({x:dParse(w.date).getTime(),y:w.kg})),
        {l0:dShort(gew[0].date),l1:dShort(gew[gew.length-1].date)});
    });
  },

  /* Ga je vooruit op deze oefening? Zes weken tegen de zes daarvóór, per venster
     de béste werkset. Eerst stonden hier drie sessies tegen drie — dat is
     anderhalve week, en een testdag plus een rustige week liet de bankdruk
     "zakken" terwijl er vier dagen eerder 110 kg op de stang lag. Een record in
     het recente venster blokkeert daarom "zakt". Een oefening die je zes weken
     niet deed krijgt geen label: daar valt niets over te zeggen. */
  /* ---- Evaluatie ---------------------------------------------------------
     Acht weken tegen de acht daarvóór. Dat venster zit bewust tussen Tips (die
     per oefening naar een kort stukje kijkt) en het jaaroverzicht (dat te ver
     uitzoomt om een scheve verhouding te zien) in. Precies het blok waarin je
     merkt dat er iets verandert.

     Alles hieronder is rekenwerk met drempels — geen oordeel over hoe je je
     voelt. Waar de cijfers te dun zijn, zegt hij dat.                       */
  evalWeken:8,
  blok(van,tot){
    const uit={workouts:0, sets:0, groep:{}, push:0, pull:0, oef:{}, zwaar:0, singles:0, repsets:0};
    for(const s of DB.d.sessions){
      if(s.date<van || s.date>tot) continue;
      uit.workouts++;
      for(const e of s.entries){
        const ex=exById(e.exId); if(!ex || ex.type==="cardio") continue;
        const w=e.sets.filter(x=>isWork(x) && !x.sec);
        if(!w.length) continue;
        uit.sets+=w.length;
        for(const g of exGroepen(ex)) uit.groep[g]=(uit.groep[g]||0)+w.length;
        for(const c of exCats(ex)){ if(c==="push") uit.push+=w.length; if(c==="pull") uit.pull+=w.length; }
        const o=uit.oef[e.exId]||(uit.oef[e.exId]={sets:0, sessies:0, zwaarst:0, besteWerkset:null});
        o.sets+=w.length; o.sessies++;
        for(const x of w){
          if((x.w||0)>o.zwaarst) o.zwaarst=x.w||0;
          if((x.r||0)<=2) uit.singles++; else uit.repsets++;
          // beste werkset = zwaarste set van 3 herhalingen of meer
          if((x.r||0)>=3 && (!o.besteWerkset || (x.w||0)>o.besteWerkset.w)) o.besteWerkset={w:x.w||0,r:x.r};
        }
      }
    }
    return uit;
  },
  /* Zware sets: 85% of meer van wat je ooit bij die oefening tilde */
  zwaarInBlok(van,tot){
    let n=0;
    for(const ex of DB.d.exercises){
      const h=historyFor(ex.id); if(!h.length) continue;
      let best=0;
      for(const d of h) for(const s of d.sets) if(!s.sec && (s.w||0)>best) best=s.w||0;
      if(!best) continue;
      for(const d of h){ if(d.date<van||d.date>tot) continue;
        n+=d.sets.filter(s=>!s.sec && (s.w||0)>=best*0.85).length; }
    }
    return n;
  },
  maak(){
    const w=this.evalWeken;
    const tot=today(), van=addDays(tot,-w*7);
    const vorigTot=addDays(van,-1), vorigVan=addDays(vorigTot,-w*7);
    const nu=this.blok(van,tot), oud=this.blok(vorigVan,vorigTot);
    nu.zwaar=this.zwaarInBlok(van,tot); oud.zwaar=this.zwaarInBlok(vorigVan,vorigTot);
    if(nu.workouts<4) return {teWeinig:true, nu, periode:{van,tot}};

    const bev=[];                                  // bevindingen, met prioriteit
    const voeg=(prio,k,tekst)=>bev.push({prio,k,tekst});

    // 1. je hoofdoefeningen: wat deed je werkgewicht?
    const top=Object.entries(nu.oef).sort((a,b)=>b[1].sets-a[1].sets).slice(0,4);
    const oefRegels=[];
    for(const [id,o] of top){
      const v=oud.oef[id];
      const nuW=o.besteWerkset, ouW=v&&v.besteWerkset;
      // bij eigen lichaamsgewicht bestaat "zwaarst" niet; dan alleen de sessies
      let regel=`<b>${esc(exName(id))}</b> — ${o.sessies} ${o.sessies===1?"sessie":"sessies"}`
              + (o.zwaarst?`, zwaarst ${nf(o.zwaarst)} kg`:"");
      if(nuW && ouW){
        const d=nuW.w-ouW.w;
        regel += d>0 ? `. Je beste werkset ging van ${setTekst(ouW.w,ouW.r,true)} naar <b>${setTekst(nuW.w,nuW.r,true)}</b>.`
               : d<0 ? `. Je beste werkset zakte van ${setTekst(ouW.w,ouW.r,true)} naar ${setTekst(nuW.w,nuW.r,true)}.`
                     : `. Je beste werkset bleef ${setTekst(nuW.w,nuW.r,true)}.`;
      } else if(nuW) regel += `, beste werkset ${setTekst(nuW.w,nuW.r,true)}.`;
      else regel += ".";
      oefRegels.push(regel);
    }

    // 2. duwen tegen trekken
    if(nu.push+nu.pull>=30){
      const r=nu.pull/Math.max(1,nu.push);
      const pct=Math.round(r*100);
      if(r<0.6) voeg(1,"bad",`Je trok <b>${nu.pull}</b> sets tegen <b>${nu.push}</b> duwsets — dat is ${pct}%. Je bovenrug is het platform waar je vanaf drukt; onder de 60% loopt dat achter. Twee trekoefeningen per week erbij is de goedkoopste winst die je hebt liggen.`);
      else if(r>1.6) voeg(3,"warn",`Je trok flink meer dan je duwde: ${nu.pull} tegen ${nu.push} sets.`);
      else voeg(4,"good",`Je duw- en trekwerk zijn in verhouding (${nu.pull} tegen ${nu.push} sets).`);
    }

    // 3. hoe snel bouwde je op?
    if(oud.zwaar>=5){
      const d=Math.round((nu.zwaar/oud.zwaar-1)*100);
      if(d>=50) voeg(1,"bad",`Je zware sets gingen van <b>${oud.zwaar}</b> naar <b>${nu.zwaar}</b> — ${d}% erbij. Dat is een steile klim. Houd het een paar weken vlak, of schakel een week terug voordat je lichaam dat voor je inplant.`);
      else if(d<=-40) voeg(3,"warn",`Je zware sets liepen terug van ${oud.zwaar} naar ${nu.zwaar}. Bewust teruggeschakeld, of is het erin geslopen?`);
    }

    // 4. hoeveel van je werk was bijna-maximaal?
    const totSets=nu.singles+nu.repsets;
    if(totSets>=40){
      const pct=Math.round(nu.singles/totSets*100);
      if(pct>=20) voeg(2,"warn",`<b>${pct}%</b> van je sets waren één of twee herhalingen (${nu.singles} van ${totSets}). Een zware poging meet je kracht, hij bouwt hem niet — en hij kost herstel dat je niet in opbouwend werk steekt.`);
    }

    // 5. frequentie
    const perWeek=Math.round(nu.workouts/w*10)/10, perWeekOud=Math.round(oud.workouts/w*10)/10;
    if(oud.workouts>=4){
      if(perWeek>=perWeekOud+0.4) voeg(4,"good",`Je trainde vaker: <b>${nf(perWeek)}×</b> per week tegen ${nf(perWeekOud)}× daarvoor.`);
      else if(perWeek<=perWeekOud-0.4) voeg(2,"warn",`Je trainde minder vaak: ${nf(perWeek)}× per week tegen ${nf(perWeekOud)}× daarvoor.`);
    }

    // 6. spiergroepen die achterblijven
    const achter=Object.keys(STREEF).filter(g=>{
      const perWeekG=(nu.groep[g]||0)/w;
      return perWeekG < STREEF[g]*0.4;
    });
    if(achter.length) voeg(2,"warn",`Deze groepen kregen minder dan de helft van wat je nastreeft: <b>${achter.join(", ")}</b>.`);

    bev.sort((a,b)=>a.prio-b.prio);
    return {nu, oud, periode:{van,tot}, vorigePeriode:{van:vorigVan,tot:vorigTot},
            oefRegels, bevindingen:bev.slice(0,5), perWeek};
  },

  /* ---- Jaaroverzicht -----------------------------------------------------
     Niet om tussen de sets te raadplegen, maar om af en toe terug te lezen.
     Daarom hele zinnen en weinig tegels: "bankdrukken van 40 naar 100 kg"
     zegt meer dan een grafiek met een stijgende lijn.                      */
  jaarPeriode:"12",                       // "12" = laatste twaalf maanden, "alles"
  jaar(V){
    const alles=allSessions().slice().sort((a,b)=>a.date<b.date?-1:1);
    if(!alles.length){ go("prog"); return; }
    const grens = this.jaarPeriode==="12" ? addDays(today(),-365) : alles[0].date;
    const ss=alles.filter(s=>s.date>=grens);
    head("Jaaroverzicht", ss.length?`${dShort(ss[0].date)} tot ${dShort(ss[ss.length-1].date)}`:"",
      `<button class="btn sm ghost" type="button" onclick="go('prog')">Terug</button>`);
    if(!ss.length){
      V.innerHTML=`<div class="card"><div class="empty"><p>In deze periode staat niets gelogd.</p></div></div>`;
      return;
    }

    // cijfers
    let sets=0, vol=0, reps=0, minuten=0;
    for(const s of ss){ const st=sessionStats(s); sets+=st.sets; vol+=st.vol; reps+=st.reps; minuten+=Math.round(st.dur/60); }
    const prs=Inspanning.prPerSessie();
    const records=ss.reduce((a,s)=>a+(prs[s.id]||0),0);

    // per maand: hoeveel trainingen
    const maanden=new Map();
    for(let d=new Date(dParse(ss[0].date).getFullYear(),dParse(ss[0].date).getMonth(),1);
        d<=dParse(ss[ss.length-1].date); d.setMonth(d.getMonth()+1)){
      maanden.set(d.toISOString().slice(0,7),0);
    }
    for(const s of ss){ const k=s.date.slice(0,7); if(maanden.has(k)) maanden.set(k,maanden.get(k)+1); }
    const maandLijst=[...maanden];
    const maxMaand=Math.max(1,...maandLijst.map(m=>m[1]));
    const besteMaand=maandLijst.slice().sort((a,b)=>b[1]-a[1])[0];
    const stille=maandLijst.filter(m=>m[1]===0).length;

    // grootste sprongen: eerste tegen beste set per oefening
    const sprongen=[];
    for(const ex of DB.d.exercises){
      // minstens zes sessies, anders roept één toevallige zware dag al "+78%"
      const h=historyFor(ex.id).filter(d=>d.date>=grens);
      if(h.length<6) continue;
      let eerst=0, best=0, bestSet=null;
      for(const s of h[0].sets) if((s.w||0)>eerst) eerst=s.w||0;
      for(const d of h) for(const s of d.sets)
        if((s.w||0)>best){ best=s.w||0; bestSet=s; }
      if(!eerst || best<=eerst) continue;
      sprongen.push({naam:ex.name, van:eerst, naar:best, set:bestSet,
                     pct:(best-eerst)/eerst, sessies:h.length});
    }
    sprongen.sort((a,b)=>b.pct-a.pct);

    // spiergroepen over de hele periode
    const groep={};
    for(const s of ss) for(const e of s.entries){
      const ex=exById(e.exId); if(!ex) continue;
      const n=e.sets.filter(isWork).length; if(!n) continue;
      for(const g of exGroepen(ex)) groep[g]=(groep[g]||0)+n;
    }
    const groepLijst=GROEPEN.filter(g=>groep[g]).sort((a,b)=>groep[b]-groep[a]);
    const maxGroep=Math.max(1,...groepLijst.map(g=>groep[g]));

    // lichaamsgewicht
    const gew=DB.d.weights.filter(w=>w.date>=grens).sort((a,b)=>a.date<b.date?-1:1);

    const uren=Math.round(minuten/60);
    V.innerHTML=`
      <div class="seg">
        <button type="button" class="${this.jaarPeriode==="12"?"on":""}" onclick="Prog.jaarKies('12')">Laatste 12 maanden</button>
        <button type="button" class="${this.jaarPeriode==="alles"?"on":""}" onclick="Prog.jaarKies('alles')">Alles</button>
      </div>

      <div class="card card-pad">
        <p style="font-size:15px;line-height:1.6;color:var(--ink-2)">
          Je deed <b class="num" style="color:var(--ink)">${ss.length}</b> workouts,
          <b class="num" style="color:var(--ink)">${kf(sets)}</b> werksets en
          <b class="num" style="color:var(--ink)">${nf(Math.round(reps))}</b> herhalingen.
          Samen tilde je <b class="num" style="color:var(--ink)">${kf(vol)}</b> kg${uren?`, in ongeveer <b class="num" style="color:var(--ink)">${uren}</b> uur in de gym`:""}.
          Daar vielen <b class="num" style="color:var(--ink)">${records}</b> persoonlijke records in.</p>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title">Per maand</div>
          <span class="chip">${besteMaand?`beste: ${MND[+besteMaand[0].slice(5)-1]}`:""}</span></div>
        <div style="padding:12px 14px;display:flex;align-items:flex-end;gap:4px;height:92px">
          ${maandLijst.map(([k,n])=>{
            const hgt=Math.max(n?4:2,Math.round(n/maxMaand*64));
            return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end">
              <span class="num" style="font-size:10.5px;color:var(--ink-3)">${n||""}</span>
              <i style="display:block;width:100%;height:${hgt}px;border-radius:3px;background:${n?"var(--accent)":"var(--surface-3)"}"></i>
              <span style="font-size:9.5px;color:var(--ink-3);white-space:nowrap">${MND[+k.slice(5)-1]}</span>
            </div>`;
          }).join("")}
        </div>
        <div style="padding:0 14px 13px"><p class="mut" style="font-size:12.5px">
          ${stille?`${stille} ${stille===1?"maand":"maanden"} zonder gelogde workout.`:"Geen enkele maand overgeslagen."}</p></div>
      </div>

      ${sprongen.length?`
      <div class="card">
        <div class="card-head"><div class="card-title">Waar je het hardst groeide</div></div>
        <div style="padding:13px 14px 15px;display:flex;flex-direction:column;gap:11px">
          ${sprongen.slice(0,5).map(s=>`
            <div>
              <div style="display:flex;gap:8px;align-items:baseline">
                <b style="font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.naam)}</b>
                <span class="num" style="font-size:13px;color:var(--good)">+${Math.round(s.pct*100)}%</span>
              </div>
              <span class="num" style="font-size:12.5px;color:var(--ink-3)">${nf(s.van)} kg → ${nf(s.naar)} kg · ${s.sessies} sessies</span>
            </div>`).join("")}
        </div>
      </div>`:""}

      <div class="card">
        <div class="card-head"><div class="card-title">Waar je sets heen gingen</div></div>
        <div style="padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px">
          ${groepLijst.map(g=>`
            <div style="display:flex;align-items:center;gap:10px">
              <span style="width:88px;flex:none;font-size:12.5px;color:var(--ink-2)">${g}</span>
              <div style="flex:1;height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden">
                <i style="display:block;height:100%;width:${groep[g]/maxGroep*100}%;background:var(--accent);border-radius:99px"></i></div>
              <span class="num" style="width:34px;text-align:right;font-size:12px;color:var(--ink-3)">${groep[g]}</span>
            </div>`).join("")}
        </div>
      </div>

      ${gew.length>1?`
      <div class="card card-pad">
        <p style="font-size:14.5px;line-height:1.6;color:var(--ink-2)">Je woog aan het begin
          <b class="num" style="color:var(--ink)">${nf(gew[0].kg)}</b> kg en nu
          <b class="num" style="color:var(--ink)">${nf(gew[gew.length-1].kg)}</b> kg
          — ${(()=>{ const d=gew[gew.length-1].kg-gew[0].kg;
            return Math.abs(d)<0.6 ? "vrijwel gelijk gebleven"
                 : `${nf(Math.abs(d))} kg ${d>0?"erbij":"eraf"}`; })()}.</p>
      </div>`:""}

      <p class="mut" style="padding:0 4px 10px">Alleen wat je zelf hebt gelogd telt mee.
        Workouts die je vergeten bent in te voeren staan hier dus niet in.</p>`;
  },
  jaarKies(p){ this.jaarPeriode=p; render(); },

  evalKies(w){ this.evalWeken=w; render(); },
  vorigeEvaluatie(){ const l=DB.d.evaluaties||[]; return l.length?l[l.length-1]:null; },
  evaluatie(V){
    const r=this.maak();
    const w=this.evalWeken;
    head("Evaluatie", `${dShort(r.periode.van)} tot ${dShort(r.periode.tot)}`,
      `<button class="btn sm ghost" type="button" onclick="go('prog')">Terug</button>`);

    const keuze=`<div class="seg">
      ${[[4,"4 weken"],[8,"8 weken"],[12,"12 weken"]].map(([n,l])=>
        `<button type="button" class="${w===n?"on":""}" onclick="Prog.evalKies(${n})">${l}</button>`).join("")}</div>`;

    if(r.teWeinig){
      V.innerHTML=keuze+`<div class="card"><div class="empty"><div class="big">Te weinig om over te zeggen</div>
        <p>Je hebt ${r.nu.workouts} ${r.nu.workouts===1?"workout":"workouts"} in deze periode gelogd.
        Vanaf een stuk of vier valt er iets te vergelijken.</p></div></div>`;
      return;
    }

    const vorige=this.vorigeEvaluatie();
    const sinds=vorige ? this.sindsVorige(vorige,r) : null;

    V.innerHTML=keuze+`
      <div class="card card-pad">
        <p style="font-size:15px;line-height:1.6;color:var(--ink-2)">
          In ${w} weken deed je <b class="num" style="color:var(--ink)">${r.nu.workouts}</b> workouts
          (<b class="num" style="color:var(--ink)">${nf(r.perWeek)}×</b> per week) en
          <b class="num" style="color:var(--ink)">${r.nu.sets}</b> werksets.
          De ${w} weken daarvóór waren dat er ${r.oud.workouts} en ${r.oud.sets}.</p>
      </div>

      ${sinds?`<div class="card">
        <div class="card-head"><div class="card-title">Sinds je vorige evaluatie</div>
          <span class="chip">${relDate(vorige.datum)}</span></div>
        <div style="padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px">
          ${sinds.map(t=>`<p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">${t}</p>`).join("")}
        </div></div>`:""}

      <div class="card">
        <div class="card-head"><div class="card-title">Je hoofdoefeningen</div></div>
        <div style="padding:13px 14px 15px;display:flex;flex-direction:column;gap:9px">
          ${r.oefRegels.map(t=>`<p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">${t}</p>`).join("")}
        </div>
      </div>

      ${r.bevindingen.length?`<div class="card">
        <div class="card-head"><div class="card-title">Wat opvalt</div></div>
        <div style="padding:4px 0 6px">
          ${r.bevindingen.map(b=>`<div class="tip"><div class="tip-bar ${b.k}"></div>
            <div class="tip-main"><p style="margin:0">${b.tekst}</p></div></div>`).join("")}
        </div></div>`
      :`<div class="card card-pad"><p class="mut">Niets bijzonders deze periode. Dat is ook een uitkomst.</p></div>`}

      <div class="card">
        <div class="card-head"><div class="card-title">Sets per spiergroep</div>
          <span class="chip">${w} weken</span></div>
        <div style="padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px">
          ${(()=>{ const g=r.nu.groep, max=Math.max(1,...Object.values(g));
            return GROEPEN.filter(k=>g[k]).sort((a,b)=>g[b]-g[a]).map(k=>{
              const was=r.oud.groep[k]||0, d=g[k]-was;
              return `<div style="display:flex;align-items:center;gap:10px">
                <span style="width:84px;flex:none;font-size:12.5px;color:var(--ink-2)">${k}</span>
                <div style="flex:1;height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden">
                  <i style="display:block;height:100%;width:${g[k]/max*100}%;background:var(--accent);border-radius:99px"></i></div>
                <span class="num" style="width:58px;text-align:right;font-size:12px;color:var(--ink-3)">${g[k]}${d?` (${d>0?"+":""}${d})`:""}</span>
              </div>`;
            }).join("");
          })()}
        </div>
      </div>

      <button class="btn primary wide" type="button" onclick="Prog.evalBewaar()">Deze evaluatie bewaren</button>
      <p class="mut" style="padding:0 4px 6px">Bewaren betekent: de volgende evaluatie kan zeggen wat er sindsdien veranderd is.</p>
      <button class="btn wide" type="button" onclick="Prog.evalBriefing()">Briefing kopiëren voor Claude</button>
      <p class="mut" style="padding:0 4px 10px">Dit zijn je eigen cijfers door een paar vuistregels gehaald —
        geen medisch advies, en het weet niets over hoe je je voelt.</p>`;
  },
  /* Wat is er veranderd ten opzichte van de vorige bewaarde evaluatie? */
  sindsVorige(vorige,r){
    const uit=[];
    const dagen=daysAgo(vorige.datum);
    if(dagen<7) return null;
    for(const [id,o] of Object.entries(r.nu.oef).sort((a,b)=>b[1].sets-a[1].sets).slice(0,3)){
      const v=vorige.oef&&vorige.oef[id];
      if(!v||!v.besteWerkset||!o.besteWerkset) continue;
      const d=o.besteWerkset.w-v.besteWerkset.w;
      if(d>0) uit.push(`<b>${esc(exName(id))}</b>: je beste werkset ging van ${setTekst(v.besteWerkset.w,v.besteWerkset.r,true)} naar <b>${setTekst(o.besteWerkset.w,o.besteWerkset.r,true)}</b>.`);
      else if(d<0) uit.push(`<b>${esc(exName(id))}</b>: je beste werkset zakte van ${setTekst(v.besteWerkset.w,v.besteWerkset.r,true)} naar ${setTekst(o.besteWerkset.w,o.besteWerkset.r,true)}.`);
    }
    if(vorige.push!==undefined && r.nu.push+r.nu.pull>=30){
      const nuPct=Math.round(r.nu.pull/Math.max(1,r.nu.push)*100);
      const ouPct=Math.round(vorige.pull/Math.max(1,vorige.push)*100);
      if(Math.abs(nuPct-ouPct)>=8)
        uit.push(`Je trek-duwverhouding ging van <b>${ouPct}%</b> naar <b>${nuPct}%</b>.`);
    }
    return uit.length?uit:null;
  },
  evalBewaar(){
    const r=this.maak(); if(r.teWeinig) return toast("Te weinig om te bewaren");
    const oef={};
    for(const [id,o] of Object.entries(r.nu.oef)) oef[id]={sets:o.sets, zwaarst:o.zwaarst, besteWerkset:o.besteWerkset};
    if(!DB.d.evaluaties) DB.d.evaluaties=[];
    DB.d.evaluaties.push({datum:today(), weken:this.evalWeken, workouts:r.nu.workouts,
      sets:r.nu.sets, push:r.nu.push, pull:r.nu.pull, groep:r.nu.groep, oef});
    if(DB.d.evaluaties.length>12) DB.d.evaluaties.shift();   // een jaar is genoeg
    DB.save(); render(); toast("Bewaard — de volgende evaluatie vergelijkt hiermee");
  },
  evalBriefing(){
    const r=this.maak(); if(r.teWeinig) return toast("Te weinig om over te schrijven");
    const t=[];
    t.push(`MIJN TRAINING, ${dShort(r.periode.van)} TOT ${dShort(r.periode.tot)} (uit REP KING FORGED)`);
    t.push(`${r.nu.workouts} workouts (${nf(r.perWeek)} per week), ${r.nu.sets} werksets. De ${this.evalWeken} weken daarvoor: ${r.oud.workouts} workouts, ${r.oud.sets} werksets.`);
    t.push("");
    t.push("HOOFDOEFENINGEN");
    for(const [id,o] of Object.entries(r.nu.oef).sort((a,b)=>b[1].sets-a[1].sets).slice(0,6)){
      const v=r.oud.oef[id];
      t.push(`- ${exName(id)}: ${o.sessies} sessies, ${o.sets} sets`
        + (o.zwaarst?`, zwaarst ${nf(o.zwaarst)} kg`:"")
        + (o.besteWerkset?`, beste werkset ${setTekst(o.besteWerkset.w,o.besteWerkset.r,true)}`:"")
        + (v&&v.besteWerkset?` (vorige periode ${setTekst(v.besteWerkset.w,v.besteWerkset.r,true)})`:""));
    }
    t.push("");
    t.push("SETS PER SPIERGROEP");
    const g=r.nu.groep;
    t.push(GROEPEN.filter(k=>g[k]).sort((a,b)=>g[b]-g[a])
      .map(k=>`${k} ${g[k]}${r.oud.groep[k]!==undefined?` (was ${r.oud.groep[k]})`:""}`).join(", "));
    t.push("");
    t.push(`Duwsets ${r.nu.push}, treksets ${r.nu.pull}. Zware sets ${r.nu.zwaar} (vorige periode ${r.oud.zwaar}).`);
    t.push(`Sets van 1-2 herhalingen: ${r.nu.singles} van ${r.nu.singles+r.nu.repsets}.`);
    t.push("");
    t.push("Kijk hiernaar als mijn coach: wat gaat goed, wat moet anders, en wat zou je de komende weken veranderen?");
    const tekst=t.join("\n");
    Sheet.open("Briefing voor Claude",`
      <p class="mut">Kopieer deze tekst en plak hem in een gesprek. Daar kun je wél doorvragen —
        de app zelf kan dat niet.</p>
      <textarea class="ctrl" id="evBrief" style="height:230px;font-size:12.5px" readonly>${esc(tekst)}</textarea>
      <button class="btn primary wide" type="button" onclick="kopieerVeld('#evBrief','Gekopieerd')">Kopiëren</button>`);
  },

  trend(h){
    if(h.length<6) return null;
    const WEEK=6048e5, nu=Date.now();
    // het beste uit een venster: werkset met gewicht, en voor eigen gewicht de reps
    const venster=(vanaf,tot)=>{
      const r={n:0, e1:0, kg:0, reps:0};
      for(const d of h){
        const wk=(nu-dParse(d.date).getTime())/WEEK;
        if(wk<vanaf || wk>=tot) continue;
        r.n++;
        const b=besteWerkset(d.sets);
        if(b && b.e1>r.e1) r.e1=b.e1;
        for(const s of d.sets){
          if(s.sec || s.t==="warmup") continue;
          if(s.w>r.kg) r.kg=s.w;
          if(!(s.w>0) && s.r>r.reps) r.reps=s.r;
        }
      }
      return r;
    };
    const A=venster(0,6), B=venster(6,12);
    if(!A.n) return null;                         // zes weken niet gedaan
    const maat=v=> v.e1 || v.reps;
    if(!maat(A) || !maat(B)) return null;

    const top=venster(0,1e4);                     // alles, om records te herkennen
    const record = (A.e1 && A.e1>=top.e1) || (A.kg && A.kg>=top.kg) || (A.reps && A.reps>=top.reps);

    const g=maat(A)/maat(B);
    if(g>1.03) return {k:"good",t:"↑ groeit"};
    if(g<0.95) return record ? {k:"warn",t:"→ vlak"} : {k:"bad",t:"↓ zakt"};
    return {k:"warn",t:"→ vlak"};
  },

  detail(V,exId){
    const ex=exById(exId); if(!ex){ go("prog"); return; }
    const h=historyFor(exId), pr=prFor(exId);
    head(esc(ex.name),`${exGroepen(ex).join(" · ")} · ${h.length} sessies`,
      `<button class="btn sm ghost" type="button" onclick="go('prog')">Terug</button>`);
    if(!h.length){ V.innerHTML=`<div class="card"><div class="empty"><p>Nog niet gelogd.</p></div></div>`; return; }

    /* Deze lijn telt herhalingen mee. Alleen het zwaarste gewicht tekenen gaf
       een verkeerd beeld: na één keer 105 kg zag vier keer 100 kg eruit als
       achteruitgang, terwijl dat juist sterker is. Er staan bewust geen
       getallen langs de as — het is een verhouding, geen gewicht dat hij
       getild heeft. De echte sets staan in de tabel eronder.               */
    const pts=h.map(d=>{ const b=besteWerkset(d.sets);
                         return {x:dParse(d.date).getTime(), y:b?b.e1:0}; })
                .filter(p=>p.y>0);
    const volPts=h.map(d=>({x:dParse(d.date).getTime(),y:Math.round(bestOf(d.sets).vol)}));

    V.innerHTML=`
      <div class="tiles">
        <div class="tile"><div class="k">Zwaarst</div><div class="v">${nf(pr.zwaarst)}</div><div class="u">kg</div></div>
        <div class="tile"><div class="k">Meeste reps</div><div class="v">${pr.reps}</div><div class="u">in één set</div></div>
        <div class="tile"><div class="k">Sessies</div><div class="v">${h.length}</div><div class="u">gelogd</div></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Kracht per training</div>
          ${(()=>{ const tr=this.trend(h);
                   return tr ? `<span class="chip ${tr.k}">${tr.t}</span>` : ""; })()}</div>
        <div class="chartwrap" style="padding:0 4px"><canvas id="cE1"></canvas></div>
        <div style="padding:0 14px 13px"><p class="mut" style="font-size:12px">
          Alleen je werksets van 3 herhalingen of meer. Zware pogingen van één herhaling staan er
          bewust niet in: anders duikt de lijn omlaag zodra je na een testdag weer gewoon traint.</p></div>
      </div>

      ${(()=>{
        const rm=repMaxima(exId);
        const rijen=Object.keys(rm).map(Number).sort((a,b)=>a-b);
        if(rijen.length<3) return "";
        const max=Math.max(...rijen.map(r=>rm[r].w));
        return `<div class="card">
          <div class="card-head"><div class="card-title">Je beste per herhalingen</div>
            <span class="chip">ooit</span></div>
          <div style="padding:12px 14px;display:flex;flex-direction:column;gap:7px">
            ${rijen.map(r=>{
              const v=rm[r], vers=daysAgo(v.datum)<=28;
              return `<div style="display:flex;align-items:center;gap:10px">
                <span class="num" style="width:50px;flex:none;font-size:12.5px;color:var(--ink-2)">${r} ${r===1?"rep":"reps"}</span>
                <div style="flex:1;height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden">
                  <i style="display:block;height:100%;width:${v.w/max*100}%;border-radius:99px;
                     background:${vers?"var(--good)":"var(--accent)"}"></i></div>
                <span class="num" style="width:54px;text-align:right;font-size:12.5px;color:var(--ink-3)">${nf(v.w)} kg</span>
              </div>`;
            }).join("")}
          </div>
          <div style="padding:0 14px 13px"><p class="mut" style="font-size:12px">
            Groen betekent: in de afgelopen vier weken neergezet. Elke rij is een record dat je kunt
            aanvallen — je hoeft niet altijd je zwaarste te verbeteren om vooruit te gaan.</p></div>
        </div>`;
      })()}
      <div class="card">
        <div class="card-head"><div class="card-title">Volume per sessie</div></div>
        <div class="chartwrap" style="height:150px;padding:0 4px"><canvas id="cV2"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Alle sessies</div></div>
        <div class="scrollx"><table class="tbl">
          <thead><tr><th>Datum</th><th style="text-align:right">Beste set</th><th style="text-align:right">Sets</th><th style="text-align:right">Volume</th></tr></thead>
          <tbody>${h.slice().reverse().map(d=>{
            const b=bestOf(d.sets);
            return `<tr><td>${dShort(d.date)}</td>
              <td class="n">${setTekst(b.w,b.r)}</td>
              <td class="n">${d.sets.length}</td>
              <td class="n">${kf(b.vol)}</td></tr>`;
          }).join("")}</tbody></table></div>
      </div>`;
    window._charts.push(()=>{
      const a=$("#cE1"); if(a) CV.line(a,pts,{l0:dShort(h[0].date),l1:dShort(h[h.length-1].date),geenY:true});
      const b=$("#cV2"); if(b) CV.line(b,volPts,{l0:dShort(h[0].date),l1:dShort(h[h.length-1].date)});
    });
  },

  addWeight(){
    Sheet.open("Lichaamsgewicht",`
      <div class="field"><label>Gewicht (kg)</label>
        <input class="ctrl num" id="wKg" inputmode="decimal" placeholder="82,4"></div>
      <div class="field"><label>Datum</label>
        <input class="ctrl" id="wD" type="date" value="${today()}"></div>
      <button class="btn primary wide" type="button" onclick="Prog.saveWeight()">Opslaan</button>`,
      b=>b.querySelector("#wKg").focus());
  },
  saveWeight(){
    const kg=parseFloat(String($("#wKg").value).replace(",","."));
    const d=$("#wD").value||today();
    if(!kg) return toast("Vul een gewicht in");
    DB.d.weights=DB.d.weights.filter(w=>w.date!==d);
    DB.d.weights.push({date:d,kg});
    DB.save(); Sheet.close(); render(); toast("Opgeslagen");
  }
};

/* ============================================================================
   COACH — je profiel, je plan en je wekelijkse terugblik

   Wat dit wél is: jouw gegevens door gangbare richtlijnen gehaald, en elke week
   je eigen cijfers naast elkaar. Alles rekent hier in de app, er gaat niets
   naar internet. Dat is precies waarom het ook werkt zonder bereik.

   Wat dit níét is: een pratende coach. Er zit geen taalmodel in dit bestand —
   het kan geen open vragen beantwoorden. Daarvoor staat onderaan de knop
   "Briefing kopiëren": die zet je profiel, je weekchecks en je trainingen in
   één tekst die je in een gesprek met Claude plakt.

   En het is geen medisch advies. Calorieën uit een formule zijn een startpunt,
   geen waarheid; de weegschaal over drie weken is de echte meting.

  /* ---- 1. Profiel ------------------------------------------------------- */

      <div class="sec-label">Wat wil je bereiken</div>
