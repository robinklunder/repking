        <div class="field"><label>Streefgewicht (kg) — mag leeg</label>
          <input class="ctrl num" id="pDoelGew" inputmode="decimal" value="${p.doelGewicht||""}" placeholder="geen streefgewicht"></div>
      </div>

      <div class="sec-label">Je week</div>
      <div class="card card-pad">
        <div class="field"><label>Op welke dagen kun je trainen?</label>
          ${Meer.kiezer("pDagen",WEEKDAGEN,p.dagen||["ma","wo","vr"],"Tik de dagen aan die meestal lukken.")}</div>
        <div class="field"><label>Hoeveel minuten heb je per keer?</label>
          <input class="ctrl num" id="pMinuten" inputmode="numeric" value="${p.minuten||60}" placeholder="60"></div>
        <div class="field"><label>Wat heb je tot je beschikking?</label>
          ${Meer.kiezer("pMateriaal",MATERIAAL,p.materiaal||["gym"],"Alles wat je kunt gebruiken.")}</div>
      </div>

      <div class="sec-label">Herstel en gezondheid</div>
      <div class="card card-pad">
        <div class="field"><label>Hoeveel uur slaap je gemiddeld?</label>
          <input class="ctrl num" id="pSlaap" inputmode="decimal" value="${p.slaap||""}" placeholder="bijv. 7"></div>
        <div class="field"><label>Blessures of gevoelige plekken</label>
          ${Meer.kiezer("pBlessures",BLESSURES,p.blessures||[],"Niets aan? Laat ze dan allemaal uit staan.",true)}</div>
        <div class="field"><label>Toelichting bij je blessures — mag leeg</label>
          <textarea class="ctrl" id="pBlessureTekst" placeholder="bijv. linkerschouder gaat mis bij overhead">${esc(p.blessureTekst||"")}</textarea></div>
      </div>

      <div class="sec-label">Eten en drinken</div>
      <div class="card card-pad">
        <div class="field"><label>Hoeveel eetmomenten heb je per dag?</label>
          <input class="ctrl num" id="pMaaltijden" inputmode="numeric" value="${p.maaltijden||3}"></div>
        <div class="field"><label>Hoe eet je nu?</label>
          <div class="seg">
            ${[["rommelig","Rommelig"],["redelijk","Redelijk"],["strak","Strak"]].map(([k,l])=>
              `<button type="button" class="${(p.eten||"redelijk")===k?"on":""}" onclick="Coach.seg(this,'eten','${k}')">${l}</button>`).join("")}
          </div></div>
        <div class="field"><label>Iets wat ik moet weten over je eten — mag leeg</label>
          <textarea class="ctrl" id="pEtenTekst" placeholder="bijv. vegetarisch, geen ontbijt, veel onderweg">${esc(p.etenTekst||"")}</textarea></div>
      </div>

      <button class="btn primary lg wide" type="button" onclick="Coach.intakeSave()">Plan maken</button>
      ${p.gestart?`<button class="btn danger wide" type="button" onclick="Coach.wis()">Profiel verwijderen</button>`:""}
      <p class="mut" style="padding:0 4px 8px">Dit blijft op je telefoon staan, net als je trainingen.</p>`;
  },
  /* Eén knop uit een segment aanzetten en de keuze onthouden tot je opslaat */
  _seg:{},
  seg(btn,veld,waarde){
    this._seg[veld]=waarde;
    [...btn.parentElement.children].forEach(b=>b.classList.toggle("on",b===btn));
  },
  segWaarde(veld,terugval){ return this._seg[veld]!==undefined ? this._seg[veld] : terugval; },

  intakeSave(){
    const getal=(id,t)=>{ const el=$(id); if(!el) return t;
      const v=parseFloat(String(el.value).replace(",",".")); return isNaN(v)?t:v; };
    const oud=DB.d.profiel||{};
    const p={
      gestart: oud.gestart||today(),
      bijgewerkt: today(),
      leeftijd: clamp(Math.round(getal("#pLeeftijd",oud.leeftijd||35)),12,100),
      lengte:   clamp(Math.round(getal("#pLengte",oud.lengte||180)),120,230),
      gewicht:  clamp(getal("#pGewicht",oud.gewicht||80),30,250),
      geslacht: this.segWaarde("geslacht",oud.geslacht||"m"),
      niveau:   this.segWaarde("niveau",oud.niveau||"gevorderd"),
      doelen:   Meer.gekozen("pDoel",oud.doelen||["spier"]),
      doelGewicht: getal("#pDoelGew",0)||null,
      // op volgorde van de week, niet op de volgorde waarin je ze aantikte
      dagen:    Meer.gekozen("pDagen",oud.dagen||["ma","wo","vr"])
                    .sort((a,b)=>WEEKDAGEN.findIndex(w=>w[0]===a)-WEEKDAGEN.findIndex(w=>w[0]===b)),
      minuten:  clamp(Math.round(getal("#pMinuten",oud.minuten||60)),15,180),
      materiaal:Meer.gekozen("pMateriaal",oud.materiaal||["gym"]),
      slaap:    clamp(getal("#pSlaap",oud.slaap||7),3,12),
      blessures:Meer.gekozen("pBlessures",oud.blessures||[]),
      blessureTekst: ($("#pBlessureTekst")||{}).value?.trim()||"",
      maaltijden: clamp(Math.round(getal("#pMaaltijden",oud.maaltijden||3)),1,8),
      eten:     this.segWaarde("eten",oud.eten||"redelijk"),
      etenTekst: ($("#pEtenTekst")||{}).value?.trim()||""
    };
    DB.d.profiel=p;
    // Je gewicht hoort ook in de gewichtsgrafiek, anders staat het op twee plekken
    const vandaag=DB.d.weights.find(w=>w.date===today());
    if(vandaag) vandaag.kg=p.gewicht; else DB.d.weights.push({date:today(),kg:p.gewicht});
    this._seg={};
    DB.save(); go("coach"); toast("Je plan staat klaar");
  },
  async wis(){
    if(await ask("Profiel verwijderen?","Je plan en je weekchecks gaan weg. Je trainingen blijven staan.","Verwijderen",true)){
      DB.d.profiel=null; DB.d.checkins=[]; DB.save(); go("coach"); toast("Verwijderd");
    }
  },

  /* ---- 2. Rekenwerk ----------------------------------------------------- */
  /* Ruststofwisseling volgens Mifflin-St Jeor: de formule die in de praktijk
     het dichtst bij de meting komt. Een schatting blijft het. */
  bmr(p){
    const basis=10*p.gewicht + 6.25*p.lengte - 5*p.leeftijd;
    if(p.geslacht==="m") return basis+5;
    if(p.geslacht==="v") return basis-161;
    return basis-78;                       // het midden als hij het niet zegt
  },
  /* Hoeveel je verbrandt: rust maal een factor voor hoe actief je week is */
  onderhoud(p){
    const d=p.dagen.length;
    const f = d<=1?1.2 : d<=3?1.375 : d<=5?1.55 : 1.725;
    return Math.round(this.bmr(p)*f);
  },
  hoofddoel(p){ return (p.doelen&&p.doelen[0])||"spier"; },
  /* Calorieën en macro's. Afvallen op −20% (maar nooit meer dan 500 eraf),
     spiermassa op +10%: sneller aankomen wordt vooral vet. */
  voeding(p){
    const ond=this.onderhoud(p), doel=this.hoofddoel(p);
    let kcal=ond, richting="onderhoud";
    if(doel==="afvallen"){ kcal=ond-Math.min(500,Math.round(ond*0.20)); richting="tekort"; }
    else if(doel==="spier"){ kcal=ond+Math.min(300,Math.round(ond*0.10)); richting="overschot"; }
    // Bij afvallen meer eiwit: dat houdt spier vast terwijl je in een tekort zit
    const eiwitPer = doel==="afvallen"?2.0 : doel==="spier"?1.8 : 1.6;
    const eiwit=Math.round(p.gewicht*eiwitPer);
    const vet=Math.round(p.gewicht*0.8);
    const kh=Math.max(0,Math.round((kcal - eiwit*4 - vet*9)/4));
    return {onderhoud:ond, kcal:Math.round(kcal), richting, eiwit, vet, kh,
            water:Math.round((p.gewicht*35 + p.dagen.length*500/7)/50)*50};
  },
  /* Hoeveel werksets per spiergroep per week. STREEF is het middenpad; wie net
     begint heeft minder nodig en wie lang traint mag hoger zitten. */
  streefSets(p){
    const f = p.niveau==="begin"?0.7 : p.niveau==="ervaren"?1.2 : 1;
    const uit={};
    for(const g in STREEF) uit[g]=Math.round(STREEF[g]*f);
    return uit;
  },
  /* Welke indeling past bij het aantal dagen dat je hebt? */
  split(p){
    const n=p.dagen.length, begin=p.niveau==="begin";
    if(n<=1) return ["Hele lichaam"];
    if(n===2) return ["Hele lichaam","Hele lichaam"];
    if(n===3) return begin?["Hele lichaam","Hele lichaam","Hele lichaam"]:["Duwdag","Trekdag","Benendag"];
    if(n===4) return ["Duwdag","Trekdag","Benendag","Bovenlichaam"];
    if(n===5) return ["Duwdag","Trekdag","Benendag","Bovenlichaam","Onderlichaam"];
    return ["Duwdag","Trekdag","Benendag","Duwdag","Trekdag","Benendag"];
  },
  /* Staat er vandaag iets op je plan? Geeft de naam van de dagsoort terug, of
     niets als het vandaag een rustdag is. Het Train-scherm gebruikt dit om het
     juiste voorstel voor te selecteren. */
  vandaagVolgensPlan(){
    const p=DB.d.profiel; if(!p||!p.dagen||!p.dagen.length) return null;
    const vandaag=DAG[dParse(today()).getDay()];
    const i=p.dagen.indexOf(vandaag);
    return i<0 ? null : (this.split(p)[i]||null);
  },
  letOp(p){
    const uit=new Set();
    for(const b of (p.blessures||[])) for(const n of (BLESSURE_LET_OP[b]||[])) uit.add(n);
    return [...uit];
  },

  /* ---- 3. Weekcheck ----------------------------------------------------- */
  checks(){ return (DB.d.checkins||[]).slice().sort((a,b)=>a.week<b.week?-1:1); },
  checkVan(wk){ return (DB.d.checkins||[]).find(c=>c.week===wk)||null; },
  dezeWeek(){ return weekKey(today()); },

  /* Wat de app zelf al weet over een week — dat hoeft hij niet in te tikken */
  uitLog(wk){
    const eind=addDays(wk,6);
    let n=0, sets=0, vol=0, prs=0;
    const prTel=Inspanning.prPerSessie();
    for(const s of DB.d.sessions){
      if(s.date<wk || s.date>eind) continue;
      const st=sessionStats(s);
      n++; sets+=st.sets; vol+=st.vol; prs+=prTel[s.id]||0;
    }
    return {sessies:n, sets, vol, prs};
  },

  weekcheckScherm(V){
    const wk=this.dezeWeek(), c=this.checkVan(wk)||{};
    const p=DB.d.profiel;
    const log=this.uitLog(wk);
    head("Weekcheck", `Week van ${dShort(wk)}`,
      `<button class="btn sm ghost" type="button" onclick="go('coach')">Terug</button>`);
    const schaal=(id,waarde,label,laag,hoog)=>`
      <div class="field"><label>${label}</label>
        <div class="seg">${[1,2,3,4,5].map(n=>
          `<button type="button" class="${(waarde||3)===n?"on":""}" onclick="Coach.seg(this,'${id}','${n}')">${n}</button>`).join("")}</div>
        <p class="mut" style="margin-top:6px;font-size:12px">1 = ${laag}, 5 = ${hoog}</p></div>`;
    V.innerHTML=`
      <div class="card card-pad">
        <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">Je trainingen weet ik al:
          <b>${log.sessies}</b> deze week, ${log.sets} werksets${log.prs?`, ${log.prs} ${log.prs===1?"record":"records"}`:""}.
          De rest kan ik niet zien — dat vul jij hier in.</p>
      </div>
      <div class="card card-pad">
        <div class="field"><label>Gewicht (kg)</label>
          <input class="ctrl num" id="cGewicht" inputmode="decimal" value="${c.gewicht||(p?p.gewicht:"")}"></div>
        <div class="field"><label>Hoeveel uur sliep je gemiddeld?</label>
          <input class="ctrl num" id="cSlaap" inputmode="decimal" value="${c.slaap||(p?p.slaap:"")}"></div>
        ${schaal("cEnergie",c.energie,"Energie","uitgeblust","topfit")}
        ${schaal("cVoeding",c.voeding,"Hoe goed hield je je aan je eten?","kwam er niets van","precies zoals bedoeld")}
        ${schaal("cStress",c.stress,"Stress en drukte","heel rustig","overvol")}
        <div class="field"><label>Notitie — mag leeg</label>
          <textarea class="ctrl" id="cNotitie" placeholder="Hoe voelde deze week?">${esc(c.notitie||"")}</textarea></div>
      </div>
      <button class="btn primary lg wide" type="button" onclick="Coach.checkSave()">Opslaan</button>`;
  },
  checkSave(){
    const wk=this.dezeWeek();
    const getal=(id,t)=>{ const el=$(id); if(!el) return t;
      const v=parseFloat(String(el.value).replace(",",".")); return isNaN(v)?t:v; };
    const oud=this.checkVan(wk)||{};
    const c={
      week:wk, datum:today(),
      gewicht: getal("#cGewicht",oud.gewicht||null),
      slaap:   getal("#cSlaap",oud.slaap||null),
      energie: +this.segWaarde("cEnergie",oud.energie||3),
      voeding: +this.segWaarde("cVoeding",oud.voeding||3),
      stress:  +this.segWaarde("cStress",oud.stress||3),
      notitie: ($("#cNotitie")||{}).value?.trim()||""
    };
    if(!DB.d.checkins) DB.d.checkins=[];
    const i=DB.d.checkins.findIndex(x=>x.week===wk);
    if(i>=0) DB.d.checkins[i]=c; else DB.d.checkins.push(c);
    // gewicht ook in de grafiek
    if(c.gewicht){
      const w=DB.d.weights.find(x=>x.date===today());
      if(w) w.kg=c.gewicht; else DB.d.weights.push({date:today(),kg:c.gewicht});
      if(DB.d.profiel) DB.d.profiel.gewicht=c.gewicht;
    }
    this._seg={};
    DB.save(); go("coach"); toast("Weekcheck opgeslagen");
  },

  /* ---- 4. Wekelijkse terugblik ------------------------------------------
     Alles hieronder is vergelijken: deze week tegen vorige week, en het gewicht
     over drie weken. Eén week zegt niets — je weegt zwaarder na een zoute
     maaltijd — dus de gewichtsregel kijkt pas vanaf drie metingen.          */
  review(){
    const p=DB.d.profiel; if(!p) return null;
    const cs=this.checks(); if(cs.length<2) return null;
    const nu=cs[cs.length-1], vorig=cs[cs.length-2];
    const doel=this.hoofddoel(p);
    const werkt=[], stroefL=[], doenL=[];
    /* Alles krijgt een rangnummer. Er komen makkelijk vijf punten tegelijk uit,
       en vijf opdrachten betekent in de praktijk dat je er nul doet — dus
       houden we onderaan alleen de belangrijkste over. Slaap gaat voorop:
       zonder slaap heeft sleutelen aan calorieën geen zin. */
    const stroef=(prio,t)=>stroefL.push({prio,t});
    const doen  =(prio,t)=>doenL.push({prio,t});

    // gewicht: tempo over de laatste drie weken
    const metGew=cs.filter(c=>c.gewicht).slice(-3);
    let tempo=null;
    if(metGew.length>=3){
      const weken=(dParse(metGew[metGew.length-1].week)-dParse(metGew[0].week))/6048e5;
      if(weken>0) tempo=(metGew[metGew.length-1].gewicht-metGew[0].gewicht)/weken;
    }
    if(tempo!==null){
      const t=Math.abs(tempo);
      if(doel==="afvallen"){
        if(tempo<=-0.25 && tempo>=-1.0) werkt.push(`Je valt ${nf(t)} kg per week af. Dat is een tempo dat je vol kunt houden.`);
        else if(tempo>-0.1){ stroef(4,`Je gewicht staat stil terwijl je wilt afvallen.`);
          doen(4,`Haal er <b>200 kcal</b> per dag af, of loop er drie wandelingen van een half uur bij. Niet allebei tegelijk — dan weet je niet wat werkte.`); }
        else if(tempo<-1.0){ stroef(4,`Je valt ${nf(t)} kg per week af. Dat gaat hard; onder de streep gaat er dan ook spier af.`);
          doen(4,`Eet er <b>200 kcal</b> per dag bij en kijk of je kracht terugkomt.`); }
      } else if(doel==="spier"){
        if(tempo>=0.1 && tempo<=0.4) werkt.push(`Je komt ${nf(t)} kg per week aan. Dat is het tempo waarbij het grootste deel spier is.`);
        else if(tempo<0.05){ stroef(4,`Je gewicht beweegt niet omhoog, terwijl je spiermassa wilt.`);
          doen(4,`Eet er <b>250 kcal</b> per dag bij, het makkelijkst als een extra eetmoment na je training.`); }
        else if(tempo>0.5){ stroef(4,`Je komt ${nf(t)} kg per week aan. Daarvan is een flink deel vet.`);
          doen(4,`Haal er <b>250 kcal</b> per dag af.`); }
      } else {
        if(t<=0.2) werkt.push(`Je gewicht blijft stabiel, precies wat je wilt.`);
      }
    }

    // trainingen tegenover je plan
    const logNu=this.uitLog(nu.week), logVorig=this.uitLog(vorig.week);
    const plan=p.dagen.length;
    if(logNu.sessies>=plan) werkt.push(`Je deed ${logNu.sessies} ${logNu.sessies===1?"workout":"workouts"} — je plan van ${plan} gehaald.`);
    else if(logNu.sessies<=plan-2){
      stroef(2,`Je plan staat op ${plan} workouts, je deed er ${logNu.sessies}.`);
      doen(2,logNu.sessies===0
        ? `Zet één vaste dag vast en houd die heilig. Eén workout per week die altijd doorgaat is meer waard dan vier die je mist.`
        : `Zet je plan op <b>${Math.max(1,logNu.sessies+1)} dagen</b>. Een plan dat je haalt werkt beter dan een plan dat mooi staat.`);
    }

    // kracht
    if(logNu.prs>0) werkt.push(`${logNu.prs} ${logNu.prs===1?"record":"records"} deze week — je wordt sterker.`);
    if(logVorig.sets>0){
      const d=Math.round((logNu.sets/logVorig.sets-1)*100);
      if(d>=40 && logNu.sets>10){
        stroef(3,`Je sets sprongen met ${d}% omhoog ten opzichte van vorige week.`);
        doen(3,`Bouw op met hooguit 10% per week. Te snel is precies hoe je twee keer eerder geblesseerd raakte.`);
      }
    }

    // slaap en energie
    const slaapNu=nu.slaap||0;
    if(slaapNu && slaapNu<6.5){
      stroef(1,`Je sliep ${nf(slaapNu)} uur per nacht. Onder de zeven uur kost je dat kracht en herstel.`);
      doen(1,`Ga deze week een half uur eerder naar bed. Dat levert je meer op dan welke aanpassing in je schema ook.`);
    } else if(slaapNu>=7.5) werkt.push(`Je slaapt ${nf(slaapNu)} uur — dat is waar je herstel vandaan komt.`);
    if(nu.energie<=2){
      stroef(2,`Je energie stond op ${nu.energie} van de 5.`);
      if(slaapNu>=7) doen(2,`Neem een rustigere week: dezelfde oefeningen, ongeveer een derde minder sets. Daarna ga je er meestal harder doorheen.`);
    } else if(nu.energie>=4 && vorig.energie<=3) werkt.push(`Je energie ging van ${vorig.energie} naar ${nu.energie}.`);

    // voeding
    if(nu.voeding<=2 && vorig.voeding<=2){
      stroef(5,`Twee weken op rij lukte het eten niet zoals bedoeld.`);
      doen(5,`Laat de calorieën even los en houd alleen je eiwit bij. Eén doel is makkelijker vol te houden dan vijf.`);
    } else if(nu.voeding>=4) werkt.push(`Je eten lag op ${nu.voeding} van de 5.`);

    const opRang=a=>a.slice().sort((x,y)=>x.prio-y.prio).map(x=>x.t);
    return {nu, vorig, log:logNu, weken:cs.length,
            werkt: werkt.slice(0,3),
            stroef: opRang(stroefL).slice(0,3),
            doen: opRang(doenL).slice(0,2)};
  },

  /* ---- 5. Het scherm ---------------------------------------------------- */
  render(V){
    const p=DB.d.profiel;
    if(!p) return this.welkom(V);

    const v=this.voeding(p), split=this.split(p), sets=this.streefSets(p);
    const wk=this.dezeWeek(), check=this.checkVan(wk);
    const log=this.uitLog(wk), letop=this.letOp(p);
    const doel=DOELEN.find(d=>d[0]===this.hoofddoel(p));
    head("Coach", `${doel?doel[1]:"Plan"} · ${p.dagen.length} dagen per week`,
      `<button class="btn sm ghost" type="button" onclick="go('intake')">Profiel</button>`);

    V.innerHTML=`
      ${check?"":`<div class="card">
        <div class="card-head"><div class="card-title">Weekcheck</div><span class="chip warn">open</span></div>
        <div style="padding:13px 14px 15px">
          <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">Deze week nog niet ingevuld.
            Twee minuten werk, en het is de enige manier waarop ik kan zien of je plan werkt.</p>
          <button class="btn primary wide" style="margin-top:11px" type="button" onclick="go('weekcheck')">Invullen</button>
        </div></div>`}

      ${this.reviewKaart()}

      <div class="card">
        <div class="card-head"><div class="card-title">Deze week</div>
          <span class="chip ${log.sessies>=p.dagen.length?"good":""}">${log.sessies} van ${p.dagen.length}</span></div>
        <div style="padding:12px 14px;display:flex;flex-direction:column;gap:7px">
          ${p.dagen.map((d,i)=>{
            const naam=WEEKDAGEN.find(w=>w[0]===d);
            return `<div style="display:flex;align-items:center;gap:10px">
              <span style="width:34px;flex:none;font-size:12.5px;font-weight:700;color:var(--ink-2)">${naam?naam[1]:d}</span>
              <span style="flex:1;font-size:14.5px">${split[i]||"Hele lichaam"}</span>
              <span class="num" style="font-size:12px;color:var(--ink-3)">${p.minuten} min</span>
            </div>`;
          }).join("")}
          <div style="height:1px;background:var(--line);margin:4px 0"></div>
          <p class="mut" style="font-size:12.5px">Rustdagen zijn geen verloren dagen: je spieren groeien daar.
            Wandelen, fietsen en rekken mogen gewoon.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title">Eten en drinken</div>
          <span class="chip ${v.richting==="tekort"?"acc":v.richting==="overschot"?"good":""}">${v.richting}</span></div>
        <div class="tiles" style="border:0;border-radius:0">
          <div class="tile"><div class="k">Calorieën</div><div class="v">${v.kcal}</div><div class="u">per dag</div></div>
          <div class="tile"><div class="k">Eiwit</div><div class="v">${v.eiwit}</div><div class="u">gram</div></div>
          <div class="tile"><div class="k">Vet</div><div class="v">${v.vet}</div><div class="u">gram</div></div>
          <div class="tile"><div class="k">Koolhydraten</div><div class="v">${v.kh}</div><div class="u">gram</div></div>
        </div>
        <div style="padding:12px 14px 14px">
          <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">Je verbrandt naar schatting
            <b class="num" style="color:var(--ink)">${v.onderhoud}</b> kcal per dag. Water:
            <b class="num" style="color:var(--ink)">${(v.water/1000).toFixed(1).replace(".",",")}</b> liter,
            meer als het warm is of je zwaar traint.</p>
          <p class="mut" style="font-size:12.5px;margin-top:8px">Dit is een formule, geen meting. Klopt je gewicht
            over drie weken niet met je doel, dan past de weekcheck het getal aan — niet andersom.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title">Slaap en herstel</div></div>
        <div style="padding:13px 14px 15px">
          <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">
            Streef naar <b>7 tot 9 uur</b>${p.slaap?` — je gaf ${nf(p.slaap)} uur op${p.slaap<7?", daar valt dus winst te halen":""}`:""}.
            Houd minstens één dag per week helemaal vrij, en schakel elke zes tot acht weken een week terug
            in sets: dat is geen luiheid maar onderdeel van het opbouwen.</p>
        </div>
      </div>

      ${letop.length?`<div class="card">
        <div class="card-head"><div class="card-title">Let op bij jouw klachten</div>
          <span class="chip warn">${(p.blessures||[]).length}</span></div>
        <div style="padding:13px 14px 15px">
          <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">Deze oefeningen belasten wat bij jou gevoelig is:
            <b>${letop.slice(0,8).map(esc).join(", ")}</b>${letop.length>8?" en nog een paar":""}.
            Ze zijn niet verboden — doe ze lichter, met minder bereik, of kies een variant die niet prikt.</p>
          ${p.blessureTekst?`<p class="mut" style="margin-top:9px">Jouw notitie: ${esc(p.blessureTekst)}</p>`:""}
          <p class="mut" style="margin-top:9px">Houdt pijn aan of straalt het uit, ga dan langs een arts of fysio.
            Dit is een app, geen diagnose.</p>
        </div></div>`:""}

      <div class="card">
        <div class="card-head"><div class="card-title">Sets per week</div><span class="chip">streef</span></div>
        <div style="padding:12px 14px;display:flex;flex-direction:column;gap:7px">
          ${(()=>{ const nu=setsPerGroup(7);
            return Object.keys(sets).map(g=>{
              const d=nu[g]||0, pct=clamp(d/sets[g]*100,0,100);
              const kleur = d>=sets[g]?"var(--good)":(d>=sets[g]*0.5?"var(--accent)":"var(--bad)");
              return `<div style="display:flex;align-items:center;gap:10px">
                <span style="width:88px;flex:none;font-size:12.5px;color:var(--ink-2)">${g}</span>
                <div style="flex:1;height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden">
                  <i style="display:block;height:100%;width:${pct}%;background:${kleur};border-radius:99px"></i></div>
                <span class="num" style="width:46px;text-align:right;font-size:12px;color:var(--ink-3)">${d}/${sets[g]}</span>
              </div>`;
            }).join("");
          })()}
        </div>
      </div>

      ${check?`<div class="card">
        <div class="card-head"><div class="card-title">Weekcheck</div>
          <span class="chip good">ingevuld</span></div>
        <div style="padding:12px 14px 14px">
          <p style="font-size:14.5px;line-height:1.55;color:var(--ink-2)">
            ${check.gewicht?`${nf(check.gewicht)} kg · `:""}${check.slaap?`${nf(check.slaap)} uur slaap · `:""}energie ${check.energie}/5 · eten ${check.voeding}/5</p>
          <button class="btn wide" style="margin-top:11px" type="button" onclick="go('weekcheck')">Aanpassen</button>
        </div></div>`:""}

      ${this.tipsKaart()}

      <button class="btn wide" type="button" onclick="Coach.briefing()">Briefing kopiëren voor Claude</button>
      <p class="mut" style="padding:0 4px 8px">Dit plan komt uit gangbare richtlijnen en jouw eigen cijfers.
        Het is geen medisch advies — bij klachten of twijfel is een arts of diëtist de juiste persoon.</p>`;
  },

  /* De tips uit je eigen cijfers, die eerst een eigen tabblad hadden */
  tipsKaart(){
    if(DB.d.sessions.length<3) return "";
    const tips=Tips.analyse();
    if(!tips.length) return "";
    return `<div class="sec-label">Signalen uit je cijfers</div>
      <div class="card">${tips.map(t=>`
        <div class="tip">
          <div class="tip-bar ${t.k}"></div>
          <div class="tip-main">
            <div class="tip-top"><span class="chip ${t.k}">${t.label}</span></div>
            <b>${esc(t.titel)}</b><p>${t.tekst}</p>
            ${t.doe?`<div class="do">${t.doe}</div>`:""}
          </div>
        </div>`).join("")}</div>`;
  },

  welkom(V){
    head("Coach","Nog geen profiel");
    V.innerHTML=`
      <div class="card">
        <div class="card-head"><div class="card-title">Persoonlijk plan</div></div>
        <div style="padding:13px 14px 16px">
          <p style="font-size:14.5px;line-height:1.6;color:var(--ink-2)">Vertel me wie je bent en wat je wilt,
            dan maak ik er een plan van: hoeveel je per week traint en wat, hoeveel je zou moeten eten en drinken,
            hoeveel slaap je nodig hebt, en waar je op moet letten met je blessures.</p>
          <p style="font-size:14.5px;line-height:1.6;color:var(--ink-2);margin-top:10px">Daarna vul je elke week
            één kort formulier in — gewicht, slaap, energie, hoe het eten ging. Je trainingen weet de app al.
            Uit die twee dingen samen komt elke week een terugblik: wat werkt, wat niet, en wat je aanpast.</p>
          <button class="btn primary lg wide" style="margin-top:14px" type="button" onclick="go('intake')">Beginnen</button>
        </div>
      </div>
      <div class="card card-pad">
        <p class="mut">Alles blijft op je telefoon. Er gaat niets naar internet — daarom werkt het ook in de kelder
          van de sportschool zonder bereik.</p>
      </div>
      ${this.tipsKaart()}`;
  },

  reviewKaart(){
    const r=this.review();
    if(!r){
      const n=this.checks().length;
      return `<div class="card card-pad"><p class="mut">Na je tweede weekcheck verschijnt hier je terugblik:
        wat werkt, wat niet, en wat je aanpast. ${n===1?"Nog één week te gaan.":""}</p></div>`;
    }
    return `
      <div class="card">
        <div class="card-head"><div class="card-title">Terugblik op je week</div>
          <span class="chip">week ${r.weken}</span></div>
        <div style="padding:13px 14px 15px;display:flex;flex-direction:column;gap:10px">
          ${r.werkt.length?`<div>
            <div class="chip good" style="margin-bottom:7px">dit werkt</div>
            ${r.werkt.map(t=>`<p style="font-size:14.5px;line-height:1.55;color:var(--ink-2);margin-top:4px">${t}</p>`).join("")}
          </div>`:""}
          ${r.stroef.length?`<div>
            <div class="chip warn" style="margin-bottom:7px">hier loopt het stroef</div>
            ${r.stroef.map(t=>`<p style="font-size:14.5px;line-height:1.55;color:var(--ink-2);margin-top:4px">${t}</p>`).join("")}
          </div>`:""}
          ${r.doen.length?`<div>
            <div class="chip acc" style="margin-bottom:7px">doe dit deze week</div>
            ${r.doen.map(t=>`<p style="font-size:14.5px;line-height:1.55;color:var(--ink-2);margin-top:4px">${t}</p>`).join("")}
          </div>`:""}
          ${(!r.werkt.length&&!r.stroef.length)?`<p style="font-size:14.5px;color:var(--ink-2)">Niets bijzonders deze week.
            Zo doorgaan is ook een uitkomst.</p>`:""}
        </div>
      </div>`;
  },

  /* ---- 6. Briefing voor een gesprek met Claude ---------------------------
     De app kan geen open vragen beantwoorden. Dit zet alles wat ze weet in één
     tekst, zodat je die kunt plakken in een gesprek en daar wél kunt doorvragen. */
  briefingTekst(){
    const p=DB.d.profiel; if(!p) return "";
    const v=this.voeding(p);
    const r=[];
    r.push(`MIJN PROFIEL (uit REP KING FORGED, ${dLong(today())})`);
    r.push(`${p.leeftijd} jaar, ${p.lengte} cm, ${nf(p.gewicht)} kg${p.doelGewicht?`, streefgewicht ${nf(p.doelGewicht)} kg`:""}.`);
    r.push(`Niveau: ${({begin:"minder dan 1 jaar",gevorderd:"1 tot 3 jaar",ervaren:"langer dan 3 jaar"})[p.niveau]} serieus trainen.`);
    r.push(`Doelen: ${(p.doelen||[]).map(d=>(DOELEN.find(x=>x[0]===d)||[,d])[1]).join(", ")}.`);
    r.push(`Ik train ${p.dagen.length} dagen per week (${p.dagen.join(", ")}), ${p.minuten} minuten per keer.`);
    r.push(`Beschikbaar: ${(p.materiaal||[]).map(m=>(MATERIAAL.find(x=>x[0]===m)||[,m])[1]).join(", ")}.`);
    r.push(`Slaap: ongeveer ${nf(p.slaap)} uur. Eten: ${p.maaltijden} eetmomenten, ${p.eten}.`);
    if(p.etenTekst) r.push(`Over mijn eten: ${p.etenTekst}`);
    const bl=(p.blessures||[]).map(b=>(BLESSURES.find(x=>x[0]===b)||[,b])[1]);
    r.push(`Blessures: ${bl.length?bl.join(", "):"geen"}.${p.blessureTekst?" "+p.blessureTekst:""}`);
    r.push(`Berekend plan: ${v.kcal} kcal (${v.richting}), ${v.eiwit} g eiwit, ${v.vet} g vet, ${v.kh} g koolhydraten, ${(v.water/1000).toFixed(1)} liter water.`);

    const cs=this.checks().slice(-6);
    if(cs.length){
      r.push("");
      r.push("WEEKCHECKS (nieuwste onderaan)");
      for(const c of cs){
        const l=this.uitLog(c.week);
        r.push(`- week ${dShort(c.week)}: ${c.gewicht?nf(c.gewicht)+" kg, ":""}${c.slaap?nf(c.slaap)+" u slaap, ":""}energie ${c.energie}/5, eten ${c.voeding}/5, stress ${c.stress}/5 — ${l.sessies} workouts, ${l.sets} sets${l.prs?`, ${l.prs} PR`:""}${c.notitie?` (${c.notitie})`:""}`);
      }
    }
    const ss=allSessions().slice(0,8);
    if(ss.length){
      r.push("");
      r.push("LAATSTE WORKOUTS");
      for(const s of ss){
        const st=sessionStats(s), top=Log.hoofdoefening(s);
        r.push(`- ${dShort(s.date)} ${Log.groepNaam(s)} (${SOORTNAAM[soortVan(s)]}): ${st.sets} sets${top&&top.w?`, zwaarst ${setTekst(top.w,top.r,true)} ${top.naam}`:""}`);
      }
    }
    r.push("");
    r.push("Kijk hiernaar als mijn coach: wat gaat goed, wat moet anders, en wat zou je de komende weken veranderen?");
    return r.join("\n");
  },
  briefing(){
    const t=this.briefingTekst();
    if(!t) return toast("Vul eerst je profiel in");
    Sheet.open("Briefing voor Claude",`
      <p class="mut">Kopieer deze tekst en plak hem in een gesprek. Daar kun je wél doorvragen —
        de app zelf kan dat niet, er zit geen taalmodel in.</p>
      <textarea class="ctrl" id="brTekst" style="height:240px;font-size:12.5px">${esc(t)}</textarea>
      <button class="btn primary wide" type="button" onclick="Coach.kopieer()">Kopiëren</button>`);
  },
  kopieer(){
    const el=$("#brTekst"); if(!el) return;
    el.select(); el.setSelectionRange(0,999999);
    let ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){}
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(el.value).then(()=>toast("Gekopieerd")); return; }
    toast(ok?"Gekopieerd":"Selecteer de tekst en kopieer hem zelf");
  }
};

const Tips={
  render(V){
    head("Tips","Gebaseerd op wat je hebt gelogd");
    const ss=DB.d.sessions;
    if(ss.length<3){
      V.innerHTML=`<div class="card"><div class="empty"><div class="big">Nog te weinig data</div>
        <p>Log een stuk of drie trainingen — daarna kan ik patronen zien: stilstand, onbalans, te snelle opbouw.</p></div></div>`;
      return;
    }
    const tips=this.analyse();
    V.innerHTML= tips.length
      ? `<div class="card">${tips.map(t=>`
          <div class="tip">
            <div class="tip-bar ${t.k}"></div>
            <div class="tip-main">
              <div class="tip-top"><span class="chip ${t.k}">${t.label}</span></div>
              <b>${esc(t.titel)}</b><p>${t.tekst}</p>
              ${t.doe?`<div class="do">${t.doe}</div>`:""}
            </div>
          </div>`).join("")}</div>
          <p class="mut" style="padding:0 4px">Dit zijn signalen uit je eigen cijfers, geen medisch advies. Jij weet hoe je lichaam voelt — dat weegt zwaarder.</p>`
      : `<div class="card"><div class="empty"><div class="big">Niets op te merken</div>
         <p>Je opbouw is netjes, je balans klopt en je gaat vooruit. Doorgaan zo.</p></div></div>`;
  },

  /* Het herhalingsaantal dat je bij deze oefening het vaakst draait */
  vaakstReps(h){
    const tel={};
    h.slice(-8).forEach(d=>d.sets.forEach(s=>{ if(s.r) tel[s.r]=(tel[s.r]||0)+1; }));
    const e=Object.entries(tel).sort((a,b)=>b[1]-a[1])[0];
    return e?+e[0]:8;
  },

  analyse(){
    const T=[];
    const ss=allSessions();
    const add=(k,label,titel,tekst,doe,prio)=>T.push({k,label,titel,tekst,doe,prio});

    /* --- 1. Stilstand per oefening --- */
    const tel={};
    for(const s of DB.d.sessions) for(const e of s.entries){
      const n=e.sets.filter(isWork).length; if(n) tel[e.exId]=(tel[e.exId]||0)+n;
    }
    const belangrijk=Object.entries(tel).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
    const stil=[]; let groeit=0;
    /* Wanneer noemen we iets stilstand? Niet te snel. Een paar weken op
       hetzelfde gewicht blijven hangen is normaal en gezond — dat heet een
       plateau, geen probleem. Vandaar vier voorwaarden tegelijk:
         1. minstens 8 sessies met deze oefening,
         2. de laatste vier sessies vergeleken met de zes daarvóór,
         3. dat venster beslaat minstens 8 weken,
         4. je beste ooit is minstens 6 weken geleden.
       En het moet écht omlaag zijn gegaan: "niet vooruit" is geen stilstand,
       want met vier metingen tegen zes heeft het oudere blok sowieso meer
       kans om een uitschieter te bevatten.                                 */
    for(const id of belangrijk){
      const h=historyFor(id);
      if(h.length<8) continue;
      if(daysAgo(h[h.length-1].date)>28) continue;        // oefening doe je niet meer
      // werksets, niet de zware pogingen — anders heet een testdag "vooruitgang"
      // en de gewone training erna "stilstand"
      const e=h.map(d=>{ const b=besteWerkset(d.sets); return {d:d.date, v:b?b.e1:0}; })
               .filter(x=>x.v>0);
      if(e.length<8) continue;
      const nu=e.slice(-4), eerder=e.slice(-10,-4);
      if(eerder.length<3) continue;
      if(daysAgo(eerder[0].d)<56) continue;               // te kort om iets van te vinden
      const vNu=Math.max(...nu.map(x=>x.v)), vEerder=Math.max(...eerder.map(x=>x.v));
      const piek=Math.max(...e.map(x=>x.v));
      const piekDatum=e.filter(x=>x.v>=piek*0.9995)[0].d;

      // Meten doen we met het geschatte 1RM (dat vergelijkt 80×8 eerlijk met 90×5),
      // maar we vertéllen het in de sets die hij echt heeft gedaan.
      const zwaarste=r=>{ let b={w:0,r:0};
        for(const d of h){ if(r && d.date<r) continue;
          for(const s of d.sets) if((s.w||0)>b.w) b={w:s.w,r:s.r}; }
        return b; };
      if(vNu>vEerder*1.02){
        const nu3=zwaarste(nu[0].d);
        if(groeit++<2) add("good","Groeit",`${exName(id)} loopt goed`,
          `Je zwaarste set is nu <b class="num">${setTekst(nu3.w,nu3.r,true)}</b>, en je gaat er nog steeds op vooruit.`,
          `Blijf op dit spoor. Voeg volgende keer 2,5 kg toe óf één herhaling per set — niet allebei tegelijk.`,1);
      } else if(vNu<=vEerder*1.005 && daysAgo(piekDatum)>=42){   // voorwaarde 4
        stil.push({id,zwaarst:zwaarste(),wkn:Math.max(1,Math.round(daysAgo(piekDatum)/7)),
                   reps:this.vaakstReps(h)});
      }
    }
    stil.sort((a,b)=>b.wkn-a.wkn);
    for(const s of stil.slice(0,2)){
      const laag = s.reps>=8;
      add("bad","Stilstand",`${exName(s.id)} staat stil`,
        `Je zwaarste set blijft <b class="num">${setTekst(s.zwaarst.w,s.zwaarst.r,true)}</b>, en daar sta je nu <b class="num">${s.wkn}</b> weken. De laatste sessies kom je daar niet meer boven.`,
        `Verander één ding tegelijk, niet alles: ${laag?`ga van ${s.reps} herhalingen naar 4–6 zware`:`ga van ${s.reps} herhalingen naar 8–12 met minder gewicht`}, óf zet er één werkset per training bij, óf neem eerst een rustige week. Geef elke aanpassing drie weken voordat je oordeelt.`,3);
    }
    if(stil.length>2)
      add("warn","Stilstand","Meer oefeningen zitten vast",
        `Ook <b>${stil.slice(2).map(s=>exName(s.id)).join(", ")}</b> gaan al weken niet meer vooruit.`,
        `Als bijna alles tegelijk stilstaat, ligt het zelden aan je schema. Kijk eerst naar slaap, eten en of je een rustweek overslaat.`,3);

    /* --- 1b. Tijd om je max te testen? --- */
    for(const id of belangrijk.slice(0,4)){
      const mx=maxMoment(id);
      if(!mx) continue;
      add("good","Testen",`${exName(id)}: tijd om te maxen`,
        mx.tekst,
        `Bouw op met enkele herhalingen tot ongeveer 93% en doe dan één poging. Hooguit twee pogingen, en niet vaker dan eens in de acht tot twaalf weken.`,2);
      break;                                   // één tegelijk is genoeg
    }

    /* --- 2. Duwen / trekken balans --- */
    const cat=setsPerCat(28);
    const push=cat.push||0, pull=cat.pull||0;
    if(push+pull>=20){
      const r=push/Math.max(1,pull);
      if(r>1.35) add("warn","Onbalans","Je duwt veel meer dan je trekt",
        `Afgelopen 4 weken: <b class="num">${push}</b> duw-sets tegen <b class="num">${pull}</b> trek-sets. Dat trekt je schouders naar voren en vergroot de kans op schouderklachten.`,
        `Zet er per week 3–4 trek-sets bij: face pulls, rows of rear delt flys.`,3);
      else if(r<0.7) add("warn","Onbalans","Je trekt veel meer dan je duwt",
        `Afgelopen 4 weken: <b class="num">${pull}</b> trek-sets tegen <b class="num">${push}</b> duw-sets.`,
        `Voeg een duw-oefening toe, of een extra set bij je bench of shoulder press.`,2);
    }

    /* --- 3. Quads vs hamstrings --- */
    const g28=setsPerGroup(28);
    const q=g28["Quadriceps"]||0, ham=(g28["Hamstrings"]||0)+(g28["Bilspieren"]||0);
    if(q+ham>=12){
      if(q/Math.max(1,ham)>2.0) add("warn","Onbalans","Weinig hamstrings en bilspieren",
        `<b class="num">${q}</b> quad-sets tegen <b class="num">${ham}</b> voor je achterkant. Een scheve verhouding hier is een klassieke bron van kniepijn en hamstringblessures.`,
        `Twee sets romanian deadlift of leg curl per beentraining maakt dit al recht.`,3);
    }

    /* --- 4. Verwaarloosde spiergroepen --- */
    const g14=setsPerGroup(14);
    const actief=DB.d.sessions.filter(s=>daysAgo(s.date)<14).length;
    if(actief>=3){
      const vergeten=["Rug","Borst","Schouders","Quadriceps","Hamstrings","Core"].filter(g=>(g14[g]||0)<3);
      if(vergeten.length) add("warn","Gat","Deze spiergroepen bleven liggen",
        `De afgelopen 2 weken deed je minder dan 3 werksets voor: <b>${vergeten.join(", ")}</b>.`,
        `Plan er per groep één oefening bij, of check of je schema wel alles dekt.`,2);
    }

    /* --- 5. Volumesprong (blessurerisico) --- */
    const wk=k=>DB.d.sessions.filter(s=>weekKey(s.date)===k).reduce((a,s)=>a+sessionStats(s).sets,0);
    const dezeW=wk(weekKey(today())), vorigeW=wk(weekKey(addDays(today(),-7)));
    if(vorigeW>=10 && dezeW>vorigeW*1.35)
      add("bad","Risico","Je bouwt snel op",
        `Deze week <b class="num">${dezeW}</b> werksets tegen <b class="num">${vorigeW}</b> vorige week — een sprong van ${Math.round((dezeW/vorigeW-1)*100)}%.`,
        `Grote sprongen in volume zijn de meest voorspelbare weg naar een blessure. Houd de groei onder ~10% per week.`,4);

    /* --- 6. Deload: al weken achtereen op volle kracht, zonder lichte week --- */
    const wkn=[1,2,3,4,5,6].map(i=>wk(weekKey(addDays(today(),-i*7)))).filter(v=>v>0);
    if(wkn.length>=5){
      const top=Math.max(...wkn), laag=Math.min(...wkn);
      if(laag>=top*0.7)
        add("warn","Herstel","Tijd voor een rustige week",
          `Je draait al <b class="num">${wkn.length}</b> weken op rij tussen de <b class="num">${laag}</b> en <b class="num">${top}</b> werksets, zonder één week terug te schakelen.`,
          `Doe één week met ongeveer 60% van je normale sets en blijf drie herhalingen van falen af. Je komt er sterker uit — juist na zo'n week vallen de records.`,3);
    }

    /* --- 7. Frequentie gedaald --- */
    const f4=DB.d.sessions.filter(s=>daysAgo(s.date)<28).length;
    const f8=DB.d.sessions.filter(s=>daysAgo(s.date)>=28&&daysAgo(s.date)<56).length;
    if(f8>=6 && f4<f8*0.65)
      add("warn","Frequentie","Je traint minder dan eerder",
        `<b class="num">${f4}</b> trainingen in de laatste 4 weken, tegen <b class="num">${f8}</b> in de 4 weken daarvoor.`,
        `Als dat bewust is: prima. Zo niet, plan je trainingen als afspraken in je agenda — dat werkt beter dan losse voornemens.`,2);

    /* --- 8. Rep-bereik vastgeroest --- */
    const vast=[];
    for(const id of belangrijk.slice(0,6)){
      const h=historyFor(id); if(h.length<8) continue;
      const reps=[]; h.slice(-8).forEach(d=>d.sets.forEach(s=>{ if(s.r) reps.push(s.r); }));
      if(reps.length<12) continue;
      if(Math.max(...reps)-Math.min(...reps)<=2) vast.push(exName(id));
    }
    if(vast.length>=3)
      add("acc","Variatie","Je draait altijd hetzelfde aantal herhalingen",
        `Bij <b>${vast.slice(0,4).join(", ")}</b>${vast.length>4?" en nog "+(vast.length-4):""} zaten je laatste 8 sessies telkens in vrijwel hetzelfde bereik.`,
        `Je lichaam went aan een prikkel die niet verandert. Draai eens zes weken 4–6 zware herhalingen, of juist 12–15 lichtere. Dat is vaak genoeg om een plateau te doorbreken.`,2);
    else vast.forEach(n=>add("acc","Variatie",`${n} zit altijd in hetzelfde bereik`,
        `Je laatste 8 sessies zaten allemaal binnen 2 herhalingen van elkaar.`,
        `Wissel eens een blok van 4–6 zware herhalingen af met 12–15 lichtere. Andere prikkel, nieuwe groei.`,1));

    const recent=DB.d.sessions.filter(s=>daysAgo(s.date)<28);

    /* --- 10. Lange sessies --- */
    const lang=recent.filter(s=>{ const d=sessionStats(s).dur; return d>6600; });
    if(lang.length>=3)
      add("acc","Duur","Je trainingen duren lang",
        `${lang.length} van je laatste ${recent.length} trainingen duurden meer dan anderhalf uur.`,
        `Na ~75 minuten zakt de kwaliteit van je sets meestal. Splits liever in twee kortere trainingen dan één lange.`,1);

    /* --- 11. Lichaamsgewicht --- */
    const w=DB.d.weights.slice().sort((a,b)=>a.date<b.date?-1:1).filter(x=>daysAgo(x.date)<60);
    if(w.length>=4){
      const d=w[w.length-1].kg-w[0].kg, wkn2=Math.max(1,(dParse(w[w.length-1].date)-dParse(w[0].date))/6048e5);
      const perWk=d/wkn2;
      if(Math.abs(perWk)>0.7) add("warn","Gewicht",perWk>0?"Je komt snel aan":"Je valt snel af",
        `<b class="num">${perWk>0?"+":""}${nf(Math.round(perWk*100)/100)} kg per week</b> over de laatste ${Math.round(wkn2)} weken.`,
        perWk>0?`Meer dan ~0,4 kg per week is meestal vooral vet. Temper je overschot iets als spiergroei het doel is.`
               :`Meer dan ~0,7 kg per week eraf kost je kracht en spiermassa. Eet iets meer en houd je zware sets vast.`,2);
    }

    /* --- 12. Back-up --- */
    const lb=S().lastBackup;
    if(DB.d.sessions.length>=8 && (!lb || daysAgo(lb)>30))
      add("bad","Back-up","Maak een reservekopie",
        `Je data staat alleen in de browser van deze telefoon. ${lb?`Je laatste back-up was ${relDate(lb)}.`:"Je hebt nog nooit geëxporteerd."} Browsergeheugen wordt soms opgeruimd — dan is een jaar loggen weg.`,
        `Ga naar Meer → Exporteren en bewaar het bestand. Kost tien seconden.`,4);

    return T.sort((a,b)=>b.prio-a.prio);
  }
};

/* ============================================================================
   MEER — oefeningen, schema's, import/export, instellingen
   ============================================================================ */
const Meer={
  render(V){
    head("Meer","Oefeningen, schema's, back-up");
    V.innerHTML=`
      <div class="list">
        <button class="li" type="button" onclick="Meer.exList()"><div class="li-main"><b>Oefeningen</b><span>${DB.d.exercises.filter(e=>!e.arch).length} in je bibliotheek</span></div><div class="chev"></div></button>
        <button class="li" type="button" onclick="Meer.routineList()"><div class="li-main"><b>Schema's</b><span>${DB.d.routines.length} opgeslagen</span></div><div class="chev"></div></button>
      </div>
      <div class="list">
        <button class="li" type="button" onclick="Meer.importSheet()"><div class="li-main"><b>Importeren</b><span>Uit Notities, Excel of een CSV-bestand</span></div><div class="chev"></div></button>
        <button class="li" type="button" onclick="Meer.exportSheet()"><div class="li-main"><b>Exporteren &amp; back-up</b><span>${S().lastBackup?"Laatste: "+relDate(S().lastBackup):"Nog nooit gedaan"}</span></div><div class="chev"></div></button>
      </div>
      <div class="list">
        <button class="li" type="button" onclick="Meer.settings()"><div class="li-main"><b>Instellingen</b><span>Thema en oefeningen</span></div><div class="chev"></div></button>
        <button class="li" type="button" onclick="Meer.about()"><div class="li-main"><b>Over deze app</b><span>Hoe het werkt, waar je data staat</span></div><div class="chev"></div></button>
      </div>
      ${!storageOK?`<div class="warnbox">Opslaan werkt niet in deze browser. Exporteer je data voordat je afsluit.</div>`:""}`;
  },

  /* ---- Oefeningen ---- */
  exList(){
    // Gesorteerd op hoofdgroep: een oefening staat onder één kopje, ook als hij
    // meerdere spiergroepen raakt. De rest zie je als je hem opent.
    const hg=e=>exGroepen(e)[0]||"";
    const ex=DB.d.exercises.filter(e=>!e.arch)
      .sort((a,b)=>hg(a)===hg(b)?a.name.localeCompare(b.name):GROEPEN.indexOf(hg(a))-GROEPEN.indexOf(hg(b)));
    let cur="";
    const dub=this.dubbelen();
    const teveel=dub.groepen.length+dub.ongebruikt.length;
    Sheet.open("Oefeningen",`
      <button class="btn primary wide" type="button" onclick="Meer.exNew()">+ Nieuwe oefening</button>
      ${teveel?`<button class="btn wide" type="button" onclick="Meer.dubbelScherm()">Dubbele opruimen · ${teveel}</button>`:""}
      ${ex.map(e=>{
        const kop = hg(e)!==cur ? (cur=hg(e), `<div class="sec-label">${cur}</div>`) : "";
        const h=historyFor(e.id);
        const extra=exGroepen(e).slice(1);
        return kop+`<div class="list" style="margin-top:${kop?"0":"-13px"}"><button class="li" type="button"
          data-oef="${e.id}" onclick="Meer.exEdit('${e.id}')">
          <div class="li-main"><b>${esc(e.name)}</b><span>${extra.length?"+ "+esc(extra.join(", "))+" · ":""}${h.length?h.length+" sessies":"nog niet gebruikt"}</span></div><div class="chev"></div></button></div>`;
      }).join("")}
      <p class="mut" style="margin-top:14px">Veeg een oefening opzij om hem uit deze lijst te halen.
        Heb je hem ooit gelogd, dan blijven je sets gewoon bewaard — hij staat alleen niet meer in de weg.</p>`);
  },

  /* Een oefening uit de lijst vegen. Twee gevallen, en het verschil is niet
     cosmetisch: aan een oefening die hij ooit heeft gelogd hangt geschiedenis.
     Die archiveren we (precies wat de knop "Uit lijst halen" doet), zodat zijn
     logboek, records en grafieken blijven kloppen. Een oefening die hij nooit
     gebruikte mag echt weg. Allebei met ongedaan maken, want vegen gaat per
     ongeluk.                                                                */
  oefWeghalen(id){
    const i=DB.d.exercises.findIndex(e=>e.id===id);
    if(i<0) return;
    const e=DB.d.exercises[i];
    const naam=e.name;
    const gebruikt=historyFor(id).length>0
      || (DB.d.active && DB.d.active.entries.some(x=>x.exId===id));
    if(gebruikt){
      e.arch=true; DB.save();
      toastActie(`${naam} uit je lijst — je sets blijven bewaard`,"Ongedaan maken",
        ()=>{ const t=exById(id); if(t) t.arch=false; DB.save(); this.exList(); });
    } else {
      const kopie=DB.d.exercises.splice(i,1)[0];
      DB.save();
      toastActie(`${naam} verwijderd`,"Ongedaan maken",
        ()=>{ DB.d.exercises.splice(i,0,kopie); DB.save(); this.exList(); });
    }
  },
  /* ---- Dubbele oefeningen opruimen ---------------------------------------
     Twee soorten rommel in zijn lijst. Ten eerste standaardoefeningen uit de
     bibliotheek die hij nooit gebruikt en die naast zijn eigen naam staan:
     "Barbell bench press" (0 keer) naast "Bench press" (56 keer). Die kunnen
     met één knop weg — er hangt geen enkele set aan.

     Ten tweede namen die hij in zijn logboek verschillend heeft geschreven:
     "Tricep rope pulldown" en "Tricep rope cable pulldown". Die samenvoegen
     verplaatst echte sets, dus dat doe ik niet op eigen houtje. Hij kiest zelf
     welke naam blijft; alles wat aan de andere hangt verhuist mee.          */
  telGebruik(){
    const t={};
    for(const s of DB.d.sessions) for(const e of s.entries) t[e.exId]=(t[e.exId]||0)+1;
    if(DB.d.active) for(const e of DB.d.active.entries) t[e.exId]=(t[e.exId]||0)+1;
    return t;
  },
  /* Namen tot hun kern terugbrengen, zodat varianten op één hoop vallen.
     Let op: dit is alleen om kandidaten te vínden, nooit om te beslissen. */
  kern(naam){
    return naam.toLowerCase()
      .replace(/'/g," ").replace(/[^a-z0-9 ]/g," ")
      .replace(/\b(the|met|op|a|an)\b/g," ")
      // "backrow", "back row" en "row" zijn bij hem allemaal hetzelfde: zijn
      // rijen staan onder vijf verschillende namen in het logboek.
      .replace(/\bback\s*row/g,"row")
      // Materiaal en houding zeggen niets over wélke beweging het is.
      // Let op: wide, close, neutral en reverse staan hier bewust NIET bij.
      // Die stonden er eerst wel, en dan belandt een close grip row op dezelfde
      // hoop als een wide grip row — twee oefeningen die echt verschillen.
      .replace(/\b(barbell|bb|dumbbell|dumbell|db|machine|cable|kabel|rope|v|bar|smith|seated|standing|single|one|arm|armed|grip)\b/g," ")
      .replace(/s\b/g,"")                       // meervoud en enkelvoud gelijktrekken
      .replace(/\s+/g," ").trim();
  },
  dubbelen(){
    const g=this.telGebruik();
    const levend=DB.d.exercises.filter(e=>!e.arch);
    const bak={};
    for(const e of levend){
      const k=this.kern(e.name); if(!k) continue;
      (bak[k]=bak[k]||[]).push(e);
    }
    const groepen=[], ongebruikt=[];
    for(const k in bak){
      const lijst=bak[k]; if(lijst.length<2) continue;
      const metHistorie=lijst.filter(e=>g[e.id]);
      const zonder=lijst.filter(e=>!g[e.id]);
      // staat er iets naast dat hij wél gebruikt? dan mag de ongebruikte weg
      if(metHistorie.length && zonder.length) ongebruikt.push(...zonder);
      if(metHistorie.length>1)
        groepen.push({sleutel:k, items:metHistorie.map(e=>({id:e.id,naam:e.name,n:g[e.id]}))
                                                 .sort((a,b)=>b.n-a.n)});
    }
    groepen.sort((a,b)=>b.items[0].n-a.items[0].n);
    return {groepen, ongebruikt};
  },
  dubbelScherm(){
    const {groepen,ongebruikt}=this.dubbelen();
    Sheet.open("Dubbele oefeningen",`
      <p class="mut">Hieronder staan oefeningen die op elkaar lijken. Ik voeg ze niet uit mezelf samen:
        soms zijn het er twee die echt verschillen. Jij bepaalt.</p>
      ${ongebruikt.length?`
        <div class="notebox">${ongebruikt.length} oefeningen uit de standaardlijst staan naast een
          oefening die je wél doet, en je hebt ze zelf nooit gebruikt.
          Bijvoorbeeld <b>${esc(ongebruikt.slice(0,3).map(e=>e.name).join(", "))}</b>.</div>
        <button class="btn primary wide" type="button" onclick="Meer.ruimOngebruikt()">
          ${ongebruikt.length} ongebruikte uit de lijst halen</button>
        <div class="hr"></div>`:""}
      ${groepen.length? groepen.map((gr,i)=>this.dubGroep(gr,i)).join("")
      : `<p class="mut">Geen namen gevonden die op elkaar lijken.</p>`}`);
    this._keuze={};
    groepen.forEach((gr,i)=>this._keuze["dub"+i]={blijft:gr.items[0].id, uit:[], items:gr.items});
    groepen.forEach((gr,i)=>this.tekenGroep("dub"+i));
  },
  dubGroep(gr,i){
    return `<div class="card" style="margin-bottom:10px" id="kaart_dub${i}">
      <div class="list" id="dub${i}"></div>
      <div style="padding:0 14px 13px">
        <p class="mut" style="font-size:12px;margin-bottom:9px">Tik een naam aan om die te laten blijven.
          Met de knop rechts haal je een oefening uit deze samenvoeging — handig als het er toch twee zijn
          die echt verschillen.</p>
        <button class="btn wide" type="button" onclick="Meer.voegSamen('dub${i}')">Samenvoegen</button>
      </div></div>`;
  },
  tekenGroep(id){
    const k=this._keuze[id], box=$("#"+id); if(!k||!box) return;
    box.innerHTML=k.items.map(it=>{
      const uit=k.uit.indexOf(it.id)>=0, blijft=k.blijft===it.id;
      return `<div class="li" style="${uit?"opacity:.45":""}">
        <button type="button" style="flex:1;min-width:0;text-align:left"
          onclick="Meer.kiesBlijver('${id}','${it.id}')">
          <div class="li-main"><b>${esc(it.naam)}</b>
            <span>${it.n}× gelogd${blijft?" · deze naam blijft":(uit?" · doet niet mee":"")}</span></div>
        </button>
        ${blijft?`<span class="chip acc">blijft</span>`
               :`<button class="btn sm ${uit?"":"ghost"}" type="button"
                    onclick="Meer.dubUit('${id}','${it.id}')">${uit?"doe mee":"laat staan"}</button>`}
      </div>`;
    }).join("");
  },
  kiesBlijver(id,exId){
    const k=this._keuze[id]; if(!k) return;
    k.blijft=exId;
    k.uit=k.uit.filter(x=>x!==exId);     // wat blijft, doet per definitie mee
    this.tekenGroep(id);
  },
  dubUit(id,exId){
    const k=this._keuze[id]; if(!k) return;
    const i=k.uit.indexOf(exId);
    if(i>=0) k.uit.splice(i,1); else k.uit.push(exId);
    this.tekenGroep(id);
  },
  async voegSamen(id){
    const k=this._keuze[id]; if(!k) return;
    const blijft=k.blijft;
    const weg=k.items.map(x=>x.id).filter(x=>x!==blijft && k.uit.indexOf(x)<0);
    if(!weg.length) return toast("Er valt niets samen te voegen");
    const namen=weg.map(x=>exName(x)).join(", ");
    if(!await ask("Samenvoegen?",
      `${namen} wordt ${exName(blijft)}. Al je sets blijven bewaard en verhuizen mee.`,"Samenvoegen")) return;
    let verplaatst=0;
    const lijsten=[...DB.d.sessions, ...(DB.d.active?[DB.d.active]:[])];
    for(const s of lijsten){
      for(const e of s.entries) if(weg.indexOf(e.exId)>=0){ e.exId=blijft; verplaatst++; }
      // twee keer dezelfde oefening in één training? samenvoegen tot één blok
      const gezien={};
      s.entries=s.entries.filter(e=>{
        if(gezien[e.exId]){ gezien[e.exId].sets.push(...e.sets); return false; }
        gezien[e.exId]=e; return true;
      });
    }
    for(const r of DB.d.routines) for(const it of r.items) if(weg.indexOf(it.exId)>=0) it.exId=blijft;
    DB.d.exercises=DB.d.exercises.filter(e=>weg.indexOf(e.id)<0);
    DB.save(); Sheet.close(); render();
    toast(`Samengevoegd — ${verplaatst} ${verplaatst===1?"keer":"keer"} verplaatst`);
    this.dubbelScherm();
  },
  async ruimOngebruikt(){
    const {ongebruikt}=this.dubbelen();
    if(!ongebruikt.length) return toast("Er staat niets ongebruikts dubbel");
    if(!await ask("Uit de lijst halen?",
      `${ongebruikt.length} oefeningen die je nooit hebt gebruikt verdwijnen uit je lijst. Er hangen geen sets aan.`,
      "Weghalen")) return;
    const ids=ongebruikt.map(e=>e.id);
    DB.d.exercises=DB.d.exercises.filter(e=>ids.indexOf(e.id)<0);
    DB.save(); Sheet.close(); render();
    toast(`${ids.length} oefeningen weggehaald`);
  },

  exNew(cb){
    Sheet.open("Nieuwe oefening",`
      <div class="field"><label>Naam</label><input class="ctrl" id="nName" placeholder="bijv. Pendlay row" autocomplete="off"></div>
      <div class="field"><label>Spiergroepen</label>
        ${this.kiezer("nGroep",GROEPEN.map(g=>[g,g]),["Borst"])}</div>
      <div class="field"><label>Soort beweging</label>
        ${this.kiezer("nCat",CATS,["push"])}</div>
      <div class="field"><label>Hoe meet je het?</label><select class="ctrl" id="nType">
        <option value="wr">Gewicht × herhalingen</option>
        <option value="bw">Lichaamsgewicht (herhalingen)</option>
        <option value="bw+">Lichaamsgewicht + extra gewicht</option>
        <option value="time">Tijd (seconden)</option>
        <option value="cardio">Cardio (minuten × km)</option></select></div>
      <div class="sec-label">Je doel per training — mag je later nog aanpassen</div>
      <div class="row">
        <div class="field" style="flex:1"><label>Sets</label>
          <input class="ctrl num" id="nSets" inputmode="numeric" value="3"></div>
        <div class="field" style="flex:1"><label>Van</label>
          <input class="ctrl num" id="nMin" inputmode="numeric" value="8"></div>
        <div class="field" style="flex:1"><label>Tot</label>
          <input class="ctrl num" id="nMax" inputmode="numeric" value="12"></div>
        <div class="field" style="flex:1"><label>Stap (kg)</label>
          <input class="ctrl num" id="nStap" inputmode="decimal" value="2,5"></div>
      </div>
      <p class="mut">Hier komt het gewichtsvoorstel uit dat je tijdens een workout boven je sets ziet.
        Bij een nieuwe oefening kan ik dat niet uit je geschiedenis afleiden, dus vul het hier vast in.</p>
      <button class="btn primary wide" type="button" onclick="Meer.exSave(${cb?"true":"false"})">Toevoegen</button>`,
      b=>b.querySelector("#nName").focus());
    this._cb=cb||null;
  },
  exSave(useCb){
    const name=$("#nName").value.trim();
    if(!name) return toast("Geef de oefening een naam");
    const groepen=this.gekozen("nGroep",["Borst"]), cats=this.gekozen("nCat",["push"]);
    const g=(id,t)=>{ const el=$(id); if(!el) return t;
      const v=parseFloat(String(el.value).replace(",",".")); return isNaN(v)?t:v; };
    const min=clamp(Math.round(g("#nMin",8)),1,50);
    const e={id:uid(),name,groep:groepen[0],groepen,cat:cats[0],cats,
             type:$("#nType").value,fav:false,arch:false,
             doel:{sets:clamp(Math.round(g("#nSets",3)),1,10), min,
                   max:clamp(Math.round(g("#nMax",12)),min,60),
                   stap:clamp(g("#nStap",2.5),0.5,25)}};
    DB.d.exercises.push(e); DB.save();
    if(useCb&&this._cb){ const cb=this._cb; this._cb=null; cb(e.id); }
    else { Sheet.close(); toast("Toegevoegd"); render(); }
  },
  exEdit(id){
    const e=exById(id); if(!e) return;
    Sheet.open(e.name,`
      <div class="field"><label>Naam</label><input class="ctrl" id="eName" value="${esc(e.name)}"></div>
      <div class="field"><label>Spiergroepen</label>
        ${this.kiezer("eGroep",GROEPEN.map(g=>[g,g]),exGroepen(e))}</div>
      <div class="field"><label>Soort beweging</label>
        ${this.kiezer("eCat",CATS,exCats(e))}</div>
      ${(()=>{ const d=doelVan(e); return `
      <div class="sec-label">Je doel per training</div>
      <div class="row">
        <div class="field" style="flex:1"><label>Sets</label>
          <input class="ctrl num" id="eSets" inputmode="numeric" value="${d.sets}"></div>
        <div class="field" style="flex:1"><label>Van</label>
          <input class="ctrl num" id="eMin" inputmode="numeric" value="${d.min}"></div>
        <div class="field" style="flex:1"><label>Tot</label>
          <input class="ctrl num" id="eMax" inputmode="numeric" value="${d.max}"></div>
        <div class="field" style="flex:1"><label>Stap (kg)</label>
          <input class="ctrl num" id="eStap" inputmode="decimal" value="${nf(d.stap)}"></div>
      </div>
      <p class="mut">${d.afgeleid?"Afgeleid uit wat je met deze oefening meestal doet — pas gerust aan.":"Zelf ingesteld."}
        Hier komt het gewichtsvoorstel uit dat je tijdens een workout boven je sets ziet.</p>
      <div class="field"><label>Doel: zwaarste set ooit (kg)</label>
        <input class="ctrl num" id="eMax1" inputmode="decimal" placeholder="leeg laten mag"
               value="${e.doel&&e.doel.max1rm?nf(e.doel.max1rm):""}"></div>
      <p class="mut">Vul je hier iets in, dan staat er bij je trainingsvoorstel een balk met hoe ver
        je bent. Die vergelijkt met het zwaarste dat je écht getild hebt, niet met een schatting.</p>`; })()}

  exUpdate(id){
    const e=exById(id);
    e.name=$("#eName").value.trim()||e.name;
    e.groepen=this.gekozen("eGroep",exGroepen(e)); e.groep=e.groepen[0];
    e.cats   =this.gekozen("eCat",  exCats(e));    e.cat  =e.cats[0];
    // doel per training
    const g=(id,t)=>{ const el=$(id); if(!el) return t;
      const v=parseFloat(String(el.value).replace(",",".")); return isNaN(v)?t:v; };
    const oud=doelVan(e);
    const min=clamp(Math.round(g("#eMin",oud.min)),1,50);
    const m1=g("#eMax1",0);
    e.doel={
      sets: clamp(Math.round(g("#eSets",oud.sets)),1,10),
      min,
      max:  clamp(Math.round(g("#eMax",oud.max)),min,60),
      stap: clamp(g("#eStap",oud.stap),0.5,25),
      max1rm: m1>0 ? clamp(m1,1,500) : null
    };
    DB.save(); Sheet.close(); toast("Opgeslagen"); render();
  },

  /* ---- Meerkeuze-knopjes -------------------------------------------------
     Eén rij knopjes waarvan je er zoveel mag aantikken als je wilt. De volgorde
     waarin je tikt telt: de eerste is de hoofdgroep. Die staat op het chipje bij
     de oefening en bepaalt onder welk kopje hij in de lijst staat. De rest telt
     gewoon mee in je weekoverzicht en in het trainingsvoorstel.              */
  _sel:{}, _lab:{}, _hint:{}, _leeg:{},
  /* `hint` overschrijft het regeltje eronder, `magLeeg` laat toe dat je alles
     uitzet — handig voor blessures: geen enkele is het beste antwoord. */
  kiezer(id,opties,gekozen,hint,magLeeg){
    const geldig=gekozen.filter(v=>opties.some(o=>o[0]===v));
    this._sel[id]= geldig.length ? geldig.slice() : (magLeeg?[]:[opties[0][0]]);
    this._lab[id]=Object.fromEntries(opties);
    this._hint[id]=hint||null;
    this._leeg[id]=!!magLeeg;
    return `<div class="multi" id="${id}">${opties.map(([v,l])=>
      `<button type="button" data-v="${v}"
         class="${this._sel[id].indexOf(v)>=0?"on":""}${(this._sel[id].length>1&&this._sel[id][0]===v)?" eerste":""}"
         onclick="Meer.tik('${id}','${v}')">${l}</button>`).join("")}</div>
      <p class="mut" id="${id}_h" style="margin-top:7px">${this.hint(id)}</p>`;
  },
  tik(id,v){
    const a=this._sel[id]||[];
    const i=a.indexOf(v);
    if(i>=0){
      if(a.length===1 && !this._leeg[id]) return toast("Er moet er minstens één aanstaan");
      a.splice(i,1);
    } else a.push(v);
    // Alle knopjes opnieuw kleuren, want de eerste keuze kan verschoven zijn
    const box=$("#"+id); if(!box) return;
    box.querySelectorAll("button").forEach(b=>{
      const w=b.dataset.v;
      b.classList.toggle("on",a.indexOf(w)>=0);
      b.classList.toggle("eerste",a.length>1&&a[0]===w);
    });
    const h=$("#"+id+"_h"); if(h) h.textContent=this.hint(id);
  },
  hint(id){
    if(this._hint[id]) return this._hint[id];
    const a=this._sel[id]||[], L=this._lab[id]||{};
    if(a.length<2) return "Tik er meer aan als de oefening er meerdere raakt.";
    return "Hoofd: "+(L[a[0]]||a[0])+" — de rest telt mee in je weekoverzicht.";
  },
  gekozen(id,terugval){
    const a=this._sel[id];
    if(a && (a.length || this._leeg[id])) return a.slice();
    return terugval.slice();
  },
  exArch(id){ exById(id).arch=true; DB.save(); Sheet.close(); toast("Verborgen"); render(); },
  togVoorstel(id,btn){
    const e=exById(id);
    e.nietVoorstellen=!e.nietVoorstellen;
    btn.classList.toggle("on",!!e.nietVoorstellen);

  toCSV(){
    const rows=[["datum","training","oefening","spiergroep","set","soort","gewicht_kg","herhalingen","rpe","e1rm"]];
    for(const s of allSessions().reverse()){
      for(const e of s.entries){
        const ex=exById(e.exId)||{name:"?",groep:"?"};
        e.sets.forEach((x,i)=>rows.push([s.date,s.name||"Training",ex.name,ex.groep,i+1,
          x.t||"work",x.w??"",x.r??"",x.rpe??"",x.w&&x.r?Math.round(e1rm(x.w,x.r)*10)/10:""]));
      }
    }
    return rows.map(r=>r.map(v=>{
      const t=String(v); return /[",;\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
    }).join(";")).join("\n");
  },
  async download(name,data){
    S().lastBackup=today(); DB.save();
    // 1. voorkeur: de download-functie van het platform
    try{
      const dl = window.claude && claude.use ? await claude.use("downloads") : null;
      if(dl){ await dl.save({filename:name,data}); toast("Opgeslagen"); return; }
    }catch(e){ /* geweigerd of niet beschikbaar */ }
    // 2. anders: gewone browserdownload
    try{
      const blob=new Blob([data],{type:name.endsWith(".csv")?"text/csv":"application/json"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download=name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      toast("Gedownload");
    }catch(e){ toast("Downloaden lukt niet — kopieer de tekst hieronder"); }
  },
  async copy(){
    try{ await navigator.clipboard.writeText(JSON.stringify(DB.d)); S().lastBackup=today(); DB.save(); toast("Gekopieerd naar klembord"); }
    catch(e){ const t=$("#expTxt"); if(t){ t.focus(); t.select(); } toast("Kopieer de tekst hieronder met de hand"); }
  },
  async restore(){
    const raw=$("#impJson").value.trim(); if(!raw) return toast("Plak eerst een back-up");
    let d; try{ d=JSON.parse(raw); }catch(e){ return toast("Dit is geen geldige back-up"); }
    if(!d||!Array.isArray(d.sessions)) return toast("Dit is geen geldige back-up");
    if(await ask("Terugzetten?",`Dit vervangt je huidige data door de back-up (${d.sessions.length} trainingen).`,"Terugzetten",true)){
      DB.d=d; const f=DB.fresh();
      for(const k in f) if(DB.d[k]===undefined) DB.d[k]=f[k];
      DB.save(); Sheet.close(); go("log"); toast("Teruggezet");
    }
  },
